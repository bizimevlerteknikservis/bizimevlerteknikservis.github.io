<style>
:root{
  --bg:#eef3f9; --panel:#ffffff; --panel2:#f5f8fc; --ink:#10233d; --muted:#5f7591; --line:#dde6f0;
  --accent:#2b7cd3; --ok:#1e9d5b; --warn:#d9851b; --bad:#d63a35;
  --okbg:#e6f6ed; --warnbg:#fdf1e1; --badbg:#fdeaea; --accbg:#e7f0fb; --tatil:#fff4d6;
  --shadow:0 8px 24px rgba(16,40,80,.07); color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#081320; --panel:#0f1f33; --panel2:#0b192a; --ink:#e4eef9; --muted:#8ea6bf; --line:#1d3350;
  --accent:#5bb0ff; --ok:#36c47a; --warn:#f0a43a; --bad:#ff6b66;
  --okbg:rgba(54,196,122,.14); --warnbg:rgba(240,164,58,.14); --badbg:rgba(255,107,102,.14); --accbg:rgba(91,176,255,.13); --tatil:rgba(240,164,58,.10);
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#081320; --panel:#0f1f33; --panel2:#0b192a; --ink:#e4eef9; --muted:#8ea6bf; --line:#1d3350;
  --accent:#5bb0ff; --ok:#36c47a; --warn:#f0a43a; --bad:#ff6b66;
  --okbg:rgba(54,196,122,.14); --warnbg:rgba(240,164,58,.14); --badbg:rgba(255,107,102,.14); --accbg:rgba(91,176,255,.13); --tatil:rgba(240,164,58,.10);
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{max-width:1400px;margin:0 auto;padding:14px 14px 40px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(140deg,#17588f,#2f8ad6);display:grid;place-items:center;color:#fff;flex:none;font-size:24px}
.brand small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand h1{margin:0;font-size:22px;font-weight:800}
.top .sag{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ibtn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;color:var(--ink);white-space:nowrap}
.ibtn:hover{border-color:var(--accent)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ay{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px}
.ay b{min-width:120px;text-align:center;font-size:15px}
.ay button{border:0;background:transparent;font-size:18px;font-weight:800;padding:4px 10px;border-radius:10px;cursor:pointer;color:var(--accent)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:8px 12px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;font-size:14px;white-space:nowrap}
.btn.yesil{background:var(--ok)}.btn.ikincil{background:var(--accbg);color:var(--accent)}.btn.kirmizi{background:var(--badbg);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{margin:0 0 10px;font-size:12.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.onay{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.adim{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:13.5px;font-weight:600}
.adim.tamam{background:var(--okbg);border-color:transparent;color:var(--ok)}
.adim small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.uyari{background:var(--warnbg);color:var(--warn);border-radius:14px;padding:10px 14px;font-size:13.5px;font-weight:600;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.uyari .btn{padding:7px 12px;font-size:13px}
/* tablo */
.tw{overflow:auto;max-height:calc(100vh - 230px);border:1px solid var(--line);border-radius:16px;background:var(--panel)}
table.pt{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.pt th,.pt td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center;white-space:nowrap}
.pt thead th{position:sticky;top:0;z-index:3;background:var(--panel);font-weight:700;color:var(--muted);padding:5px 0;font-size:11.5px;line-height:1.15}
.pt thead th b{display:block;color:var(--ink);font-size:12.5px}
.pt th.ad,.pt td.ad{position:sticky;left:0;z-index:2;background:var(--panel);text-align:left;padding:6px 10px;min-width:150px;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.pt thead th.ad{z-index:4}
.pt td.ad b{display:block;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.pt td.ad small{color:var(--muted);font-size:11.5px}
.pt td.ad a{color:inherit;text-decoration:none;cursor:pointer}
.pt tr.grup td{background:var(--panel2);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 10px}
.pt tr.grup td.ad{background:var(--panel2)}
.pt .tat{background:var(--tatil)}
.pt .hs{background:color-mix(in srgb, var(--panel2) 70%, transparent)}
.pt .bugun{box-shadow:inset 0 0 0 2px var(--accent)}
.c{width:32px;min-width:32px;height:34px;cursor:pointer;position:relative;font-weight:800;font-size:11.5px}
.c span{display:grid;place-items:center;width:100%;height:100%}
.c:hover{outline:2px solid var(--accent);outline-offset:-2px}
.c.elle span{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px}
.c i.qr{position:absolute;right:2px;top:2px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.c i.gece{position:absolute;left:2px;top:1px;font-style:normal;font-size:8px;opacity:.7}
.c.uyar span{box-shadow:inset 0 0 0 2px var(--bad);border-radius:4px}
.c i.ms{position:absolute;left:4px;right:4px;bottom:2px;height:3px;border-radius:2px;background:#2b7cd3}
.c i.ms.eksik{background:#d9851b}
.c i.ms.supheli{background:#d63a35;height:4px}
.iste{background:var(--okbg);color:var(--ok);border-radius:14px;padding:10px 14px;font-size:13.5px;margin-bottom:12px}
.iste small{opacity:.75}
.iste .ik{display:inline-flex;align-items:center;gap:6px;margin:4px 10px 0 0;white-space:nowrap}
.kz{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:#fff;color:var(--ok);text-decoration:none;border:1px solid currentColor}
.kz.uzak{color:#c62828}.kz.yok{color:#b26a00}
.pms{font-size:13px;line-height:1.9;margin-top:8px;padding-top:8px;border-top:1px solid var(--line,#e3e9f2)}
.k-X{color:var(--ink)}
.k-HT{color:var(--muted);background:var(--panel2)}
.k-Yİ{background:#e3f2ff;color:#1b5ea8}.k-R{background:#fde7e7;color:#b4232a}.k-Mİ{background:#efe7fb;color:#6a3fb5}.k-Üİ{background:#eceff3;color:#4a5a6d}
.k-D{background:#d63a35;color:#fff}.k-X.gk2{background:#1d3557;color:#fff}.k-X.gk3{background:#e7dcff;color:#4b2a8a}.k-RT{background:#fff0c7;color:#8a5a00}
:root[data-theme="dark"] .k-Yİ,:root[data-theme="dark"] .k-R,:root[data-theme="dark"] .k-Mİ,:root[data-theme="dark"] .k-Üİ,:root[data-theme="dark"] .k-RT{filter:brightness(.55) saturate(1.3);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .k-Yİ,:root:not([data-theme="light"]) .k-R,:root:not([data-theme="light"]) .k-Mİ,:root:not([data-theme="light"]) .k-Üİ,:root:not([data-theme="light"]) .k-RT{filter:brightness(.55) saturate(1.3);color:#fff}}
.pt td.top{padding:0 8px;font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px;min-width:40px}
.pt td.top.zero{color:var(--muted);font-weight:500}
.pt td.fm input{width:52px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:5px;text-align:center}
.pt td.not input{width:150px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:5px 7px}
.lej{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;font-size:12.5px}
.lej span{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.lej b{min-width:22px;text-align:center;border-radius:5px;padding:1px 3px}
.kontrol li{margin:4px 0;font-size:13.5px}
/* açılır seçici */
.pop{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.3);padding:10px;width:250px}
.pop h4{margin:0 0 8px;font-size:13px}
.pop h4 small{display:block;color:var(--muted);font-weight:500}
.pop .kodlar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pop .kodlar button{border:1px solid var(--line);border-radius:10px;padding:8px 0;font-weight:800;cursor:pointer;background:transparent}
.pop .kodlar button[aria-pressed="true"]{outline:2px solid var(--accent)}
.pop .kodlar button.k-D{background:#d63a35;color:#fff;border-color:#d63a35}.pop .kodlar button.gk2{background:#1d3557;color:#fff;border-color:#1d3557}.pop .kodlar button.gk3{background:#e7dcff;color:#4b2a8a;border-color:#b9a3ef}.pop .kodlar button[aria-pressed="true"]{outline-offset:2px}
.pop .oto{margin-top:8px;width:100%}
.pop p{margin:8px 0 0;font-size:12px;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,12,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.mic{background:var(--panel);border-radius:22px;width:min(720px,100%);padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.mic .bas{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mic .bas h3{margin:0;font-size:19px}
.mic .bas button{margin-left:auto}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.form .tam{grid-column:1/-1}
.inp,.sel{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:9px 12px;color:var(--ink);font-weight:500}
@media (max-width:560px){.form{grid-template-columns:1fr}}
.desen{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.desen button.g{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);font-weight:800;cursor:pointer}
.desen .G{background:#fff4d6;color:#8a5a00}.desen .N{background:#1d3557;color:#fff}.desen .A{background:#e7dcff;color:#4b2a8a}.desen .HT{background:var(--panel2);color:var(--muted)}
.onizle{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
.onizle span{width:30px;text-align:center;font-size:11px;border-radius:6px;padding:3px 0}
.vd{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;transition:.3s;z-index:80;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.giris{max-width:380px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow)}
.giris input{width:100%;margin-top:10px}
.mut{color:var(--muted)}.ok{color:var(--ok)}.bad{color:var(--bad)}
/* ---- modern düzen ---- */
.bosluk{flex:1}
.islem{display:flex;gap:8px;align-items:center}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px}.menu summary::-webkit-details-marker{display:none}
.menu .ok-a{font-size:11px;color:var(--muted)}
.menu-ic{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px rgba(10,30,60,.18);padding:6px;width:280px}
.menu-ic button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:10px 12px;cursor:pointer}
.menu-ic button:hover{background:var(--panel2)}.menu-ic b{display:block;font-size:14px}.menu-ic small{color:var(--muted);font-size:12px}
.ozet{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}
.oz{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);min-width:0;text-align:left;cursor:default}
.oz small{display:block;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oz strong{display:block;font-size:26px;font-weight:800;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.oz em{display:block;font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oz.yesil strong{color:var(--ok)}.oz.turuncu strong{color:var(--warn)}.oz.kirmizi strong{color:var(--bad)}.oz.mavi strong{color:var(--accent)}
button.oz{cursor:pointer;font:inherit;color:inherit}button.oz:hover{border-color:var(--accent)}
.iste-l{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 12px}.iste-l .ik{display:inline-flex;align-items:center;gap:6px;background:var(--okbg);color:var(--ok);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px;font-weight:600}
.iste-l .ik small{opacity:.75;font-weight:500}
/* onay şeridi */
.serit{display:flex;align-items:center;gap:0;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
.serit .adim{background:transparent;border:0;padding:4px 6px}
.serit .adim .no{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--panel2);color:var(--muted);border:2px solid var(--line);flex:none}
.serit .adim.tamam .no{background:var(--ok);border-color:var(--ok);color:#fff}
.serit .adim.sira .no{border-color:var(--accent);color:var(--accent)}
.serit .cizgi{flex:0 0 28px;height:2px;background:var(--line);margin:0 2px}.serit .cizgi.tamam{background:var(--ok)}
.serit .eylem{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* filtre */
.filtre{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.ara{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 10px;font-size:14px}
.ara input{border:0;background:transparent;padding:8px 2px;width:170px;outline:none}
.cips{display:flex;gap:6px;flex-wrap:wrap}
.cip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.cip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.cip.sorun[aria-pressed="false"] b{color:var(--bad)}
.ibtn.kucuk{padding:6px 10px;font-size:13px}
.pt tr.flas td{animation:flas 1.6s ease}
@keyframes flas{0%,40%{background:var(--accbg)}100%{}}
.pt td.ad .sorun-n{display:inline-block;margin-left:6px;background:var(--badbg);color:var(--bad);border-radius:999px;font-size:10.5px;font-weight:800;padding:0 6px;vertical-align:1px}
/* lejant */
.lejd{margin-top:8px}.lejd summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);padding:4px 2px}
/* kontrol */
#kontrol h2 .say{display:inline-block;margin-left:6px;background:var(--badbg);color:var(--bad);border-radius:999px;padding:1px 9px;letter-spacing:0;font-size:12px}
.kgen{list-style:none;padding:0;margin:0 0 10px}.kgen li{padding:8px 10px;border-radius:10px;background:var(--panel2);margin-bottom:6px;font-size:13.5px}
.kk{border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.kk summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;flex-wrap:wrap}.kk summary::-webkit-details-marker{display:none}
.kk summary b{font-size:14.5px}.kk summary .n{background:var(--badbg);color:var(--bad);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:800}
.kk summary .t{font-size:12px;color:var(--muted);background:var(--panel2);border-radius:999px;padding:2px 8px}
.kk summary .ok-a{margin-left:auto;color:var(--muted);transition:.2s}.kk[open] summary .ok-a{transform:rotate(180deg)}
.kk ul{list-style:none;margin:0;padding:0 8px 8px}
.kk li{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-top:1px solid var(--line);font-size:13.5px}
.kk li .g{flex:none;min-width:52px;font-weight:800;color:var(--ink)}
.kk li .m{flex:1;color:var(--ink)}
.kk li button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:4px 10px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--accent)}
@media (max-width:1100px){.ozet{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){
  .brand h1{font-size:19px}.tw{max-height:calc(100vh - 120px)}
  .pt th.ad,.pt td.ad{min-width:112px;max-width:122px;padding:5px 7px}.pt td.ad b{font-size:12.5px}
  .bar{gap:6px}.ay{flex:1}.ay b{flex:1;min-width:0}.seg{width:100%}.seg button{flex:1}
  .bosluk{display:none}
  .islem{width:100%;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}.islem>*{flex:none}
  .menu-ic{position:fixed;left:12px;right:12px;top:auto;width:auto}
  header.top{flex-wrap:nowrap;gap:10px}.top .sag{flex-wrap:nowrap}.logo{width:40px;height:40px;font-size:20px}.brand{min-width:0}.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ozet{display:flex;overflow-x:auto;gap:8px;margin:0 -14px 12px;padding:0 14px 4px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  .oz{flex:0 0 138px;padding:9px 11px;scroll-snap-align:start;border-radius:14px}.oz strong{font-size:21px}.oz small{font-size:11.5px}.oz em{font-size:11px}

<script type="module">
/* =====================================================================
   Bizimevler · Puantaj
   puantaj/ayar      { kisiler:{key:{ad,grup,vardiya,duzen,gunler,aktif,sira}}, desen:{vardiya:{seq:"G,G,N,N,HT,HT",baz:"YYYY-MM-DD"}}, desenOnay }
   puantaj/{YYYY-MM} { kisi:{key:{gun:{"5":"R"}, fm, not}}, onay:{guvenlik:{amir,mudur}, temizlik:{mudur}}, kesin:{grup:{key:"X,X,HT,..."}} }
   Otomatik: vardiya deseni (güvenlik) · hafta sonu çalışma listesi (temizlik) · İzinler · resmi tatil · devriye QR (kontrol)
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2,"0");
const AY = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const GK = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
const GUN = 864e5;
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const ymdT = s => { const [y,m,g] = String(s).split("-").map(Number); return new Date(y, m-1, g, 12); };
const anahtar = ad => String(ad||"").trim().toLocaleLowerCase("tr").replace(/[çğıöşü]/g, c=>({ç:"c",ğ:"g",ı:"i",ö:"o",ş:"s",ü:"u"}[c])).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const adKok = x => String(x||"").trim().split(/\s+/)[0].toLocaleUpperCase("tr");
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(()=>t.classList.remove("on"), 2800); }

const KODLAR = {
  "X":  {ad:"Çalıştı"}, "HT": {ad:"Hafta tatili"}, "Yİ": {ad:"Yıllık izin"}, "R": {ad:"Rapor"},
  "Mİ": {ad:"Mazeret izni"}, "Üİ": {ad:"Ücretsiz izin"}, "D": {ad:"Devamsız (gelmedi)"}, "RT": {ad:"Resmi tatil (çalışmadı)"}
};
const IZIN_KOD = {yillik:"Yİ", rapor:"R", mazeret:"Mİ", ucretsiz:"Üİ"};
const GRUP_AD = {guvenlik:"🛡️ Güvenlik", temizlik:"🧹 Temizlik", bahce:"🌿 Bahçe", diger:"👷 Diğer"};
/* Resmi tatiller (tam gün) ve yarım günler. Yeni yılın dini bayramları eklenmeli. */
const SABIT_TATIL = {"01-01":"Yılbaşı","04-23":"23 Nisan","05-01":"1 Mayıs","05-19":"19 Mayıs","07-15":"15 Temmuz","08-30":"30 Ağustos","10-29":"Cumhuriyet Bayramı"};
const DINI_TATIL = {"2026-03-20":"Ramazan Bayramı","2026-03-21":"Ramazan Bayramı","2026-03-22":"Ramazan Bayramı","2026-05-27":"Kurban Bayramı","2026-05-28":"Kurban Bayramı","2026-05-29":"Kurban Bayramı","2026-05-30":"Kurban Bayramı",
  "2027-03-09":"Ramazan Bayramı","2027-03-10":"Ramazan Bayramı","2027-03-11":"Ramazan Bayramı","2027-05-16":"Kurban Bayramı","2027-05-17":"Kurban Bayramı","2027-05-18":"Kurban Bayramı","2027-05-19":"Kurban Bayramı"};
const YARIM = {"2026-03-19":"Arife (yarım gün)","2026-05-26":"Arife (yarım gün)","2027-03-08":"Arife (yarım gün)","2027-05-15":"Arife (yarım gün)"};
const tatil = d => { const s = ymd(d); return DINI_TATIL[s] || SABIT_TATIL[s.slice(5)] || null; };
const yarim = d => { const s = ymd(d); return YARIM[s] || (s.slice(5)==="10-28" ? "28 Ekim (yarım gün)" : null); };

const VARDIYA = [
  {ad:"1. Vardiya", kisiler:[["Rüstem Eryüksel",1],["Ali Vesek"],["Eray Polat"],["Tayfun Özdemir"],["Erkan Bavkir"]]},
  {ad:"2. Vardiya", kisiler:[["Yakup Erol",1],["Cihan Yıldırım"],["Serkan Çinibulak"],["Mehmet Ünal"]]},
  {ad:"3. Vardiya", kisiler:[["Nejdet Baydemir",1],["Yalçın Akyol"],["Berke Dursun Tuncer"],["Yusuf Nazlım"]]},
  {ad:"Joker", kisiler:[]}
];
/* 12 saatlik düzen: 2 gündüz (1) · 2 gece (2) · 2 tatil (T). Başlangıç günleri yönetimin Eylül 2026 çalışma programından alındı:
   1. Vardiya 6 Eylül'de, 3. Vardiya 2 Eylül'de, 2. Vardiya 4 Eylül'de gündüze başlıyor (6 günde bir tekrar). */
const ESKI_CIZELGE = {"1. Vardiya":{seq:"G,G,N,N,HT,HT", baz:"2026-08-31"}, "2. Vardiya":{seq:"G,G,N,N,HT,HT", baz:"2026-09-04"}, "3. Vardiya":{seq:"G,G,N,N,HT,HT", baz:"2026-09-02"}};
/* Çizelgedeki görev unvanları (V.AMİRİ · ÖGG · DNŞM). Kişi kartından değiştirilebilir. */
const GOREV_VARSAYILAN = {"rustem-eryuksel":"V.AMİRİ","ali-vesek":"ÖGG","eray-polat":"DNŞM","tayfun-ozdemir":"DNŞM","nejdet-baydemir":"V.AMİRİ","yalcin-akyol":"ÖGG","berke-dursun-tuncer":"DNŞM","yusuf-nazlim":"DNŞM","yakup-erol":"V.AMİRİ","cihan-yildirim":"ÖGG","serkan-cinibulak":"ÖGG","mehmet-unal":"ÖGG","erkan-bavkir":"DNŞM"};
const DESEN_VARSAYILAN = {...ESKI_CIZELGE, "Joker":{seq:"G,G,G,G,G,HT,HT", baz:"2026-11-02"}};

/* ================= durum ================= */
const P = { ay:null, grup:"guvenlik", ayar:{kisiler:{}, desen:{}}, doc:{kisi:{}, onay:{}, kesin:{}}, izin:[], plan:null, qr:{}, mesai:[], degisim:[], rol:{tech:false, tesis:false, yon:false}, kim:"", ayarGeldi:false };
let DB = null;
const now = new Date(); P.ay = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;
const ayBilgi = () => { const [y,m] = P.ay.split("-").map(Number); const n = new Date(y, m, 0).getDate(); return {y, m, n, gunler: Array.from({length:n}, (_,i)=>new Date(y, m-1, i+1, 12))}; };
const gorurGrup = g => P.rol.tech || P.rol.tesis || (P.rol.yon && g==="guvenlik");
const duzenler = () => P.rol.tech || P.rol.tesis || P.rol.yon;

/* Kişi listesi: kayıtlı liste yoksa vardiya listesi ve temizlik çalışma listesinden kurulur */
function kisiler(){
  const K = {...(P.ayar.kisiler||{})};
  if (!Object.keys(K).length){
    let s = 0;
    VARDIYA.forEach(v=>v.kisiler.forEach(([ad, amir])=>{ K[anahtar(ad)] = {ad, grup:"guvenlik", vardiya:v.ad, amir:!!amir, aktif:true, sira:s++}; }));
    const pl = P.plan; const T = pl ? [...pl.cmt, ...pl.paz].map(r=>r[0]).filter(Boolean) : [];
    [...new Set(T.map(adKok))].sort((a,b)=>a.localeCompare(b,"tr")).forEach(ad=>{ K[anahtar(ad)] = {ad, grup:"temizlik", duzen:"temizlik", aktif:true, sira:s++}; });
  }
  return K;
}
/* Temizlik sekmesi: önce bölüm (Temizlik → Bahçe → Diğer), aynı bölüm tek başlık altında */
const GRUP_SIRA = x => x==="bahce" ? 1 : x==="diger" ? 2 : 0;
const grupKisileri = g => Object.entries(kisiler()).filter(([k,v])=>v.aktif!==false && (v.grup===g || (g==="temizlik" && (v.grup==="bahce" || v.grup==="diger")))).sort((a,b)=>(g!=="guvenlik" ? GRUP_SIRA(a[1].grup)-GRUP_SIRA(b[1].grup) : 0) || (a[1].vardiya||"").localeCompare(b[1].vardiya||"","tr",{numeric:true}) || (b[1].amir?1:0)-(a[1].amir?1:0) || (a[1].sira??0)-(b[1].sira??0) || a[1].ad.localeCompare(b[1].ad,"tr"));

/* Temizlik hafta sonu dönüşümü (index.html ile aynı kural) */
const cmtBul = d => { d = new Date(d); d.setHours(12,0,0,0); const g = d.getDay(); if (g === 0) d.setDate(d.getDate()-1); else d.setDate(d.getDate() + (6 - g)); return d; };
function haftaSonu(plan, gun){ const fark = Math.round((cmtBul(gun) - cmtBul(plan.baz)) / (7*GUN)); const tek = Math.abs(fark) % 2 === 1; return {cmtL: tek ? plan.paz : plan.cmt, pazL: tek ? plan.cmt : plan.paz}; }
const cift = L => (L||[]).map(r => Array.isArray(r) ? r : [r.ad || "", r.blok || ""]);
const TARIH_RE = /(\d{1,2})[./](\d{1,2})[./](\d{4})/;
function planCoz(v){
  if (!v) return null;
  if (v.cmt && v.paz && v.baz) return {baz:new Date(v.baz), cmt:cift(v.cmt), paz:cift(v.paz)};
  if (!v.gunler) return null; let baz = null, cmt = [], paz = [];
  v.gunler.forEach(g=>{ const m = String(g.baslik||"").match(TARIH_RE); if (!m) return; const d = new Date(+m[3], +m[2]-1, +m[1], 12);
    if (d.getDay()===6){ cmt = cift(g.satir); baz = d; } else if (d.getDay()===0){ paz = cift(g.satir); if (!baz){ baz = new Date(d); baz.setDate(d.getDate()-1); } } });
  return baz ? {baz:cmtBul(baz), cmt, paz} : null;
}
const gunFark = (a, b) => Math.round((new Date(a).setHours(12,0,0,0) - new Date(b).setHours(12,0,0,0)) / GUN);

/* Onaylı vardiya değişimi (güvenlik): o gün talep eden izinli, yerine geçen onun vardiyasında çalışır */
function oto(key, k, d){
  const s = ymd(d), o = otoTemel(key, k, d);
  for (const v of P.degisim){
    for (const [g, ben, ot] of [[v.tarih, v.ad, v.karsi], [v.karsiTarih, v.karsi, v.ad]]){
      if (!g || g !== s) continue;
      if (anahtar(ben) === anahtar(k.ad)) return {kod:"HT", neden:`Vardiya değişimi: yerine ${ot} çalıştı`, gece:false, degisim:true};
      if (anahtar(ot) === anahtar(k.ad)){ const x = Object.entries(kisiler()).find(([,kk]) => anahtar(kk.ad) === anahtar(ben)); const b = x ? otoTemel(x[0], x[1], d) : {gece:false};
        return {kod:"X", neden:`Vardiya değişimi: ${ben} yerine çalıştı`, gece:!!b.gece, degisim:true}; }
    }
  }
  return o;
}
/* Mesai saatleri (⏰): uyarılar ve geç kalma hesabı için. Bildirim sunucusu da aynı ayarı okur. */
const SAAT_VARSAYILAN = {temizlik:{bas:"08:00", bit:"17:00"}, bahce:{bas:"08:00", bit:"17:00"}, diger:{bas:"08:00", bit:"17:00"}, G:{bas:"08:00", bit:"20:00"}, N:{bas:"20:00", bit:"08:00"}, A:{bas:"13:00", bit:"21:00"}, tolerans:15, gelmeyen:true, cikis:true};
function saatAyar(){ const x = P.ayar.saat || {}, D = SAAT_VARSAYILAN; return {...D, ...x, temizlik:{...D.temizlik, ...(x.temizlik||{})}, bahce:{...D.bahce, ...(x.bahce||{})}, diger:{...D.diger, ...(x.diger||{})}, G:{...D.G, ...(x.G||{})}, N:{...D.N, ...(x.N||{})}, A:{...D.A, ...(x.A||{})}}; }
/* O günkü girişte kaç dakika geç kalmış (tolerans içindeyse 0) */
function gecDk(k, d, o, gece, ara){
  if (!o || !o.giris) return 0; const S = saatAyar();
  const v = k.grup==="guvenlik" ? (gece ? S.N : ara ? S.A : S.G) : (S[k.grup] || S.temizlik);
  const [h, dk] = String(v.bas).split(":").map(Number); const bas = new Date(d); bas.setHours(h, dk, 0, 0);
  const fark = Math.round((o.giris - bas.getTime())/6e4);
  return fark > (+S.tolerans || 15) && fark < 8*60 ? fark : 0;
}
/* Bir kişinin bir gününün otomatik kodu ve nedeni (vardiya değişimi hariç) */
function otoTemel(key, k, d){
  let kod = "X", neden = "", gece = false, ara = false;
  if (k.grup==="guvenlik"){
    const ds = (P.ayar.desen||{})[k.vardiya] || DESEN_VARSAYILAN[k.vardiya];
    if (ds){ const seq = ds.seq.split(","); const i = ((gunFark(d, ymdT(ds.baz)) % seq.length) + seq.length) % seq.length; const s = seq[i];
      kod = s==="HT" ? "HT" : "X"; gece = s==="N"; ara = s==="A"; neden = s==="HT" ? "Vardiya düzeni: izin günü" : s==="N" ? "Vardiya düzeni: gece (20–08)" : s==="A" ? "Vardiya düzeni: ara vardiya (13–21)" : "Vardiya düzeni: gündüz (08–20)"; }
    else { kod = d.getDay()===0 ? "HT" : "X"; neden = "Vardiya düzeni girilmedi"; }
  } else if (k.duzen==="temizlik" || (k.grup==="temizlik" && !k.gunler)){
    const g = d.getDay();
    if (g>=1 && g<=5){ kod = "X"; neden = "Hafta içi"; }
    else if (!P.plan){ kod = "HT"; neden = "Hafta sonu listesi yok"; }
    else { const h = haftaSonu(P.plan, d), L = g===6 ? h.cmtL : h.pazL; const var_ = L.some(([ad])=>adKok(ad)===adKok(k.ad));
      kod = var_ ? "X" : "HT"; neden = var_ ? `Çalışma listesinde ${g===6?"Cumartesi":"Pazar"}` : "Hafta sonu izinli (çalışma listesi)"; }
  } else { const G = k.gunler || [1,2,3,4,5,6]; kod = G.includes(d.getDay()) ? "X" : "HT"; neden = kod==="X" ? "Çalışma günü" : "Hafta tatili"; }
  const t = tatil(d);
  if (t && kod==="X" && k.grup!=="guvenlik"){ kod = "RT"; neden = t; }
  const iz = izinBul(k, d);
  if (iz && kod!=="HT"){ kod = IZIN_KOD[iz.tur] || "Yİ"; neden = `İzinler: ${({yillik:"Yıllık izin",rapor:"Rapor",mazeret:"Mazeret",ucretsiz:"Ücretsiz izin"})[iz.tur]||"İzin"}${iz.not?" · "+iz.not:""}`; gece = false; ara = false; }
  return {kod, neden, gece, ...(ara ? {ara:true} : {})};
}
function izinBul(k, d){
  const s = ymd(d);
  return P.izin.find(e => e.bas <= s && (e.bit||e.bas) >= s && (
    (k.grup==="guvenlik" && (e.grup==="guvenlik") && anahtar(e.ad)===anahtar(k.ad)) ||
    (k.grup!=="guvenlik" && (e.grup||"temizlik")!=="guvenlik" && adKok(e.ad)===adKok(k.ad))));
}
/* Hücrenin son değeri: müdür onayı varsa kesin kayıt, yoksa elle değişiklik ya da otomatik */
function hucre(key, k, d, gi){
  const g = grupOf(k), kes = ((P.doc.kesin||{})[g]||{})[key];
  const o = oto(key, k, d);
  if (kes){ const kod = kes.split(",")[gi]; if (kod === "1" || kod === "2" || kod === "3") return {kod:"X", kesin:true, elle:false, neden:o.neden, gece:kod === "2", ...(kod === "3" ? {ara:true} : {})}; return {kod, kesin:true, elle:false, neden:o.neden, gece:o.gece}; }
  const el = (((P.doc.kisi||{})[key]||{}).gun||{})[String(gi+1)];
  if (el === "1" || el === "2" || el === "3") return {kod:"X", elle:true, neden:`Elle değiştirildi · otomatik: ${gKod(o, k)}`, gece:el === "2", ...(el === "3" ? {ara:true} : {}), oto:o.kod};
  if (el) return {kod:el, elle:true, neden:`Elle değiştirildi · otomatik: ${o.kod}`, gece:el === "X" && o.gece, ...(el === "X" && o.ara ? {ara:true} : {}), oto:o.kod};
  return {...qrAra(k, d, o), elle:false};
}
/* QR ile öğlen (11:30–15:30 arası) giriş yapan güvenlik personeli o gün ara vardiyada (3: 13:00–21:00) sayılır */
function qrAra(k, d, o){
  if (k.grup !== "guvenlik" || o.kod !== "X" || o.gece || o.ara) return o;
  const gl = (mesaiGun(k).G || {})[d.getDate()] || [], g = gl.find(x => x.giris); if (!g) return o;
  const t = new Date(g.giris), dk = t.getHours()*60 + t.getMinutes();
  return ymd(t) === ymd(d) && dk >= 690 && dk <= 930 ? {...o, ara:true, neden:`QR girişi ${pad(t.getHours())}:${pad(t.getMinutes())} · ara vardiya (13–21)`} : o;
}
/* Güvenlik çizelgesindeki gösterim: 1 = gündüz (08–20), 2 = gece (20–08), T = tatil, Y = yıllık izin, R = rapor, G = gelmedi */
const G_KOD = {HT:"T", RT:"T", "Yİ":"Y", D:"G"};

      <label id="kGorL">Görevi (çizelgede)<input class="inp" id="kGor" maxlength="12" placeholder="V.AMİRİ · ÖGG · DNŞM" value="${esc(k.gorev || GOREV_VARSAYILAN[anahtar(k.ad)] || "")}"></label>
      <div class="tam" id="kGunL"><div style="font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px">Çalıştığı günler (temizlikte hafta sonu, çalışma listesinden gelir)</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">${[1,2,3,4,5,6,0].map(g=>`<label style="flex-direction:row;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;padding:6px 9px;color:var(--ink)"><input type="checkbox" value="${g}" ${gunSec.includes(g)?"checked":""}>${GK[g]}</label>`).join("")}</div></div>
      <label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="kAmir" ${k.amir?"checked":""}> Amir</label>
      <div class="tam" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="submit" ${izin?"":"disabled"}>Kaydet</button>${key?`<button class="btn kirmizi" type="button" data-act="kisiCikar" data-k="${esc(key)}" ${izin?"":"disabled"}>İşten ayrıldı · listeden çıkar</button>`:""}</div>
    </form>`);
  const gor = () => { const g = $("#kGrup").value; $("#kVardL").hidden = g!=="guvenlik"; $("#kGorL").hidden = g!=="guvenlik"; $("#kGunL").hidden = g==="guvenlik"; };
  $("#kGrup").onchange = gor; gor();
  $("#kForm").onsubmit = async e => { e.preventDefault();
    const ad = $("#kAd").value.trim(); if (!ad) return;
    const g = $("#kGrup").value;
    const yeni = {...k, ad, grup:g, amir:$("#kAmir").checked, aktif:true};
    if (g==="guvenlik"){ yeni.vardiya = $("#kVard").value; const gr = $("#kGor").value.trim().toLocaleUpperCase("tr"); if (gr) yeni.gorev = gr; else delete yeni.gorev; delete yeni.gunler; delete yeni.duzen; }
    else { yeni.gunler = [...$("#kGunL").querySelectorAll("input:checked")].map(i=>+i.value); yeni.duzen = g==="temizlik" ? "temizlik" : "hafta"; delete yeni.vardiya; }
    const id = key || anahtar(ad);
    const K = kisiler(); K[id] = {...yeni, sira: yeni.sira ?? Object.keys(K).length};
    try { P.ayar.kisiler = K; await DB.ayarYaz({kisiler:K}); toast("✓ Kaydedildi"); kapat(); ciz(); } catch(err){ hata(err); } };
}

/* ================= olaylar ================= */
function hata(err){ console.error(err); toast(err && err.code==="permission-denied" ? "Yetki yok: Firebase kuralına puantaj bölümü eklenmeli" : "Kaydedilemedi: " + (err && (err.code||err.message) || "bağlantı")); }
document.addEventListener("click", async e => {
  const td = e.target.closest("td.c"); if (td){ popAc(td); return; }
  if (!e.target.closest("#pop")) popKapat();
  const t = e.target.closest("[data-act],[data-grup],[data-ay],[data-kod],[data-kisi]"); if (!t) return;
  if (t.dataset.kod !== undefined && POP){ kodYaz(t.dataset.kod); return; }
  if (t.dataset.grup){ P.grup = t.dataset.grup; ciz(); return; }
  if (t.dataset.ay){ const [y,m] = P.ay.split("-").map(Number); const d = new Date(y, m-1 + (+t.dataset.ay), 1); P.ay = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; ayDinle(); return; }
  if (t.dataset.kisi){ e.preventDefault(); kisiModal(t.dataset.kisi); return; }
  const a = t.dataset.act;
  if (a==="kapat") kapat();
  else if (a==="desen") desenModal();
  else if (a==="saat") saatModal();
  else if (a==="saatKaydet") saatKaydet();
  else if (a==="rapor") raporAc();
  else if (a==="program") programAc();
  else if (a==="desenKaydet"){ try { const ek = {}; let n = 0; if (DESEN_KISI){ const r = cizelgeKisiler(); n = r.n; if (n){ ek.kisiler = r.K; P.ayar.kisiler = r.K; } DESEN_KISI = false; }
    await DB.ayarYaz({desen:DESEN_TASLAK, desenOnay:true, ...ek}); P.ayar.desen = DESEN_TASLAK; P.ayar.desenOnay = true; toast("✓ Vardiya düzeni kaydedildi" + (n ? ` · ${n} kişinin vardiyası düzeltildi` : "")); kapat(); ciz(); } catch(err){ hata(err); } }
  else if (a==="kisiEkle") kisiModal(null);
  else if (a==="filtre"){ P.filtre = t.dataset.v || ""; ciz(); }
  else if (a==="bugunGit") bugunGit(true);
  else if (a==="kontrolGit") $("#kontrol").scrollIntoView({behavior:"smooth", block:"start"});
  else if (a==="git"){
    if (P.filtre || P.ara){ P.filtre = ""; P.ara = ""; $("#ara").value = ""; ciz(); }
    const td = document.querySelector(`#tw td.c[data-k="${CSS.escape(t.dataset.k)}"][data-g="${t.dataset.g}"]`); if (!td) return;
    td.scrollIntoView({behavior:"smooth", block:"center", inline:"center"}); const tr = td.closest("tr"); tr.classList.remove("flas"); void tr.offsetWidth; tr.classList.add("flas");
    setTimeout(() => popAc(td), 450);
  }
  else if (a==="kisiHizli") kisiModal(null, {ad:t.dataset.ad || "", grup:t.dataset.g || "temizlik"});
  else if (a==="siteKonum"){
    if (!(P.rol.tech || P.rol.tesis)){ toast("Site konumunu müdür ya da teknisyen kaydeder"); return; }
    if (!confirm("Şu an sitenin ortasında mısınız? Bulunduğunuz yer, giriş-çıkışların kontrol edileceği site merkezi olarak kaydedilecek.")) return;
    if (!navigator.geolocation){ toast("Bu cihazda konum yok"); return; }
    navigator.geolocation.getCurrentPosition(async pz => { const v = {lat:+pz.coords.latitude.toFixed(6), lng:+pz.coords.longitude.toFixed(6), acc:Math.round(pz.coords.accuracy), ts:Date.now(), by:P.kim};
      try { if (DB.konumYaz) await DB.konumYaz(v); P.siteKonum = v; MS_CACHE.clear(); ciz(); toast(`✓ Site konumu kaydedildi (±${v.acc} m)`); } catch(err){ hata(err); } },
      () => toast("Konum alınamadı, konum iznini açın"), {enableHighAccuracy:true, timeout:10000});
  }
  else if (a==="kisiCikar"){ if (!confirm("Bu kişi bu aydan sonra listede görünmesin mi? Geçmiş aylar etkilenmez.")) return; const K = kisiler(); K[t.dataset.k] = {...K[t.dataset.k], aktif:false, ayrilma:P.ay}; try { P.ayar.kisiler = K; await DB.ayarYaz({kisiler:K}); kapat(); ciz(); } catch(err){ hata(err); } }
  else if (a==="onay") onayla(t.dataset.v);
  else if (a==="kilitAc") kilitAc();
  else if (a==="excel"){ indir(excelYap()); }
  else if (a==="paylas") paylas();
});
let araT = null;
document.addEventListener("input", e => { if (e.target && e.target.id === "ara"){ clearTimeout(araT); araT = setTimeout(() => { P.ara = e.target.value; ciz(); }, 180); } });
document.addEventListener("click", e => { const m = document.getElementById("ayarMenu"); if (m && m.open && (!m.contains(e.target) || e.target.closest(".menu-ic button"))) setTimeout(() => { m.open = false; }, 0); });
let fmT = {};
document.addEventListener("input", e => {
  const k = e.target.dataset.fm || e.target.dataset.not; if (!k) return;
  const alan = e.target.dataset.fm ? "fm" : "not", v = e.target.value.trim();
  P.doc.kisi ||= {}; P.doc.kisi[k] ||= {}; P.doc.kisi[k][alan] = v;
  clearTimeout(fmT[k+alan]); fmT[k+alan] = setTimeout(async()=>{ try { await kisilerKaydetIlk(); await DB.ayYaz(P.ay, {kisi:{[k]:{[alan]:v}}}); } catch(err){ hata(err); } }, 700);
});
addEventListener("scroll", popKapat, true);
$("#temaBtn").onclick = () => { const r = document.documentElement; const koyu = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = koyu ? "light" : "dark"; try { localStorage.setItem("pt-tema", r.dataset.theme); } catch(_){} };
try { const tm = localStorage.getItem("pt-tema"); if (tm) document.documentElement.dataset.theme = tm; } catch(_){}
if (/teknik\.html|devriye\.html/.test(document.referrer)) $("#geri").href = document.referrer.replace(/#.*$/,"") + "#panel";

/* ================= veri ================= */
let ayUnsub = null, qrSira = 0;
function ayDinle(){
  if (ayUnsub) ayUnsub(); P.doc = {kisi:{}, onay:{}, kesin:{}}; P.qr = {}; P.mesai = []; MS_CACHE.clear(); ciz();
  ayUnsub = DB.ayDinle(P.ay, v => { P.doc = {kisi:{}, onay:{}, kesin:{}, ...(v||{})}; if (!POP && !(document.activeElement && document.activeElement.dataset && (document.activeElement.dataset.fm || document.activeElement.dataset.not))) ciz(); });
  const {y, m} = ayBilgi(); const a = new Date(y, m-1, 1).getTime(), b = new Date(y, m, 1, 9).getTime(); const s = ++qrSira;
  if (gorurGrup("guvenlik")) DB.devriye(a, b).then(L => { if (s !== qrSira) return; const Q = {};
    L.forEach(r=>{ if (r.tip==="sorun") return; const d = new Date(r.ts), h = d.getHours(); if (h >= 8 && h < 19) return;
      if (h < 8) d.setDate(d.getDate()-1); if (d.getMonth() !== m-1) return; const key = anahtar(r.gorevli); (Q[key] ||= {}); Q[key][d.getDate()] = (Q[key][d.getDate()]||0) + 1; });
    P.qr = Q; ciz(); }).catch(err=>console.warn("devriye", err));
  if (DB.mesai) DB.mesai(a - GUN, b + GUN).then(L => { if (s !== qrSira) return; P.mesai = L; MS_CACHE.clear(); ciz(); }).catch(err=>console.warn("mesai", err));
}
async function canli(){
  const cfg = window.FB_CONFIG, V = "10.12.2", U = `https://www.gstatic.com/firebasejs/${V}/`;
  const [app, fs, au] = await Promise.all([import(U+"firebase-app.js"), import(U+"firebase-firestore.js"), import(U+"firebase-auth.js")]);
  const ap = app.initializeApp(cfg), db = fs.getFirestore(ap), auth = au.getAuth(ap);
  DB = {
    ayarDinle: cb => fs.onSnapshot(fs.doc(db,"puantaj","ayar"), s => cb(s.exists() ? s.data() : {}), e => { console.error(e); cb({}); if (e.code==="permission-denied") toast("Firebase kuralına puantaj bölümünü ekleyin"); }),
    ayDinle: (ay, cb) => fs.onSnapshot(fs.doc(db,"puantaj",ay), s => cb(s.exists() ? s.data() : null), e => console.error(e)),
    izinDinle: cb => fs.onSnapshot(fs.doc(db,"duyuru","izinler"), s => cb(s.exists() ? (s.data().liste||[]) : []), e => cb([])),
    planDinle: cb => fs.onSnapshot(fs.doc(db,"duyuru","izin"), s => cb(s.exists() ? s.data() : null), e => cb(null)),
    degisimDinle: cb => fs.onSnapshot(fs.query(fs.collection(db,"vardiya"), fs.where("durum","==","onay")), s => cb(s.docs.map(d=>({id:d.id, ...d.data()}))), e => cb([])),
    async ayarYaz(v){ await fs.setDoc(fs.doc(db,"puantaj","ayar"), v, {merge:true}); },
    async ayYaz(ay, v){ await fs.setDoc(fs.doc(db,"puantaj",ay), v, {merge:true}); },
    async kilitAc(ay, g){ await fs.updateDoc(fs.doc(db,"puantaj",ay), {[`onay.${g}.mudur`]: fs.deleteField(), [`kesin.${g}`]: fs.deleteField(), son:{by:P.kim, ts:Date.now(), not:"kilit açıldı"}}); },
    async devriye(a, b){ return (await fs.getDocs(fs.query(fs.collection(db,"devriye"), fs.where("ts",">=",a), fs.where("ts","<",b)))).docs.map(d=>d.data()); },
    async mesai(a, b){ return (await fs.getDocs(fs.query(fs.collection(db,"mesai"), fs.where("ts",">=",a), fs.where("ts","<",b)))).docs.map(d=>d.data()); },
    konumDinle: cb => fs.onSnapshot(fs.doc(db,"duyuru","konum"), s => cb(s.exists() ? s.data() : null), e => cb(null)),
    async konumYaz(v){ await fs.setDoc(fs.doc(db,"duyuru","konum"), v); }
  };
  $("#girisForm").onsubmit = async e => { e.preventDefault(); $("#gHata").textContent = "";
    try { await au.signInWithEmailAndPassword(auth, $("#gEmail").value.trim(), $("#gSifre").value); } catch(_){ $("#gHata").textContent = "E-posta veya şifre hatalı."; } };
  let bas = false;
  au.onAuthStateChanged(auth, async u => {
    if (!u || u.isAnonymous){ $("#app").hidden = true; $("#giris").hidden = false; return; }
    const em = (u.email||"").toLowerCase();
    P.rol.tech = (window.FB_TEKNISYEN||[]).map(x=>x.toLowerCase()).includes(em);
    try { const r = await fs.getDoc(fs.doc(db,"ayar","roller")); const R = r.exists() ? r.data() : {}; const l = x => (x||[]).map(s=>String(s).toLowerCase().trim());
      P.rol.tesis = l(R.tesis).includes(em); P.rol.yon = l(R.yonetim).includes(em); P.adlar = R.adlar || {}; } catch(e){ console.warn(e); }
    if (!P.rol.tech && !P.rol.tesis && !P.rol.yon){ $("#app").hidden = true; $("#giris").hidden = false; $("#gHata").textContent = "Bu hesabın puantaj yetkisi yok."; return; }
    P.kim = (P.adlar && P.adlar[em]) || (P.rol.tech ? "Teknisyen" : em.split("@")[0]);
    $("#kimAd").textContent = P.rol.tech ? "Teknisyen" : P.rol.tesis ? "Müdür" : "Amir";
    $("#giris").hidden = true; $("#app").hidden = false;
    if (bas) return; bas = true;
    DB.ayarDinle(v => { P.ayar = {kisiler:{}, desen:{}, ...v}; P.ayarGeldi = true; desenGoc(); if (!POP) ciz(); });
    DB.izinDinle(L => { P.izin = L; if (!POP) ciz(); });
    DB.planDinle(v => { P.plan = planCoz(v); if (!POP) ciz(); });
    DB.degisimDinle(L => { P.degisim = L; if (!POP) ciz(); });
    if (DB.konumDinle) DB.konumDinle(v => { P.siteKonum = v; MS_CACHE.clear(); if (!POP) ciz(); });
    ayDinle();
  });
}
/* Test için bellek (FB_CONFIG yoksa) */
function bellek(){
  const mem = {ayar:{}, ay:{}}; const dinleyen = {};
  const birlestir = (h, v) => { for (const [k,x] of Object.entries(v)){ if (x && typeof x==="object" && !Array.isArray(x)){ h[k] = birlestir(h[k] && typeof h[k]==="object" ? {...h[k]} : {}, x); } else h[k] = x; } return h; };
  const t = new Date(); const ys = (g) => ymd(new Date(t.getFullYear(), t.getMonth(), g, 12));
  DB = {
    ayarDinle: cb => { dinleyen.ayar = cb; cb(mem.ayar); return ()=>{}; },
    ayDinle: (ay, cb) => { dinleyen.ay = [ay, cb]; cb(mem.ay[ay] || null); return ()=>{}; },
    izinDinle: cb => { cb(window.TEST_IZIN || [{ad:"Cihan Yıldırım", grup:"guvenlik", tur:"yillik", bas:ys(10), bit:ys(16)}, {ad:"RABİA", grup:"temizlik", tur:"rapor", bas:ys(4), bit:ys(5)}]); return ()=>{}; },
    degisimDinle: cb => { cb(window.TEST_DEGISIM || []); return ()=>{}; },
    planDinle: cb => { cb(window.TEST_PLAN || {baz:new Date(2026,9,3,12).getTime(), cmt:[{ad:"ŞÜKRAN",blok:""},{ad:"DURSUN",blok:""},{ad:"GÜNNUR",blok:""},{ad:"SABRİYE",blok:""},{ad:"HATUN",blok:""}], paz:[{ad:"AYŞE",blok:""},{ad:"RABİA",blok:""},{ad:"GÜLTEN",blok:""},{ad:"MERAL",blok:""},{ad:"SEMRA",blok:""}]}); return ()=>{}; },
    async ayarYaz(v){ mem.ayar = birlestir({...mem.ayar}, v); if (v.kisiler) mem.ayar.kisiler = v.kisiler; if (v.desen) mem.ayar.desen = v.desen; dinleyen.ayar && dinleyen.ayar(mem.ayar); },
    async ayYaz(ay, v){ mem.ay[ay] = birlestir({...(mem.ay[ay]||{})}, v); if (dinleyen.ay && dinleyen.ay[0]===ay) dinleyen.ay[1](mem.ay[ay]); },
    async kilitAc(ay, g){ const d = mem.ay[ay]; if (d.onay && d.onay[g]) delete d.onay[g].mudur; if (d.kesin) delete d.kesin[g]; dinleyen.ay[1](d); },
    async devriye(a, b){ const L = []; const gece = (g, ad, n=6) => { for (let i=0;i<n;i++) L.push({gorevli:ad, ts:new Date(t.getFullYear(), t.getMonth(), g, 22, i*7).getTime()}); };
      gece(3,"Yalçın Akyol"); gece(4,"Yalçın Akyol"); gece(5,"Rüstem Eryüksel"); gece(12,"Cihan Yıldırım"); gece(7,"Tayfun Özdemir"); return L.filter(r=>r.ts>=a && r.ts<b); },
    async mesai(a, b){ const L = []; const sa = (g, h, dk=0) => new Date(t.getFullYear(), t.getMonth(), g, h, dk).getTime();
      for (let g=1; g<=Math.min(t.getDate(), 28); g++){ const d = new Date(t.getFullYear(), t.getMonth(), g); if (d.getDay()>=1 && d.getDay()<=5 && g!==9){ L.push({ad:"AYŞE", grup:"temizlik", tip:"giris", ts:sa(g,7,50+(g%7))}); if (g!==t.getDate()) L.push({ad:"AYŞE", grup:"temizlik", tip:"cikis", ts:sa(g,16,30+(g%9))}); } }
      L.push({ad:"Ali Vesek", grup:"guvenlik", tip:"giris", ts:sa(2,7,55)}); L.push({ad:"Ali Vesek", grup:"guvenlik", tip:"cikis", ts:sa(2,20,5)});
      L.push({ad:"Ali Vesek", grup:"guvenlik", tip:"giris", ts:sa(5,19,50)});
      L.forEach(r => { r.konum = {lat:40.9932, lng:28.7181, acc:15}; });
      const uz = L.find(r => r.ad==="AYŞE" && new Date(r.ts).getDate()===4 && r.tip==="giris"); if (uz) uz.konum = {lat:41.0150, lng:28.7600, acc:20};
      return L.filter(r=>r.ts>=a && r.ts<b); },
    konumDinle: cb => { cb({lat:40.9932, lng:28.7181}); return ()=>{}; }
  };
  P.rol = window.TEST_ROL || {tech:true, tesis:false, yon:false}; P.kim = "Test";
  $("#kimAd").textContent = "Test"; $("#giris").hidden = true; $("#app").hidden = false;
  DB.ayarDinle(v=>{ P.ayar = {kisiler:{}, desen:{}, ...v}; desenGoc(); ciz(); }); DB.izinDinle(L=>{ P.izin = L; }); DB.planDinle(v=>{ P.plan = planCoz(v); }); DB.degisimDinle(L=>{ P.degisim = L; }); DB.konumDinle(v=>{ P.siteKonum = v; }); ayDinle();
}
window.__PT = {P, oto, hucre, kisiler, excelYap, raporHTML, gecDk, saatAyar};
if (window.FB_CONFIG) canli().catch(e=>{ console.error(e); $("#giris").hidden = false; $("#gHata").textContent = "Bağlantı kurulamadı, sayfayı yenileyin."; });
else bellek();
