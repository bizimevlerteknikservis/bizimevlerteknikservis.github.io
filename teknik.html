const TS = { kayit:[], un:null, f:null, kaydediliyor:false };
const tasTur = {giris:"🚚 Taşınma (giriş)", cikis:"🚚 Taşınma (çıkış)", tadilat:"🔨 Tadilat"};
const gunAdi = ts => new Date(ts).toLocaleDateString("tr-TR",{weekday:"long", day:"numeric", month:"long"});
const saatOf = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const tsOf = (gun, saat) => { const [y,m,d] = gun.split("-").map(Number), [h,dk] = saat.split(":").map(Number); return new Date(y, m-1, d, h, dk).getTime(); };
function tasAktifBugun(k, t = Date.now()){ const g0 = new Date(t); g0.setHours(0,0,0,0); return !k.iptal && !k.bitti && k.bas < g0.getTime()+864e5 && k.bit >= g0.getTime(); }
function tasDogrula(f){
  if (!f.tur) return "Tür seçin";
  if (!f.blok) return "Blok seçin";
  if (!String(f.daire||"").trim()) return "Daire no yazın";
  if (!f.gun) return "Tarih seçin";
  if (!f.sbas || !f.sbit) return "Saat aralığını seçin";
  if (f.sbas < TAS_KURAL.bas || f.sbit > TAS_KURAL.bit) return `Saat ${TAS_KURAL.bas}–${TAS_KURAL.bit} arasında olmalı`;
  if (f.sbas >= f.sbit) return "Bitiş saati başlangıçtan sonra olmalı";
  const son = f.tur==="tadilat" ? (f.gunBit || f.gun) : f.gun;
  if (son < f.gun) return "Bitiş tarihi başlangıçtan önce olamaz";
  for (let t = tsOf(f.gun,"12:00"); t <= tsOf(son,"12:00"); t += 864e5){
    if (new Date(t).getDay() === 0){
      if (f.tur !== "tadilat" || f.gun === son) return "Pazar günü taşınma ve tadilat yasak";
    }
  }
  if (new Date(tsOf(f.gun,"12:00")).getDay() === 0) return "Pazar günü başlayamaz";
  if (new Date(tsOf(son,"12:00")).getDay() === 0) return "Bitiş günü pazar olamaz";
  if (tsOf(son, f.sbit) < Date.now() - 36e5) return "Geçmiş bir tarih seçildi";
  return "";
}
function tasBaslat(){
  if (TS.un) return;
  TS.basladi = true;
  TS.un = store.listenTasinma(Date.now() - 2*864e5, L => { TS.kayit = L; if (S.view==="tasinma" || S.view==="devriye") setTimeout(render,0); });
}
function tasDurdur(){ if (TS.un) TS.un(); TS.un = null; TS.kayit = []; }
function tasSatir(k, yonet){
  const tek = new Date(k.bas).toDateString() === new Date(k.bit).toDateString();
  const zaman = tek ? `${gunAdi(k.bas)} · ${saatOf(k.bas)}–${saatOf(k.bit)}` : `${gunAdi(k.bas)} → ${gunAdi(k.bit)} · her gün ${saatOf(k.bas)}–${saatOf(k.bit)}`;
  const gecikti = k.tur==="tadilat" && !k.bitti && Date.now() > k.bit;
  return `<article class="ticket" data-s="${k.iptal?"iptal":k.bitti?"tamamlandi":tasAktifBugun(k)?"onaylandi":"bekliyor"}">
    <div class="t-head"><span class="t-no">${tasTur[k.tur]||k.tur}</span><span class="chip" data-s="${k.iptal?"iptal":gecikti?"bekliyor":"onaylandi"}">${k.iptal?"İptal":k.bitti?"Bitti":gecikti?"Süresi geçti":tasAktifBugun(k)?"Bugün":"Planlandı"}</span></div>
    <div class="t-meta"><span>📍 <b>${esc(k.blok)} Blok · Daire ${esc(k.daire)}</b></span></div>
    <div class="t-meta"><span>🕒 ${zaman}</span></div>
    ${k.plaka||k.firma ? `<div class="t-meta">${k.plaka?`<span>🚛 <b>${esc(k.plaka)}</b></span>`:""}${k.firma?`<span>${esc(k.firma)}</span>`:""}</div>` : ""}
    ${k.asansor ? `<div class="t-uyari turuncu" style="margin:0;padding:8px 12px;font-size:14px">🛗 Asansör kullanılacak · koruma takılmalı</div>` : ""}
    ${k.not ? `<p class="t-desc">${esc(k.not)}</p>` : ""}
    ${yonet && !k.iptal && !k.bitti ? `<div class="actions">${k.tur==="tadilat"?`<button class="act" data-t="tasBitti" data-id="${k.id}">✓ Tadilat bitti</button>`:""}<button class="act danger" data-t="tasIptal" data-id="${k.id}">İptal et</button></div>` : ""}
    <small class="hint">Kaydeden: ${esc(k.by||"")}</small>
  </article>`;
}
function vTasinma(){
  if (!(store.isYetkili && store.isYetkili())) return vPanel();
  tasBaslat();
  const f = TS.f || (TS.f = {tur:"", blok:"", daire:"", gun:"", gunBit:"", sbas:TAS_KURAL.bas, sbit:TAS_KURAL.bit, firma:"", plaka:"", asansor:null, not:""});
  const hata = TS.denendi ? tasDogrula(f) : "";
  const L = TS.kayit.filter(k=>!k.iptal).sort((a,b)=>a.bas-b.bas);
  const bugun = L.filter(k=>tasAktifBugun(k)), sonra = L.filter(k=>!tasAktifBugun(k) && k.bas > Date.now() && !k.bitti), geciken = L.filter(k=>k.tur==="tadilat" && !k.bitti && Date.now() > k.bit);
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px">
      <h2 style="margin:0;font:600 22px/1.2 var(--display)">Taşınma & Tadilat</h2>
      ${store.isTech() ? `<a class="pill-btn" href="#panel" style="text-decoration:none;color:var(--ink)">← İş paneli</a>` : `<button class="pill-btn cikis-btn" data-act="cikis">Çıkış yap</button>`}</div>
    <div class="t-uyari" style="margin-bottom:14px">📋 <b>Kural:</b> Pazartesi–Cumartesi ${TAS_KURAL.bas}–${TAS_KURAL.bit} · <b>Pazar yasak</b></div>
    <section class="step"><h2><span>＋</span>Yeni kayıt</h2>
      <div class="prefs">${Object.entries(tasTur).map(([k,v])=>`<button class="pref" data-t="tsTur" data-v="${k}" aria-pressed="${f.tur===k}">${v}</button>`).join("")}</div>
      <div class="grid2" style="margin-top:10px">
        <label class="f">Blok<select id="ts_blok"><option value="">Seçin</option>${AYAR.bloklar.map(b=>`<option ${f.blok===b?"selected":""}>${b}</option>`).join("")}</select></label>
        <label class="f">Daire no<input id="ts_daire" inputmode="numeric" maxlength="6" value="${esc(f.daire)}"></label>
      </div>
      <div class="grid2">
        <label class="f">${f.tur==="tadilat"?"Başlangıç tarihi":"Tarih"}<input type="date" id="ts_gun" value="${esc(f.gun)}"></label>
        ${f.tur==="tadilat" ? `<label class="f">Bitiş tarihi<input type="date" id="ts_gunBit" value="${esc(f.gunBit)}"></label>` : `<span></span>`}
      </div>
      <div class="grid2">
        <label class="f">Başlangıç saati<input type="time" id="ts_sbas" min="${TAS_KURAL.bas}" max="${TAS_KURAL.bit}" step="1800" value="${esc(f.sbas)}"></label>
        <label class="f">Bitiş saati<input type="time" id="ts_sbit" min="${TAS_KURAL.bas}" max="${TAS_KURAL.bit}" step="1800" value="${esc(f.sbit)}"></label>
      </div>
      <div class="grid2">
        <label class="f">${f.tur==="tadilat"?"Usta / firma":"Nakliye firması"}<input id="ts_firma" maxlength="60" value="${esc(f.firma)}"></label>
        <label class="f">Araç plakası<input id="ts_plaka" maxlength="12" style="text-transform:uppercase" value="${esc(f.plaka)}"></label>
      </div>
      <div class="group-h">Asansör kullanılacak mı?</div>
      <div class="prefs"><button class="pref" data-t="tsAs" data-v="1" aria-pressed="${f.asansor===true}">Evet</button><button class="pref" data-t="tsAs" data-v="0" aria-pressed="${f.asansor===false}">Hayır</button></div>
      <label class="f" style="margin-top:8px">Not (isteğe bağlı)<input id="ts_not" maxlength="200" placeholder="Örn. Moloz konteyneri otoparka konacak, depozito alındı" value="${esc(f.not)}"></label>
      ${hata ? `<p class="err">${esc(hata)}</p>` : ""}
      <button class="cta" data-t="tsKaydet" style="margin-top:10px">${TS.kaydediliyor ? "Kaydediliyor…" : "Kaydet"}</button>
      <p class="hint">Kişi adı ve telefon yazmayın; güvenlik bu listeyi kapıda görür.</p>
    </section>
    ${geciken.length ? `<div class="group-h">⚠️ Süresi geçen tadilatlar</div><div class="list">${geciken.map(k=>tasSatir(k,true)).join("")}</div>` : ""}
    <div class="group-h">Bugün (${bugun.length})</div>
    ${bugun.length ? `<div class="list">${bugun.map(k=>tasSatir(k,true)).join("")}</div>` : `<div class="empty" style="padding:16px"><strong>Bugün taşınma ya da tadilat yok</strong></div>`}
    <div class="group-h">Yaklaşan (${sonra.length})</div>
    ${sonra.length ? `<div class="list">${sonra.slice(0,30).map(k=>tasSatir(k,true)).join("")}</div>` : `<div class="empty" style="padding:16px"><strong>Planlanmış kayıt yok</strong></div>`}`;
}
function tsSync(){
  const f = TS.f; if (!f) return;
  [["blok","ts_blok"],["daire","ts_daire"],["gun","ts_gun"],["gunBit","ts_gunBit"],["sbas","ts_sbas"],["sbit","ts_sbit"],["firma","ts_firma"],["plaka","ts_plaka"],["not","ts_not"]]
    .forEach(([k,id]) => { const el = document.getElementById(id); if (el) f[k] = el.value; });
}
/* Güvenlik sayfası için: bugünkü taşınma/tadilatlar (ad-telefon yok) */
function tasGuvenlikKart(){
  const L = TS.kayit.filter(k=>tasAktifBugun(k)).sort((a,b)=>a.bas-b.bas);
  return `<section class="step"><h2><span>🚚</span>Bugün taşınma / tadilat</h2>
    ${L.length ? L.map(k=>`<div class="t-satir"><b>${esc(k.blok)} / Daire ${esc(k.daire)}</b> · ${k.tur==="tadilat"?"🔨 Tadilat":"🚚 Taşınma"} · ${saatOf(k.bas)}–${saatOf(k.bit)}${k.plaka?` · <b>${esc(k.plaka)}</b>`:""}${k.asansor?" · 🛗 asansör":""}</div>`).join("")
      : `<p class="hint">Bugün kayıtlı taşınma ya da tadilat yok. Kayıtsız araç gelirse amire haber verin.</p>`}
  </section>`;
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-t]"); if (!b || !b.dataset.t.startsWith("ts") && !b.dataset.t.startsWith("tas")) return;
  const t = b.dataset.t, v = b.dataset.v, id = b.dataset.id; tsSync();
  if (t==="tsTur"){ TS.f.tur = v; render(); }
  else if (t==="tsAs"){ TS.f.asansor = v==="1"; render(); }
  else if (t==="tsKaydet"){
    TS.denendi = true; const f = TS.f, hata = tasDogrula(f);
    if (!hata && f.asansor === null){ toast("Asansör kullanılacak mı? Seçin"); render(); return; }
    if (hata){ render(); return; }
    const son = f.tur==="tadilat" ? (f.gunBit || f.gun) : f.gun;
    const rec = {tur:f.tur, blok:f.blok, daire:String(f.daire).trim(), bas:tsOf(f.gun, f.sbas), bit:tsOf(son, f.sbit),
      firma:f.firma.trim(), plaka:f.plaka.trim().toUpperCase(), asansor:!!f.asansor, not:f.not.trim(), by: store.kim ? store.kim() : "", ts:Date.now()};
    TS.kaydediliyor = true; render();
    try {
      await store.addTasinma(rec);
      tgGonder([`${tasTur[rec.tur]} kaydı`, `📍 ${rec.blok} Blok · Daire ${rec.daire}`, `🕒 ${gunAdi(rec.bas)} ${saatOf(rec.bas)}–${saatOf(rec.bit)}${rec.tur==="tadilat"&&son!==f.gun?` → ${gunAdi(rec.bit)}`:""}`,
        rec.plaka?`🚛 ${rec.plaka}`:"", rec.asansor?"🛗 Asansör kullanılacak → koruma takılmalı":"", rec.not?`📝 ${rec.not}`:"", `👤 ${rec.by}`].filter(Boolean).join("\n"));
      toast("Kaydedildi"); TS.f = null; TS.denendi = false;
    } catch(err){ console.error(err); toast("Kaydedilemedi: " + (err.code || "tekrar deneyin")); }
    TS.kaydediliyor = false; render();
  }
  else if (t==="tasIptal" || t==="tasBitti"){
    if (b.dataset.onay !== "1"){ b.dataset.onay = "1"; b.textContent = "Emin misiniz? Tekrar basın"; return; }
    try { await store.updateTasinma(id, t==="tasIptal" ? {iptal:true, iptalBy: store.kim ? store.kim() : ""} : {bitti:Date.now()}); toast(t==="tasIptal" ? "İptal edildi" : "Tadilat bitti olarak kaydedildi"); }
    catch(err){ console.error(err); toast("Kaydedilemedi"); }
  }
});

/* Her personelin 6 haneli kişisel kodu var. Kod Firebase'de kontrol edilir; pasif yapılınca gönderim durur. */
const KOD = { liste:[], un:null, form:{tip:"personel", ad:"", rol:"Temizlik", vardiya:"1. Vardiya"}, yeni:null };
const kodSakla = (tip, v) => yerel("bz1-kod-" + tip, v);
const kodAl = tip => yerel("bz1-kod-" + tip);
function kodGirisEkrani(tip){
  const g = tip === "guvenlik";
  return `<section class="step kod-giris">
    <h2><span>${g ? "🛡️" : "👷"}</span>${g ? "Güvenlik kodunuz" : "Personel kodunuz"}</h2>
    <p class="hint">Teknisyenin size verdiği <b>6 haneli kodu</b> girin. Bir kez girmeniz yeterli, telefon hatırlar.</p>
    <input id="kodGir" class="kod-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="••••••" value="${esc(S.kodTaslak||"")}">
    ${S.kodHata ? `<p class="err">${esc(S.kodHata)}</p>` : ""}
    <button class="cta" data-act="kodGir" data-v="${tip}">${S.kodBakiyor ? "Kontrol ediliyor…" : "Devam"}</button>
    <p class="hint" style="margin-top:10px">Kodunuz yoksa ya da çalışmıyorsa teknisyene başvurun.</p>
    ${store.mode==="demo" ? `<p class="hint">Demo kodları: <b>123456</b> (personel) · <b>654321</b> (güvenlik)</p>` : ""}
  </section>`;
}
async function kodDogrula(tip, kod){
  const k = await store.kodOku(kod);
  if (!k || k.aktif === false) return null;
  if (tip === "guvenlik" && k.tip !== "guvenlik") return null;
  // Güvenlik kodu personel sayfasında da geçer (arıza bildirimi için ayrı kod gerekmez)
  if (tip === "personel" && k.tip === "guvenlik") return Object.assign({}, k, {rol:"Güvenlik"});
  if (tip === "personel" && k.tip !== "personel") return null;
  return k;
}
function kodUygula(tip, kod, k){
  if (tip === "personel"){
    kodSakla("personel", {kod, ad:k.ad, rol:k.rol});
    Object.assign(S.p, {kod, name:k.ad, rol:k.rol, kayitli:true, kimlikAc:false});
    if (k.rol === BAHCIVAN){ S.p.cat = "p_bahce"; S.p.yerTip = "alan"; }
    yerel("site-servis-personel", {rol:k.rol, name:k.ad});
  } else {
    const kim = {ad:k.ad, vardiya:k.vardiya || "", kod};
    kodSakla("guvenlik", kim); yerel("bz1-gorevli", kim); S.d.kim = kim; S.d.kimAc = false;
  }
}
/* Açılışta kod hâlâ geçerli mi? (pasif yapıldıysa telefondan silinir) */
async function kodYokla(){
  try { const z = await store.kodOku("zorunlu", true); const once = S.kodZorunlu; S.kodZorunlu = !!(z && z.aktif); if (once !== S.kodZorunlu) render(); } catch(e){}
  for (const tip of ["personel","guvenlik"]){
    const s = kodAl(tip); if (!s || !s.kod || !navigator.onLine) continue;
    try {
      const k = await kodDogrula(tip, s.kod);
      if (!k){ kodSakla(tip, null); if (tip==="personel"){ S.p.kod = null; } else { S.d.kim = null; yerel("bz1-gorevli", null); }
        toast(tip==="personel" ? "Personel kodunuz artık geçerli değil" : "Güvenlik kodunuz artık geçerli değil"); render(); }
      else kodUygula(tip, s.kod, k);
    } catch(e){ /* çevrimdışı ya da kural henüz yok: dokunma */ }
  }
}
/* ---------- Teknisyen paneli: kod yönetimi ---------- */

    <div class="grid2" style="margin-top:8px">
      <label class="f">Ad soyad<input id="kodAd" maxlength="60" value="${esc(f.ad)}"></label>
      ${f.tip==="personel"

      ? `🔒 <b>Kod zorunlu.</b> Kodsuz kimse bildirim gönderemez. <button class="pill-btn" data-act="kodZorunlu" data-v="0">Zorunluluğu kaldır</button>`

    ${kodTekrarlar().length ? `<div class="t-uyari"><b>${kodTekrarlar().length} kişiye iki kez kod verilmiş.</b> Her kişinin ilk kodu kalsın, fazlası silinsin: <button class="pill-btn cikis-btn" data-act="kodTekrarSil">Fazla kodları sil</button></div>` : ""}
    <div class="kod-liste">${L.length ? L.map(satir).join("") : `<p class="hint">Henüz kod yok.</p>`}</div>
  </details>`;
}
/* Aynı kişiye birden fazla aktif kod: en eskisi kalır, gerisi silinecekler listesi */
function kodTekrarlar(){
  const g = {}, sil = [];
  KOD.liste.filter(k=>k.aktif!==false).sort((a,b)=>(a.ts||0)-(b.ts||0)||a.id.localeCompare(b.id))
    .forEach(k=>{ const a = k.tip + "|" + (k.ad||"").trim().toLocaleLowerCase("tr"); if (g[a]) sil.push(k); else g[a] = 1; });
  return sil;
}
function kodMesaj(k){
  const link = location.origin + location.pathname.replace(/[^/]*$/, "");
  const g = k.tip==="guvenlik";
  return `Bizimevler 1 ${g?"güvenlik":"personel"} kodunuz: ${k.id}\n\nUygulama: ${link}${g?"devriye.html":"personel.html"}${g?`\nArıza bildirimi: ${link}personel.html`:""}\nİlk açılışta bu kodu girin.${g?" Aynı kod iki uygulamada da geçerli.":""}`;
}
async function yeniKod(){
  for (let i = 0; i < 20; i++){
    const k = String(100000 + Math.floor(Math.random()*900000));
    if (!KOD.liste.some(x=>x.id===k)) return k;
  }
  throw new Error("kod");
}
function kodBaslat(){
  if (KOD.un || !store.isTech() || !store.listenKod) return;
  KOD.un = store.listenKod(L => { KOD.liste = L.filter(k=>/^\d{6}$/.test(k.id)); const z = L.find(k=>k.id==="zorunlu"); S.kodZorunlu = !!(z && z.aktif); if (S.view==="panel") setTimeout(render,0); });
}

function render(){
  syncForm();
  const keep = document.activeElement && document.activeElement.id;
  $("#view").innerHTML = S.view==="randevularim" ? vRandevularim() : S.view==="panel" ? vPanel() : S.view==="tesis" ? vTesis() : S.view==="tasinma" ? vTasinma() : S.view==="personel" ? vPersonel() : S.view==="devriye" ? vDevriye() : vRandevu();
  document.querySelector("nav.tabs").hidden = S.view==="personel" || S.view==="devriye";
  $("#ustYazi").textContent = S.view==="personel" ? "Bizimevler 1 · Personel" : S.view==="devriye" ? "Bizimevler 1 · Güvenlik" : (AYAR.ustYazi || "Teknik Servis");
  $("#siteName").textContent = S.view==="devriye" ? "Devriye" : (AYAR.baslik || AYAR.siteAdi);
  $("#heroSub").textContent = S.view==="randevularim" ? "Bildirimlerinin durumunu ve teknisyen notlarını buradan takip et."
    : S.view==="panel" ? "Gelen arızaları gör, durumlarını güncelle."
    : S.view==="tesis" ? "Asansör, jeneratör, yakıt ve elektrik kesintisi takibi."
    : S.view==="tasinma" ? "Taşınma ve tadilat kayıtları · Pzt–Cmt 10:00–17:00, pazar yasak."
    : S.view==="personel" ? "Sahada gördüğün arızayı ya da ihtiyacın olan malzemeyi 15 saniyede bildir."
    : S.view==="devriye" ? "Noktaya geldiğinde QR'ı okut, turun kaydedilsin."
    : "Arızanı bildir, teknisyen en kısa sürede ilgilensin.";
  document.querySelectorAll("nav.tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.tab===(S.view==="tesis"||S.view==="tasinma"?"panel":S.view) ? "page" : "false"));
  /* Teknisyen sekmesi sakinlere görünmez; sadece #panel adresinden açılır */
  const teknik = S.view==="panel" || S.view==="tesis" || S.view==="tasinma" || store.isTech();
  document.querySelector('nav.tabs a[data-tab="panel"]').hidden = !teknik;
  document.querySelector("nav.tabs .in").style.setProperty("--tabs", teknik ? 3 : 2);
  if (keep && document.getElementById(keep)) { const el = document.getElementById(keep); el.focus(); if (el.setSelectionRange && el.value && el.type !== "date") try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){} }
}
function syncForm(){
  const rk = document.getElementById("rolKart"); if (rk) S.rolAcik = rk.open;
  const kk = document.getElementById("kodKart"); if (kk) S.kodAcik = kk.open;
  const kg = document.getElementById("kodGir"); if (kg) S.kodTaslak = kg.value;
  [["kodAd","ad"],["kodRol","rol"],["kodVardiya","vardiya"]].forEach(([id,k]) => { const el = document.getElementById(id); if (el) KOD.form[k] = el.value; });
  const rl = document.getElementById("rolListe"); if (rl) S.rolTaslak = rl.value;
  const rt = document.getElementById("rolTesis"); if (rt) S.rolTesisTaslak = rt.value;
  const f = S.form;
  [["desc","desc"],["name","name"],["block","block"],["flat","flat"],["phone","phone"]].forEach(([id,k]) => { const el = document.getElementById(id); if (el) f[k] = el.value; });
  document.querySelectorAll("[data-note]").forEach(el => S.notes[el.dataset.note] = el.value);
  [["p_name","name"],["p_block","block"],["p_kat","kat"],["p_alan","alan"],["p_desc","desc"]].forEach(([id,k]) => { const el = document.getElementById(id); if (el) S.p[k] = el.value; });
}

/* ---------- olaylar ---------- */
document.addEventListener("input", e => {
  if (S.view === "personel"){ syncForm(); const pb = document.querySelector('[data-act="pGonder"]'); if (pb) pb.disabled = !personelHazir() || S.sending; return; }
  if (S.view !== "randevu" || !e.target.id) return;
  syncForm();
  const btn = document.querySelector('[data-act="gonder"]');
  if (btn) btn.disabled = !formHazir() || S.sending;
});

document.addEventListener("change", async e => {
  if ((e.target.id === "p_foto" || e.target.id === "p_foto2") && e.target.files && e.target.files[0]){
    syncForm(); S.fotoIsleniyor = true; render();
    try { S.p.foto.push(await fotoKucult(e.target.files[0])); } catch(err){ toast("Fotoğraf okunamadı, tekrar deneyin"); }
    S.fotoIsleniyor = false; render(); return;
  }
});
document.addEventListener("change", e => { if (S.view === "personel"){ syncForm(); const pb = document.querySelector('[data-act="pGonder"]'); if (pb) pb.disabled = !personelHazir() || S.sending; } });
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, v = b.dataset.v, id = b.dataset.id;
  const find = arr => arr.find(a => a.id === id);
  if (act !== "iptal" && act !== "iptalBenim") S.armed = null;
  S.err = "";
  try {
    if (act==="dKim"){ const kim = {ad:v, vardiya:b.dataset.vr}; S.d.kim = kim; S.d.kimAc = false; yerel("bz1-gorevli", kim); render(); scrollTo(0,0);
      if (S.d.bekleyen){ const n = S.d.bekleyen; S.d.bekleyen = null; noktaOkut(n); } }
    else if (act==="dKimAc"){ S.d.kimAc = true; render(); }
    else if (act==="dTara"){ taramaAc(); }
    else if (act==="dSorunAc"){ S.d.sorunAc = true; render(); }
    else if (act==="dSorunKapat"){ S.d.sorunAc = false; S.d.sorunNot = ""; render(); }
    else if (act==="dSorunHazir"){ S.d.sorunNot = v; render(); }
    else if (act==="dSorunGonder"){ await sorunGonder(); }
    else if (act==="pRol"){ syncForm(); if (S.p.rol === BAHCIVAN && v !== BAHCIVAN){ S.p.cat = ""; S.p.issues = []; S.p.yerTip = "blok"; } S.p.rol = v;
      if (v === BAHCIVAN) S.p.yerTip = "alan";   // bahçıvan: sadece ortak alan
      if (S.p.cat && !rolKat(v, {id:S.p.cat})){ S.p.cat = ""; S.p.issues = []; }
      if (v === BAHCIVAN && !S.p.cat){ S.p.cat = "p_bahce"; S.p.issues = []; }   // tek kategori: otomatik seç
      render(); }
    else if (act==="pKimlik"){ syncForm(); S.p.kimlikAc = true; render(); }
    else if (act==="pCat"){ syncForm(); if (S.p.cat !== v) S.p.issues = []; S.p.cat = v; render(); }
    else if (act==="pIss"){ syncForm(); const L = S.p.issues; const i = L.indexOf(v); i < 0 ? L.push(v) : L.splice(i,1); render(); }
    else if (act==="pYer"){ syncForm(); S.p.yerTip = v; render(); }
    else if (act==="pYeni"){ S.pSent = null; Object.assign(S.p, {cat:S.p.rol===BAHCIVAN?"p_bahce":null, issues:[], desc:"", foto:[]}); render(); scrollTo(0,0); }
    else if (act==="kur"){ if (KUR){ KUR.prompt(); const r = await KUR.userChoice; KUR = null; render(); } }
    else if (act==="kodGir"){
      syncForm(); const kod = String(S.kodTaslak||"").replace(/\D/g,"");
      if (kod.length !== 6){ S.kodHata = "Kod 6 haneli olmalı"; render(); return; }
      S.kodBakiyor = true; S.kodHata = ""; render();
      try {
        const k = await kodDogrula(v, kod);
        if (!k) S.kodHata = "Kod geçersiz ya da pasif. Teknisyene başvurun.";
        else { kodUygula(v, kod, k); S.kodTaslak = ""; toast(`Hoş geldiniz ${k.ad.split(" ")[0]}`);
          if (v==="guvenlik" && S.d.bekleyen){ const n = S.d.bekleyen; S.d.bekleyen = null; S.kodBakiyor = false; render(); noktaOkut(n); return; } }
      } catch(err){ console.error(err); S.kodHata = "Kontrol edilemedi. İnternet bağlantınızı kontrol edin."; }
      S.kodBakiyor = false; render();
    }
    else if (act==="kodGirAc"){ if (v==="personel") S.p.kodGir = true; else S.d.kodGir = true; render(); }
    else if (act==="kodZorunlu"){
      if (b.dataset.onay !== "1"){ b.dataset.onay = "1"; b.textContent = "Emin misiniz? Tekrar basın"; return; }
      await store.setKod("zorunlu", {aktif: v==="1", ts: Date.now()}); S.kodZorunlu = v==="1"; toast(v==="1" ? "Kod zorunlu yapıldı" : "Kod zorunluluğu kaldırıldı"); render();
    }
    else if (act==="kodCikis"){
      kodSakla(v, null);
      if (v==="personel") S.p.kod = null; else { S.d.kim = null; yerel("bz1-gorevli", null); }
      render(); scrollTo(0,0);
    }
    else if (act==="kodTip"){ syncForm(); KOD.form.tip = v; render(); }
    else if (act==="kodEkle"){
      syncForm(); const f = KOD.form, ad = f.ad.trim();
      if (ad.length < 3){ toast("Ad soyad yazın"); return; }
      const id = await yeniKod();
      const v2 = f.tip==="guvenlik" ? {ad, tip:"guvenlik", vardiya:f.vardiya, aktif:true, ts:Date.now()} : {ad, tip:"personel", rol:f.rol, aktif:true, ts:Date.now()};
      await store.setKod(id, v2); KOD.yeni = {id, ad}; KOD.form.ad = ""; const ka = $("#kodAd"); if (ka) ka.value = ""; S.kodAcik = true; toast("Kod oluşturuldu: " + id); render();
    }
    else if (act==="kodPaylas"){
      const k = KOD.liste.find(x=>x.id===id); if (!k) return;
      const metin = kodMesaj(k);
      // Telefonun paylaş menüsü: WhatsApp / WhatsApp Business / SMS hangisi istenirse
      if (navigator.share){ try { await navigator.share({text: metin}); } catch(e){} }
      else { try { await navigator.clipboard.writeText(metin); toast("Mesaj kopyalandı, istediğiniz yere yapıştırın"); } catch(e){ location.href = "https://wa.me/?text=" + encodeURIComponent(metin); } }
      return;
    }
    else if (act==="kodAktif"){
      if (v==="0" && b.dataset.onay !== "1"){ b.dataset.onay = "1"; b.textContent = "Emin misiniz?"; return; }
      await store.updateKod(id, {aktif: v==="1"}); toast(v==="1" ? "Aktif yapıldı" : "Pasif yapıldı · uygulaması durdu");
    }
    else if (act==="kodGuvToplu"){
      if (b.dataset.onay !== "1"){ b.dataset.onay = "1"; b.textContent = "Emin misiniz? Tekrar basın"; return; }
      if (KOD.toplu) return; KOD.toplu = true; b.disabled = true; b.textContent = "Oluşturuluyor…";
      let n = 0;
      const var_ = ad => KOD.liste.some(k=>k.tip==="guvenlik" && k.aktif!==false && k.ad===ad);
      try { for (const v3 of VARDIYA) for (const [ad] of v3.kisiler){ if (var_(ad)) continue; const id = await yeniKod(); await store.setKod(id, {ad, tip:"guvenlik", vardiya:v3.ad, aktif:true, ts:Date.now()}); KOD.liste.push({id, ad, tip:"guvenlik", vardiya:v3.ad, aktif:true}); n++; } } finally { KOD.toplu = false; }
      S.kodAcik = true; toast(`${n} güvenlik kodu oluşturuldu`); render();
    }
    else if (act==="kodTekrarSil"){
      if (b.dataset.onay !== "1"){ b.dataset.onay = "1"; b.textContent = "Emin misiniz? Tekrar basın"; return; }
      const sil = kodTekrarlar(); b.disabled = true;
      for (const k of sil){ await store.deleteKod(k.id); }
      KOD.liste = KOD.liste.filter(k=>!sil.includes(k)); toast(`${sil.length} tekrar eden kod silindi`); render();
    }
    else if (act==="pFotoSil"){ syncForm(); S.p.foto.splice(+v, 1); render(); }
    else if (act==="foto"){ fotoGoster(id); }
    else if (act==="pGonder"){
      syncForm(); const p = S.p;
      if (!personelHazir()) return;
      S.sending = true; render();
      yerel("site-servis-personel", {rol:p.rol, name:p.name.trim()});
      try {
        const ar = p.issues.filter(x => x !== "Diğer");
        const aciklama = [ar.join(", "), p.desc.trim()].filter(Boolean).join(" — ");
        const blokIci = p.yerTip==="blok";
        const fotolar = p.foto.slice();
        S.pSent = await store.create({src:"personel", kod:p.kod, rol:p.rol, cat:p.cat, issues:p.issues.slice(), desc:aciklama, name:p.name.trim(), phone:"",
          block: blokIci ? p.block : "", kat: blokIci ? p.kat : "", alan: blokIci ? "" : p.alan, flat:"", fotoSayi: fotolar.length});
        telegramBildir(S.pSent);
        for (let i = 0; i < fotolar.length; i++){
          try { await store.addFoto(S.pSent.id, i, fotolar[i], p.kod); } catch(e){ console.error(e); toast("Fotoğraf gönderilemedi"); }
          telegramFoto(fotolar[i], `📷 ${fisNo(S.pSent)} · ${catOf(S.pSent.cat).ad} · ${yerAd(S.pSent)}`);
        }
        p.foto = [];
        p.kayitli = true; p.kimlikAc = false;
        scrollTo(0,0);
      } catch(err){ console.error(err); S.err = (err && err.code === "permission-denied") ? "Gönderilemedi: personel kodunuz geçersiz ya da pasif. Teknisyene başvurun." : "Gönderilemedi. İnternet bağlantınızı kontrol edip tekrar deneyin."; if (err && err.code === "permission-denied") kodYokla(); }
      S.sending = false; render();
    }
    else if (act==="cat"){ syncForm(); if (S.form.cat !== v) S.form.issues = []; S.form.cat = v; render(); }
    else if (act==="iss"){ syncForm(); const L = S.form.issues; const i = L.indexOf(v); i < 0 ? L.push(v) : L.splice(i,1); render(); }
    else if (act==="yeni"){ S.sent = null; S.form.cat = null; S.form.issues = []; S.form.desc = ""; render(); scrollTo(0,0); }
    else if (act==="gonder"){
      syncForm(); const f = S.form;
      if (!formHazir()) return;
      S.sending = true; render();
      yerel("site-servis-iletisim", {name:f.name, block:f.block, flat:f.flat, phone:f.phone});
      try {
        const arizalar = f.issues.filter(x => x !== "Diğer");
        const aciklama = [arizalar.join(", "), f.desc.trim()].filter(Boolean).join(" — ");
        S.sent = await store.create({cat:f.cat, issues:f.issues.slice(), desc:aciklama, name:f.name.trim(), block:f.block, flat:f.flat.trim(), phone:f.phone.trim()});
        telegramBildir(S.sent);
        scrollTo(0,0);
      } catch(err){
        console.error(err);
        S.err = "Gönderilemedi. İnternet bağlantınızı kontrol edip tekrar deneyin.";
      }
      S.sending = false; render();
    }
    else if (act==="iptalBenim"){
      if (S.armed !== id){ S.armed = id; render(); return; }
      S.armed = null; await store.cancelMine(find(S.mine)); toast("Bildirim iptal edildi"); render();
    }
    else if (act==="giris"){
      const pin = $("#pin"), em = $("#email"), pw = $("#pass");
      try { await store.login(em?em.value.trim():"", pin?pin.value:pw.value); S.err = ""; startPanel(); toast("Giriş yapıldı"); }
      catch(err){ S.err = err.code==="yonetim" ? "YONETIM" : err.code==="yetki" ? "Bu hesap teknisyen olarak tanımlı değil." : store.mode==="demo" ? "PIN hatalı." : "E-posta veya şifre hatalı."; render(); }
    }
    else if (act==="cikis"){ if (unAll) unAll(); unAll = null; S.all = []; tesisDurdur(); await store.logout(); render(); }
    else if (act==="rolKaydet"){
      const temiz = id => $(id).value.split(/[\s,;]+/).map(x=>x.trim().toLowerCase()).filter(x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
      const L = temiz("#rolListe"), TL = temiz("#rolTesis");
      try { await store.setRoller({yonetim: L, tesis: TL}); S.roller = L; S.rolTesis = TL; $("#rolListe").value = L.join("\n"); $("#rolTesis").value = TL.join("\n"); toast(`${L.length} yönetim · ${TL.length} tesis hesabı kaydedildi`); render(); } catch(err){ console.error(err); toast("Kaydedilemedi: Firebase kurallarını kontrol edin"); }
    }
    else if (act==="filtre"){ syncForm(); S.filter = v; render(); }
    else if (act==="durum"){ syncForm(); const a = find(S.all); const patch = {status: v}; if (v==="tamamlandi") patch.completedAt = Date.now(); if (S.notes[id] !== undefined) patch.note = S.notes[id]; await store.update(a, patch); toast(DURUM[v] + " olarak işaretlendi"); }
    else if (act==="not"){ syncForm(); const a = find(S.all); await store.update(a, {note: S.notes[id] ?? ""}); toast("Not kaydedildi"); }
    else if (act==="iptal"){
      syncForm();
      if (S.armed !== id){ S.armed = id; render(); return; }
      S.armed = null; const patch = {status: "iptal"}; if (S.notes[id] !== undefined) patch.note = S.notes[id];
      await store.update(find(S.all), patch); toast("Bildirim iptal edildi");
    }
  } catch(err){ console.error(err); toast("İşlem yapılamadı, tekrar deneyin"); }
});

function startPanel(){
  if (unAll) unAll();
  kodBaslat();
  if (store.isTech() && store.getRoller) store.getRoller().then(r => { S.roller = r.yonetim || []; S.rolTesis = r.tesis || []; if (S.view==="panel") render(); }).catch(()=>{});
  unAll = store.isTech() ? store.listenAll(list => { S.all = list; if (S.view==="panel") render(); }) : null;
  render();
}

function route(){
  const h = location.hash.slice(1);
  if (/^d-\d/.test(h)){
    history.replaceState(null, "", location.pathname + "#devriye");
    const n = qrCoz(h);
    S.view = "devriye"; S.err = ""; render();
    if (n) noktaOkut(n); else toast("QR kodu tanınmadı");
    return;
  }
  S.view = ["randevu","randevularim","panel","personel","devriye","tesis","tasinma"].includes(h) ? h : "randevu";
  if (S.view !== "tesis"){ T.f = null; T.detay = null; }
  if ((S.view === "personel" || S.view === "devriye") && store.kodOku && Date.now() - (S.kodYoklandi||0) > 60000){ S.kodYoklandi = Date.now(); kodYokla(); }
  S.err = ""; S.armed = null;
  render();
}
window.addEventListener("hashchange", route);
window.addEventListener("online", () => { tgKuyrukGonder(); if (S.view==="devriye") render(); });
window.addEventListener("offline", () => { if (S.view==="devriye") render(); });
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{});

$("#view").innerHTML = `<div class="empty"><strong>Yükleniyor…</strong></div>`;
store.ready.then(() => {
  unMine = store.listenMine(list => { S.mine = list; if (S.view==="randevularim" || S.view==="personel") render(); });
  if (store.isTech()) startPanel();
  route();
  kuyrukGonder(); tgKuyrukGonder(); setInterval(()=>{ kuyrukGonder(); tgKuyrukGonder(); }, 30000); window.addEventListener("online", kuyrukGonder);
}).catch(err => {
  console.error(err);
  $("#view").innerHTML = `<div class="empty"><strong>Bağlantı kurulamadı</strong>Sayfayı yenileyin. Sorun sürerse teknisyene haber verin.</div>`;
});
</script>

</body>
