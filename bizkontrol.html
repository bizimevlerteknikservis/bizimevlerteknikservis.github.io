<style>
:root{
  --bg:#eef3f9; --panel:#ffffff; --panel2:#f5f8fc; --ink:#10233d; --muted:#5f7591; --line:#dde6f0;
  --accent:#2b7cd3; --ok:#1e9d5b; --warn:#c77812; --bad:#d63a35;
  --okbg:#e6f6ed; --warnbg:#fdf1e1; --badbg:#fdeaea; --accbg:#e7f0fb;
  --ben:#17588f; --benink:#fff;
  --shadow:0 8px 24px rgba(16,40,80,.07); color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#081320; --panel:#0f1f33; --panel2:#0b192a; --ink:#e4eef9; --muted:#8ea6bf; --line:#1d3350;
  --accent:#5bb0ff; --ok:#36c47a; --warn:#f0a43a; --bad:#ff6b66;
  --okbg:rgba(54,196,122,.14); --warnbg:rgba(240,164,58,.14); --badbg:rgba(255,107,102,.14); --accbg:rgba(91,176,255,.13);
  --ben:#1f6fb8; --benink:#fff;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#081320; --panel:#0f1f33; --panel2:#0b192a; --ink:#e4eef9; --muted:#8ea6bf; --line:#1d3350;
  --accent:#5bb0ff; --ok:#36c47a; --warn:#f0a43a; --bad:#ff6b66;
  --okbg:rgba(54,196,122,.14); --warnbg:rgba(240,164,58,.14); --badbg:rgba(255,107,102,.14); --accbg:rgba(91,176,255,.13);
  --ben:#1f6fb8; --benink:#fff;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
a{color:var(--accent)}

/* yerleşim */
.kabuk{display:grid;grid-template-columns:280px 1fr;height:100dvh;max-width:1280px;margin:0 auto}
.yan{border-right:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;min-height:0}
.ana{display:flex;flex-direction:column;min-height:0;min-width:0}
header.ust{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(140deg,#0f2d52,#2f8ad6);display:grid;place-items:center;color:#fff;flex:none;font-weight:800;font-size:13px;letter-spacing:.02em;position:relative}
.logo::after{content:"";position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid var(--panel)}
.marka small{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.marka h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.01em}
.marka h1 span{color:var(--accent)}
.ust .sag{margin-left:auto;display:flex;gap:6px;align-items:center}
.ibtn{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:7px 11px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;color:var(--ink);white-space:nowrap}
.ibtn:hover{border-color:var(--accent)}
.gecmisBtn{display:none}

.yan-ust{padding:14px;display:flex;flex-direction:column;gap:10px}
.yeniBtn{border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;text-align:left}
.yan h3{margin:4px 14px 6px;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.liste{overflow:auto;padding:0 8px 14px;flex:1}
.sohbetSatir{display:flex;align-items:center;gap:6px;border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink)}
.sohbetSatir:hover{background:var(--accbg)}
.sohbetSatir[aria-current="true"]{background:var(--accbg);font-weight:700}
.sohbetSatir span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.sohbetSatir small{color:var(--muted);font-size:11.5px;white-space:nowrap}
.sohbetSatir button{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:2px 4px;border-radius:6px;opacity:0}
.sohbetSatir:hover button,.sohbetSatir[aria-current="true"] button{opacity:1}
.yan-alt{padding:12px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

/* sohbet */
.akis{flex:1;overflow:auto;position:relative;padding:18px 16px 8px;scroll-behavior:smooth}
.akis-ic{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.hosgeldin{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.hosgeldin h2{margin:0 0 4px;font-size:21px}
.hosgeldin p{margin:0 0 14px;color:var(--muted)}
.raporBtn{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:16px;padding:14px 16px;background:linear-gradient(120deg,#0f2d52,#2b7cd3);color:#fff;cursor:pointer;text-align:left;margin-bottom:14px}
.raporBtn b{display:block;font-size:16px}.raporBtn small{opacity:.85}
.raporBtn .ok{margin-left:auto;font-size:22px}
.cipler{display:flex;flex-wrap:wrap;gap:8px}
.cip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:8px 13px;cursor:pointer;font-size:13.5px;font-weight:600;text-align:left}
.cip:hover{border-color:var(--accent);color:var(--accent)}

.msj{display:flex;gap:10px;align-items:flex-start}
.msj.ben{justify-content:flex-end}
.msj.ben .balon{background:var(--ben);color:var(--benink);border-radius:18px 18px 4px 18px;padding:10px 14px;max-width:80%;white-space:pre-wrap}
.msj .av{width:30px;height:30px;border-radius:10px;background:linear-gradient(140deg,#0f2d52,#2f8ad6);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;flex:none;margin-top:2px}
.cevap{background:var(--panel);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:14px 16px;box-shadow:var(--shadow);min-width:0;flex:1;max-width:100%}
.cevap h4{margin:0 0 4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cevap .oz{margin:0 0 10px;font-size:15.5px}
.cevap .oz b{font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin:10px 0}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kpi strong{display:block;font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.iyi strong{color:var(--ok)}.kpi.dikkat strong{color:var(--warn)}.kpi.kotu strong{color:var(--bad)}
.blk{margin-top:12px}
.blk h5{margin:0 0 6px;font-size:13.5px}
.satirlar{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.satir{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.satir:first-child{border-top:0}
.satir .s1{flex:1;min-width:0}
.satir .s1 small{display:block;color:var(--muted);font-size:12.5px}
.satir em{font-style:normal;color:var(--muted);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.etk{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700;white-space:nowrap}
.etk.yeni{background:var(--badbg);color:var(--bad)}.etk.ilg{background:var(--warnbg);color:var(--warn)}.etk.tam{background:var(--okbg);color:var(--ok)}.etk.not{background:var(--accbg);color:var(--accent)}
.cubuk{display:grid;grid-template-columns:64px 1fr 36px;gap:8px;align-items:center;padding:6px 12px;border-top:1px solid var(--line);font-size:14px}
.cubuk:first-child{border-top:0}
.cubuk i{display:block;height:10px;border-radius:5px;background:var(--accent);min-width:3px}
.cubuk b{font-variant-numeric:tabular-nums;text-align:right}
.uyarilar{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.uyarilar li{background:var(--warnbg);color:var(--ink);border-radius:10px;padding:8px 11px;font-size:14px}
.uyarilar li.kotu{background:var(--badbg)}
.uyarilar li.iyi{background:var(--okbg)}
.kaynak{margin-top:12px;font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kaynak .bos{flex:1}
.mini{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:4px 9px;font-size:12.5px;font-weight:600;cursor:pointer}
.mini:hover{border-color:var(--accent)}
.bosVeri{color:var(--muted);font-size:14px;padding:4px 0}
.anlamadim .cipler{margin-top:10px}

/* yükleniyor */
.yaz{display:inline-flex;gap:5px;align-items:center;padding:6px 2px}
.yaz i{width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:.35;animation:zipla 1s infinite}
.yaz i:nth-child(2){animation-delay:.15s}.yaz i:nth-child(3){animation-delay:.3s}
.yaz span{margin-left:8px;color:var(--muted);font-size:13px}
@keyframes zipla{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-5px);opacity:1}}
@media (prefers-reduced-motion:reduce){.yaz i{animation:none;opacity:.8}}

/* giriş alanı */
.altbar{border-top:1px solid var(--line);background:var(--panel);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.altbar-ic{max-width:820px;margin:0 auto}
.hizli{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.hizli::-webkit-scrollbar{display:none}
.hizli .cip{white-space:nowrap;padding:6px 11px;font-size:13px}
.giris-satir{display:flex;gap:8px;align-items:flex-end;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 14px}
.giris-satir:focus-within{border-color:var(--accent)}
.giris-satir textarea{flex:1;border:0;background:transparent;resize:none;outline:0;max-height:140px;padding:8px 0;font-size:16px;line-height:1.4}
.gonder{border:0;width:42px;height:42px;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}
.gonder:disabled{opacity:.45;cursor:default}
.gonder svg{width:20px;height:20px}
.not-alt{font-size:11.5px;color:var(--muted);margin-top:6px;text-align:center}

/* giriş ekranı */
.girisKutu{max-width:380px;margin:12vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.inp{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:11px 12px;margin-top:10px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
.bad{color:var(--bad)}.mut{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#10233d;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;box-shadow:var(--shadow)}

/* mobil */
@media (max-width:860px){
  .kabuk{grid-template-columns:1fr}
  .yan{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .yan.acik{transform:none}
  .perde{position:fixed;inset:0;background:rgba(5,12,22,.45);z-index:39}
  .gecmisBtn{display:inline-block}
  header.ust{padding:10px 12px}
  .marka{min-width:0}
  .marka small{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .marka h1{font-size:17px;white-space:nowrap}
  .logo{width:36px;height:36px;border-radius:11px;font-size:11.5px}
  header.ust{gap:9px}
  .ust .sag{gap:4px}.ust .ibtn{padding:7px 9px}
  .gyaz{display:none}
  .not-alt{display:none}
  .akis{padding:14px 12px 6px}
  .altbar{padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
  .msj.ben .balon{max-width:88%}
  .msj .av{display:none}
  .cevap{border-radius:18px}
}
@media print{
  .yan,.altbar,header.ust .sag,.kaynak button,.msj.ben,.hosgeldin{display:none!important}
  .kabuk{display:block;height:auto}.akis{overflow:visible}.cevap{box-shadow:none;break-inside:avoid}
  body{background:#fff}
}
</style>
</head>
<body>
<div class="girisKutu" id="giris" hidden>
  <h2 style="margin:0 0 6px">BİZKONTROL</h2><p class="mut" style="margin:0">Yönetim asistanı. Teknisyen, müdür ve amir hesabıyla girilir.</p>
  <form id="girisForm"><input class="inp" id="gEmail" type="email" placeholder="E-posta" autocomplete="username" required>
  <input class="inp" id="gSifre" type="password" placeholder="Şifre" autocomplete="current-password" required>
  <button class="btn" style="width:100%;margin-top:12px">Giriş</button><p class="bad" id="gHata" style="font-size:13px"></p></form>
</div>

<div class="kabuk" id="app" hidden>
  <aside class="yan" id="yan">
    <div class="yan-ust">
      <button class="yeniBtn" data-act="yeni">＋ Yeni sohbet</button>
    </div>
    <h3>Önceki konuşmalar</h3>
    <div class="liste" id="sohbetListe"></div>
    <div class="yan-alt">Konuşmalar sadece bu cihazda saklanır.</div>
  </aside>
  <div class="perde" id="perde" hidden data-act="yanKapat"></div>
  <main class="ana">
    <header class="ust">
      <button class="ibtn gecmisBtn" data-act="yanAc" aria-label="Önceki konuşmalar">☰</button>
      <div class="logo" aria-hidden="true">BK</div>
      <div class="marka"><small>Bizimevler 1 · <span id="kimAd"></span></small><h1>BİZKONTROL <span>AI</span></h1></div>
      <div class="sag">
        <button class="ibtn" data-act="yenile" title="Verileri yenile">↻</button>
        <button class="ibtn" id="temaBtn" type="button" title="Tema">🌓</button>
        <a class="ibtn" id="geri" href="index.html#panel">←<span class="gyaz"> Geri</span></a>
      </div>
    </header>
    <div class="akis" id="akis"><div class="akis-ic" id="akisIc"></div></div>
    <div class="altbar">
      <div class="altbar-ic">
        <div class="hizli" id="hizli"></div>
        <form class="giris-satir" id="soruForm">
          <textarea id="soru" rows="1" placeholder="Sorunuzu yazın… ör. Bu ay en çok arıza hangi blokta?" aria-label="Soru"></textarea>
          <button class="gonder" id="gonder" aria-label="Gönder" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </form>
        <div class="not-alt">Cevaplar sitenin canlı kayıtlarından hesaplanır · salt okunur, hiçbir kayıt değiştirilmez</div>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* =====================================================================
   BİZKONTROL — Aşama 1: doğrulanmış cevaplar (salt okunur)
   Sadece aşağıdaki SORGU fonksiyonları veri okur; hiçbir yere yazmaz.
   ===================================================================== */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GUN = 864e5, SA = 36e5;
const AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const GUNLER = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const saat = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const tarih = t => { const d = new Date(t); return `${d.getDate()} ${AYLAR[d.getMonth()].slice(0,3)}`; };
const tarihSaat = t => `${tarih(t)} ${saat(t)}`;
const gunBas = (t = Date.now()) => { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); };
const sure = dk => dk < 60 ? `${dk} dk` : dk < 1440 ? `${Math.floor(dk/60)} sa${dk%60 ? " " + dk%60 + " dk" : ""}` : `${Math.floor(dk/1440)} gün${Math.floor(dk%1440/60) ? " " + Math.floor(dk%1440/60) + " sa" : ""}`;
const kisa = ad => { const p = String(ad||"").trim().split(/\s+/); return p.length > 1 ? `${p[0]} ${p[p.length-1][0]}.` : (p[0] || "—"); };
const norm = s => String(s||"").toLocaleLowerCase("tr").replace(/[çğıöşü]/g, c => ({"ç":"c","ğ":"g","ı":"i","ö":"o","ş":"s","ü":"u"}[c])).replace(/[^\w\s]/g," ").replace(/\s+/g," ").trim();
function toast(m){ const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(()=>t.hidden = true, 2600); }

const KAT_AD = {elektrik:"Elektrik", su:"Su tesisatı", kombi:"Kombi / ısıtma", kapi:"Kapı / kilit", asansor:"Asansör", diger:"Diğer",
  p_isik:"Aydınlatma", p_kapi:"Kapı / kilit", p_asansor:"Asansör", p_su:"Su / tesisat", p_hasar:"Kırık / hasar", p_bahce:"Bahçe / peyzaj",
  p_malzeme:"Malzeme talebi", p_temiz:"Temizlik / koku", p_diger:"Diğer", p_tasinma:"Taşınma / tadilat", p_gelemiyorum:"İşe gelemiyor", tesis_asansor:"Asansör"};
const ARIZA_DISI = new Set(["p_tasinma","p_gelemiyorum","p_malzeme"]);
const NOKTA_AD = {n01:"A1 Basket Sahası Köşesi",n02:"A1 – Final Arası Tel Örgü",n03:"A2 Önü Büyük Aydınlatma Direği",n04:"Boy Turnike Yanı Tel Örgü",n05:"A3 Arkası Tel Örgü",n06:"A4 Arkası Kamera Direği",n07:"A4 Önü Otopark Kepengi",n08:"C4 Arkası Kamelya",n09:"Mescit Camı",n10:"F1 Arkası Kamelya",n11:"F2 Karşısı Demir Kapı",n12:"F1 Önü Büyük Aydınlatma",n13:"F1 – C2 Arası Küçük Direk",n14:"C1 – C4 Arası Küçük Direk",n15:"Trafo Bölgesi",n16:"B3 Karşısı Büyük Aydınlatma",n17:"B3 – B4 Arası Küçük Direk",n18:"B6 Arkası Küçük Direk",n19:"B6 Önü Büyük Direk",n20:"Kuaför Merdiveni Büyük Direk",n21:"D3 Arkası Park Yapılamaz Tabelası"};
const NNO = id => +String(id).slice(1);
const BLOKLAR = ["A1","A2","A3","A4","A5","A6","A7","B2","B3","B4","B5","B6","C1","C2","C3","C4","D1","D2","D3","D4","F1","F2"];
const CIFT = [["C1","C2"],["C3","C4"],["D1","D2"],["D3","D4"],["F1","F2"]];
const HIDRO = [...BLOKLAR.filter(b => !CIFT.flat().includes(b)).map(b => ({id:"H-" + b, ad:`${b} Blok`})), ...CIFT.map(([a, b]) => ({id:`H-${a}${b}`, ad:`${a}–${b} Blok`}))].sort((x, y) => x.ad.localeCompare(y.ad, "tr"));
const ASANSOR = BLOKLAR.flatMap(b => [1, 2].map(n => ({id:`${b}-${n}`, ad:`${b} Blok · Asansör ${n}`})));
const HID_BAKIM_GUN = 180, AS_BAKIM_GUN = 35;   // Tesis takip ile aynı sınırlar
const hidAd = id => { const [u, p] = String(id || "").split(":"); const h = HIDRO.find(x => x.id === u), ad = h ? h.ad : u.replace("H-", "");
  if (!p) return ad + " hidroforu"; return `${ad} · ${p[0] === "A" ? "alt zon" : "üst zon"} ${p[1] === "P" ? "pompa " + (+p.slice(2) || "") : "basınç tankı"}`; };
const TUR = {araDk:45, bas:21, bit:7, gece:10};   // devriye 21:00–07:00, saatte 1 tur (Kontrol Merkezi ile aynı)

const B = {rol:{tech:false, tesis:false, yon:false}, kim:"", email:"", V:null, vTs:0, yukleniyor:null, sohbetler:[], aktif:null, mesgul:false};
let DB = null;

/* ======================= 1) VERİ: izin verilen okuma sorguları ======================= */
// Sadece okuma. Rol ayrımı Firebase kurallarıyla da korunur: teknisyen olmayan daire arızalarını göremez.
async function veriYukle(zorla){
  if (!zorla && B.V && Date.now() - B.vTs < 90e3) return B.V;
  if (B.yukleniyor) return B.yukleniyor;
  B.yukleniyor = (async () => {
    const simdi = Date.now(), d120 = simdi - 120*GUN;
    const guvenli = (p, bos) => p.catch(e => { console.warn(e); (B.hatalar ||= []).push(e && e.code || String(e)); return bos; });
    B.hatalar = [];
    const [appts, tesis, devriye, mesai, gorev, izin] = await Promise.all([
      guvenli(DB.arizalar(d120, B.rol.tech), []), guvenli(DB.tesis(simdi - 400*GUN), []), guvenli(DB.devriye(simdi - 9*GUN), []),
      guvenli(DB.mesai(simdi - 3*GUN), []), guvenli(DB.gorev(simdi - 45*GUN), []), guvenli(DB.izinler(), [])
    ]);
    B.V = hazirla({appts, tesis, devriye, mesai, gorev, izin}); B.vTs = Date.now(); B.yukleniyor = null; return B.V;
  })();
  return B.yukleniyor;
}

/* Ham kayıtları tek tip "arıza" listesine çevirir. Personelin asansör bildirimi tesis kaydına dönüştüyse çift sayılmaz. */
function hazirla(R){
  const asTesis = R.tesis.filter(k => k.tur === "ariza");
  const bagli = new Map(); asTesis.forEach(k => (k.bildirenler || []).forEach(id => bagli.set(id, k)));
  const ariza = [];
  R.appts.forEach(a => {
    if (a.status === "iptal" || a.sample || ARIZA_DISI.has(a.cat)) return;
    const t = bagli.get(a.id);
    const durum = t ? (t.cozuldu ? "tamamlandi" : "onaylandi") : a.status;
    ariza.push({id:a.id, ts:a.createdAt || 0, blok:(a.block || "").toUpperCase().trim(), kat:a.cat, katAd:KAT_AD[a.cat] || "Diğer",
      kaynak:a.src === "personel" ? "personel" : "sakin", durum, bitti: t ? t.cozuldu || null : (a.completedAt || null),
      yer: a.src === "personel" ? (a.alan || (a.block ? `${a.block} Blok${a.kat ? " · " + a.kat : ""}` : "Yer belirtilmedi")) : `${a.block} Blok · D.${a.flat || "?"}`,
      ozet: [ ...(a.issues || []).filter(x => x !== "Diğer") ].join(", ") || String(a.desc || "").slice(0, 70), kim:a.src === "personel" ? a.name : "", tesisId: t ? t.id : null});
  });
  const temsil = new Set(ariza.filter(x => x.tesisId).map(x => x.tesisId));
  asTesis.forEach(k => {
    if (temsil.has(k.id)) return;
    const blok = String(k.ekipman || "").split("-")[0].toUpperCase();
    ariza.push({id:k.id, ts:k.ts || 0, blok, kat:"tesis_asansor", katAd:"Asansör", kaynak:"tesis", durum:k.cozuldu ? "tamamlandi" : "onaylandi", bitti:k.cozuldu || null,
      yer:`${blok} Blok · Asansör ${String(k.ekipman || "").split("-")[1] || "?"}`, ozet:(k.mahsur ? "Mahsur kaldı · " : "") + (k.not || ""), kim:k.by || "", tesisId:k.id});
  });
  ariza.sort((a,b) => b.ts - a.ts);
  const asansor = asTesis.map(k => ({...k, blok:String(k.ekipman || "").split("-")[0].toUpperCase()}));
  // personelin tesis kaydına dönüşmemiş asansör bildirimleri ve sakinlerin asansör arızaları da asansör sayımına girer
  ariza.filter(x => (x.kat === "p_asansor" || x.kat === "asansor") && !x.tesisId).forEach(x => asansor.push({id:x.id, ts:x.ts, ekipman:`${x.blok || "?"}-?`, blok:x.blok, cozuldu:x.durum === "tamamlandi" ? (x.bitti || x.ts) : null, not:x.ozet, kaynakAppt:true}));
  const gelemeyen = R.appts.filter(a => a.cat === "p_gelemiyorum" && a.status !== "iptal");
  const kesinti = R.tesis.filter(k => k.tur === "kesinti");
  const gorev = R.gorev.filter(g => g.tur !== "talimat");
  return {ariza, asansor, tesis:R.tesis, devriye:R.devriye, mesai:R.mesai, gorev, gelemeyen, kesinti, izin:R.izin, sayilar:{appts:R.appts.length, tesis:R.tesis.length, devriye:R.devriye.length, mesai:R.mesai.length, gorev:R.gorev.length}};
}

/* ======================= 2) GÜVENLİ SORGU FONKSİYONLARI ======================= */
function donemBul(n, varsayilan){
  const bugun = gunBas(), simdi = Date.now(), d = new Date();
  if (/\bdun\b|\bdunku\b|\bdunden\b/.test(n)) return {a:bugun - GUN, b:bugun, ad:"Dün", cumle:"Dün"};
  if (/gecen ay|onceki ay/.test(n)){ const a = new Date(d.getFullYear(), d.getMonth()-1, 1).getTime(); return {a, b:new Date(d.getFullYear(), d.getMonth(), 1).getTime(), ad:AYLAR[new Date(a).getMonth()], cumle:AYLAR[new Date(a).getMonth()] + " ayında"}; }
  if (/bu ay|ay icinde|aylik|bu ayki|bu ayin/.test(n)) return {a:new Date(d.getFullYear(), d.getMonth(), 1).getTime(), b:simdi, ad:"Bu ay (" + AYLAR[d.getMonth()] + ")", cumle:"Bu ay"};
  if (/bu hafta|haftalik|hafta icinde/.test(n)){ const g = (d.getDay() + 6) % 7; return {a:bugun - g*GUN, b:simdi, ad:"Bu hafta", cumle:"Bu hafta"}; }
  if (/son 7|son yedi|son bir hafta|son hafta/.test(n)) return {a:bugun - 6*GUN, b:simdi, ad:"Son 7 gün", cumle:"Son 7 günde"};
  if (/son 30|son otuz|son bir ay/.test(n)) return {a:bugun - 29*GUN, b:simdi, ad:"Son 30 gün", cumle:"Son 30 günde"};
  if (/bugun|bu gun|bugunku/.test(n)) return {a:bugun, b:simdi, ad:"Bugün", cumle:"Bugün"};
  return varsayilan === "ay" ? {a:new Date(d.getFullYear(), d.getMonth(), 1).getTime(), b:simdi, ad:"Bu ay (" + AYLAR[d.getMonth()] + ")", cumle:"Bu ay"} : {a:bugun, b:simdi, ad:"Bugün", cumle:"Bugün"};
}
const aralik = (L, D, f = x => x.ts) => L.filter(x => f(x) >= D.a && f(x) < D.b);
const durumEtk = d => d === "bekliyor" ? `<span class="etk yeni">Yeni</span>` : d === "onaylandi" ? `<span class="etk ilg">İlgileniliyor</span>` : d === "tamamlandi" ? `<span class="etk tam">Çözüldü</span>` : `<span class="etk not">${esc(d)}</span>`;
const kaynakAd = k => k === "sakin" ? "Daire" : k === "personel" ? "Personel" : "Asansör kaydı";
const arizaSatir = (x, sag) => ({s1:`${esc(x.yer)} · ${esc(x.katAd)} ${durumEtk(x.durum)}`, alt:esc(x.ozet || "") + (x.kim ? ` · ${esc(kisa(x.kim))}` : ""), sag: sag || tarihSaat(x.ts)});
function sayac(L, f){ const m = {}; L.forEach(x => { const k = f(x); if (k) m[k] = (m[k] || 0) + 1; }); return Object.entries(m).sort((a,b) => b[1] - a[1]); }

// S1 / S6: açılan ve çözülen arızalar
function qAcilan(V, D){
  const L = aralik(V.ariza, D), coz = L.filter(x => x.durum === "tamamlandi").length;
  const kat = sayac(L, x => x.katAd), kay = sayac(L, x => kaynakAd(x.kaynak));
  return {baslik:`Açılan arızalar · ${D.ad}`,
    oz: L.length ? `${D.cumle} <b>${L.length} arıza</b> açıldı. Bunların <b>${coz}</b> tanesi çözüldü, <b>${L.length - coz}</b> tanesi açık.` : `${D.cumle} açılan arıza kaydı yok.`,
    kpi: L.length ? [[L.length, "Açılan"], [coz, "Çözüldü", "iyi"], [L.filter(x=>x.durum==="bekliyor").length, "Yeni (bakılmadı)", "kotu"], [L.filter(x=>x.durum==="onaylandi").length, "İlgileniliyor", "dikkat"]] : null,
    bloklar:[ kat.length && {tip:"cubuk", baslik:"Türe göre", veri:kat}, kay.length > 1 && {tip:"cubuk", baslik:"Kaynağa göre", veri:kay},
      L.length && {tip:"liste", baslik:"Kayıtlar", veri:L.slice(0, 12).map(x => arizaSatir(x)), fazla:L.length - 12} ].filter(Boolean),
    sayi:L.length};
}
function qCozulen(V, D){
  const L = V.ariza.filter(x => x.durum === "tamamlandi" && x.bitti && x.bitti >= D.a && x.bitti < D.b).sort((a,b) => b.bitti - a.bitti);
  const sureler = L.map(x => Math.round((x.bitti - x.ts)/6e4)).filter(x => x >= 0);
  const ort = sureler.length ? Math.round(sureler.reduce((a,b) => a + b, 0) / sureler.length) : null;
  return {baslik:`Çözülen arızalar · ${D.ad}`,
    oz: L.length ? `${D.cumle} <b>${L.length} arıza çözüldü.</b>${ort !== null ? ` Ortalama çözüm süresi <b>${sure(ort)}</b>.` : ""}` : `${D.cumle} çözülen arıza kaydı yok.`,
    kpi: L.length ? [[L.length, "Çözülen", "iyi"], ...(ort !== null ? [[sure(ort), "Ort. çözüm süresi"]] : []), [L.filter(x => x.ts >= D.a).length, "Aynı dönem açılıp çözülen"]] : null,
    bloklar:[ L.length && {tip:"liste", baslik:"Çözülenler", veri:L.slice(0, 12).map(x => arizaSatir(x, `${saat(x.bitti)} · ${sure(Math.max(0, Math.round((x.bitti - x.ts)/6e4)))}`)), fazla:L.length - 12} ].filter(Boolean),
    sayi:L.length};
}
// S2 / S7: blok dağılımı
function qBlok(V, D){
  const L = aralik(V.ariza, D), bl = sayac(L.filter(x => x.blok), x => x.blok + " Blok"), yok = L.filter(x => !x.blok).length;
  const ilk = bl[0];
  let detay = null;
  if (ilk){ const b = ilk[0].replace(" Blok",""); detay = {tip:"cubuk", baslik:`${ilk[0]}: türe göre`, veri:sayac(L.filter(x => x.blok === b), x => x.katAd)}; }
  const esit = bl.filter(x => ilk && x[1] === ilk[1]).map(x => x[0]);
  return {baslik:`Bloklara göre arızalar · ${D.ad}`,
    oz: ilk ? (esit.length > 1 ? `${D.cumle} en çok arıza <b>${esit.map(x => x.replace(" Blok","")).join(", ")}</b> bloklarında (her birinde <b>${ilk[1]}</b>).` : `${D.cumle} en çok arıza <b>${ilk[0].replace(" Blok","")}</b> blokta: <b>${ilk[1]} arıza</b>. Toplam ${L.length} arıza içinde payı %${Math.round(ilk[1]/L.length*100)}.`) : `${D.cumle} blok bilgisi olan arıza kaydı yok.`,
    bloklar:[ bl.length && {tip:"cubuk", baslik:"Blok sıralaması", veri:bl.slice(0, 12)}, detay ].filter(Boolean),
    uyari: yok ? [[`${yok} arızada blok belirtilmemiş (ortak alan, bahçe vb.) — sıralamaya girmedi.`, ""]] : null,
    sayi:L.length};
}
// S3: asansör arızaları
function qAsansor(V, D){
  const L = aralik(V.asansor, D).sort((a,b) => b.ts - a.ts);
  const acik = V.asansor.filter(k => !k.cozuldu), mahsur = L.filter(k => k.mahsur).length;
  const coz = L.filter(k => k.cozuldu).map(k => Math.round((k.cozuldu - k.ts)/6e4)).filter(x => x >= 0);
  const ort = coz.length ? Math.round(coz.reduce((a,b) => a + b, 0)/coz.length) : null;
  const asAd = e => { const [b, n] = String(e || "").split("-"); return `${b} Blok · ${n && n !== "?" ? n + ". asansör" : "asansör (no belirsiz)"}`; };
  const enCok = sayac(L, k => asAd(k.ekipman));
  return {baslik:`Asansör arızaları · ${D.ad}`,
    oz: `${D.cumle} <b>${L.length} asansör arızası</b> kaydedildi.${mahsur ? ` <b>${mahsur}</b> tanesinde mahsur kalma var.` : ""} Şu an <b>${acik.length}</b> asansör arızası açık.`,
    kpi:[[L.length, "Arıza"], [mahsur, "Mahsur", mahsur ? "kotu" : "iyi"], [acik.length, "Şu an açık", acik.length ? "dikkat" : "iyi"], ...(ort !== null ? [[sure(ort), "Ort. çözüm"]] : [])],
    bloklar:[ enCok.length && {tip:"cubuk", baslik:"En çok arıza yapan asansörler", veri:enCok.slice(0, 8)},
      acik.length && {tip:"liste", baslik:"Açık asansör arızaları", veri:acik.sort((a,b) => a.ts - b.ts).map(k => ({s1:`${esc(asAd(k.ekipman))}${k.mahsur ? ` <span class="etk yeni">Mahsur</span>` : ""}`, alt:esc(k.not || ""), sag:`${sure(Math.round((Date.now() - k.ts)/6e4))}dır açık`}))} ].filter(Boolean),
    uyari: enCok[0] && enCok[0][1] >= 3 ? [[`${enCok[0][0]} bu dönemde ${enCok[0][1]} kez arıza yaptı — kronik, firmaya ayrıca bildirilmeli.`, "kotu"]] : null,
    sayi:L.length};
}
// Hidrofor: pompa tamiri, tank değişimi, bakım
function qHidrofor(V, D){
  const K = V.tesis.slice().sort((a, b) => a.ts - b.ts), simdi = Date.now();
  const pompaSon = {}; K.filter(k => k.tur === "pompa").forEach(k => { pompaSon[k.ekipman] = k; });
  const tamirde = Object.values(pompaSon).filter(k => k.olay === "tamire").sort((a, b) => a.ts - b.ts);
  const bakimSon = {}; K.filter(k => k.tur === "bakim").forEach(k => (k.ekipmanlar || []).forEach(id => { if (String(id).startsWith("H-")) bakimSon[id] = k; }));
  const geciken = HIDRO.filter(h => !bakimSon[h.id] || simdi - bakimSon[h.id].ts > HID_BAKIM_GUN*GUN);
  const donem = K.filter(k => k.ts >= D.a && k.ts < D.b && (k.tur === "pompa" || k.tur === "tank" || (k.tur === "bakim" && (k.ekipmanlar || []).some(x => String(x).startsWith("H-"))))).reverse();
  const tamire = donem.filter(k => k.tur === "pompa" && k.olay === "tamire"), geldi = donem.filter(k => k.tur === "pompa" && k.olay !== "tamire");
  const tank = donem.filter(k => k.tur === "tank"), bakim = donem.filter(k => k.tur === "bakim");
  const bakimUnite = new Set(bakim.flatMap(k => (k.ekipmanlar || []).filter(x => String(x).startsWith("H-"))));
  const tutar = donem.reduce((t, k) => t + (+k.tutar || 0), 0);
  const kayitAd = k => k.tur === "pompa" ? (k.olay === "tamire" ? "Pompa tamire gitti" : "Pompa tamirden geldi") : k.tur === "tank" ? "Basınç tankı değişti" : "Hidrofor bakımı";
  const kayitYer = k => k.tur === "bakim" ? (k.ekipmanlar || []).filter(x => String(x).startsWith("H-")).map(x => hidAd(x).replace(" hidroforu", "")).join(", ") : hidAd(k.ekipman);
  const enCok = sayac(tamire, k => hidAd(String(k.ekipman).split(":")[0]).replace(" hidroforu", ""));
  const uyari = [];
  if (tamirde.length) uyari.push([`${tamirde.length} pompa şu an tamirde — o hidroforlar yedeksiz çalışıyor olabilir.`, "kotu"]);
  if (geciken.length) uyari.push([`${geciken.length} hidroforun bakımı ${HID_BAKIM_GUN} günü geçti ya da hiç kayıt yok.`, ""]);
  if (enCok[0] && enCok[0][1] >= 2) uyari.push([`${enCok[0][0]} hidroforundan bu dönemde ${enCok[0][1]} pompa tamire gitti.`, ""]);
  return {baslik:`Hidrofor · ${D.ad}`,
    oz:`${D.cumle} <b>${tamire.length}</b> pompa tamire gitti, <b>${geldi.length}</b> pompa tamirden geldi, <b>${tank.length}</b> basınç tankı değişti, <b>${bakimUnite.size}</b> hidroforun bakımı yapıldı. Şu an <b>${tamirde.length} pompa tamirde</b>${geciken.length ? `, <b>${geciken.length}</b> hidroforun bakımı gecikmiş` : ""}.`,
    kpi:[[tamirde.length, "Şu an tamirde", tamirde.length ? "kotu" : "iyi"], [tamire.length, "Tamire giden"], [tank.length, "Tank değişimi"], [bakimUnite.size, "Bakım yapılan"], [geciken.length, "Bakımı geciken", geciken.length ? "dikkat" : "iyi"], ...(tutar ? [[tutar.toLocaleString("tr-TR") + " ₺", "Tutar"]] : [])],
    bloklar:[ tamirde.length && {tip:"liste", baslik:"Tamirdeki pompalar", veri:tamirde.map(k => ({s1:esc(hidAd(k.ekipman)), alt:[k.firma, k.not].filter(Boolean).map(esc).join(" · "), sag:`${tarih(k.ts)} · ${sure(Math.round((simdi - k.ts)/6e4))}`}))},
      donem.length && {tip:"liste", baslik:"Dönemdeki kayıtlar", veri:donem.slice(0, 12).map(k => ({s1:`${kayitAd(k)}`, alt:[kayitYer(k), k.firma, k.not, k.tutar ? (+k.tutar).toLocaleString("tr-TR") + " ₺" : ""].filter(Boolean).map(esc).join(" · "), sag:tarih(k.ts)})), fazla:donem.length - 12},
      geciken.length && {tip:"liste", baslik:`Bakımı geciken hidroforlar (${HID_BAKIM_GUN} gün)`, veri:geciken.map(h => ({s1:esc(h.ad), alt:bakimSon[h.id] ? `son bakım ${tarih(bakimSon[h.id].ts)} ${new Date(bakimSon[h.id].ts).getFullYear()}` : "bakım kaydı yok", sag:bakimSon[h.id] ? Math.floor((simdi - bakimSon[h.id].ts)/GUN) + " gün" : "—"})), fazla:0} ].filter(Boolean),
    uyari: uyari.length ? uyari : null, sayi:tamirde.length, tamirde, geciken};
}
// Bakım durumu: asansör (aylık) ve hidrofor (6 aylık)
function qBakim(V){
  const K = V.tesis.filter(k => k.tur === "bakim").sort((a, b) => a.ts - b.ts), simdi = Date.now();
  const son = {}; K.forEach(k => (k.ekipmanlar || []).forEach(id => { son[id] = k; }));
  const asGec = ASANSOR.filter(a => !son[a.id] || simdi - son[a.id].ts > AS_BAKIM_GUN*GUN);
  const h = qHidrofor(V, donemBul("bu ay"));
  const buAy = K.filter(k => k.ts >= donemBul("bu ay").a);
  const asBuAy = new Set(buAy.flatMap(k => (k.ekipmanlar || []).filter(id => ASANSOR.some(a => a.id === id))));
  return {baslik:"Bakım durumu",
    oz:`Bu ay <b>${asBuAy.size}</b> asansörün bakımı yapıldı. Bakımı ${AS_BAKIM_GUN} günü geçen <b>${asGec.length}</b> asansör, ${HID_BAKIM_GUN} günü geçen <b>${h.geciken.length}</b> hidrofor var.${h.tamirde.length ? ` <b>${h.tamirde.length}</b> pompa tamirde.` : ""}`,
    kpi:[[asBuAy.size, "Bu ay asansör bakımı"], [asGec.length, "Bakımı geciken asansör", asGec.length ? "dikkat" : "iyi"], [h.geciken.length, "Bakımı geciken hidrofor", h.geciken.length ? "dikkat" : "iyi"], [h.tamirde.length, "Tamirdeki pompa", h.tamirde.length ? "kotu" : "iyi"]],
    bloklar:[ asGec.length && {tip:"liste", baslik:`Bakımı geciken asansörler (${AS_BAKIM_GUN} gün)`, veri:asGec.slice(0, 15).map(a => ({s1:esc(a.ad), alt:son[a.id] ? `son bakım ${tarih(son[a.id].ts)}` : "bakım kaydı yok", sag:son[a.id] ? Math.floor((simdi - son[a.id].ts)/GUN) + " gün" : "—"})), fazla:asGec.length - 15},
      ...h.bloklar.filter(b => /geciken|Tamirdeki/.test(b.baslik)) ].filter(Boolean),
    sayi:asGec.length + h.geciken.length};
}
// S4: devriye
function geceBasi(ts = Date.now()){ const d = new Date(ts); if (d.getHours() < TUR.bas) d.setDate(d.getDate()-1); d.setHours(TUR.bas, 0, 0, 0); return d.getTime(); }
const geceAd = g => { const a = new Date(g), b = new Date(g + GUN); return `${a.getDate()}–${b.getDate()} ${AYLAR[b.getMonth()].slice(0,3)}`; };
function turlar(kayit){
  const ok = kayit.filter(k => k.tip !== "sorun" && NOKTA_AD[k.nokta]).sort((a,b) => a.ts - b.ts);
  const kisi = {}; ok.forEach(k => (kisi[k.gorevli] ||= []).push(k));
  const out = [];
  Object.values(kisi).forEach(liste => { let t = null;

  if (has("blok", "bina", "en cok ariza", "en fazla ariza", "en cok sorun")) return {f:"blok", d:donemBul(n, "ay")};

function cevapHTML(c, id){
  if (c.anlamadim) return `<div class="cevap anlamadim"><p class="oz" style="margin:0">Bu soruyu henüz cevaplayamıyorum. Şu an arızalar, bloklar, asansörler, devriye, bekleyen işler, personel devamı ve günlük rapor hakkında soru sorabilirsiniz.</p><div class="cipler">${HAZIR.slice(0, 6).map(([e, s]) => `<button class="cip" data-soru="${esc(s)}">${e} ${esc(s)}</button>`).join("")}</div></div>`;
  if (c.hata) return `<div class="cevap"><p class="oz" style="margin:0">⚠️ ${esc(c.hata)}</p></div>`;
  const kpi = c.kpi ? `<div class="kpis">${c.kpi.map(([v, e, s]) => `<div class="kpi ${s || ""}"><strong>${esc(v)}</strong><span>${esc(e)}</span></div>`).join("")}</div>` : "";
  const uy = c.uyari ? `${c.uyariBaslik ? `<div class="blk"><h5>${esc(c.uyariBaslik)}</h5>` : ""}<ul class="uyarilar">${c.uyari.map(([m, s]) => `<li class="${s}">${esc(m)}</li>`).join("")}</ul>${c.uyariBaslik ? "</div>" : ""}` : "";
  const bl = (c.bloklar || []).map(b => {
    if (b.tip === "bolum") return `<div class="blk" style="margin-top:16px"><h5 style="font-size:15px">${esc(b.baslik)}</h5><div style="font-size:14px">${b.alt}</div></div>`;
    if (b.tip === "cubuk"){ const max = Math.max(...b.veri.map(x => x[1]), 1); return `<div class="blk"><h5>${esc(b.baslik)}</h5><div class="satirlar">${b.veri.map(([ad, s]) => `<div class="cubuk"><span>${esc(ad.replace(" Blok",""))}</span><i style="width:${Math.round(s/max*100)}%"></i><b>${s}</b></div>`).join("")}</div></div>`; }
    if (b.tip === "liste") return `<div class="blk"><h5>${esc(b.baslik)}</h5><div class="satirlar">${b.veri.map(r => `<div class="satir"><div class="s1">${r.s1}${r.alt ? `<small>${r.alt}</small>` : ""}</div><em>${r.sag || ""}</em></div>`).join("")}${b.fazla > 0 ? `<div class="satir"><div class="s1 mut">+${b.fazla} kayıt daha</div></div>` : ""}</div></div>`;
    return "";
  }).join("");
  return `<div class="cevap"><h4>${esc(c.baslik)}</h4><p class="oz">${c.oz}</p>${kpi}${c.rapor ? uy + bl : bl + uy}${c.not ? `<p class="mut" style="font-size:12.5px;margin:10px 0 0">${esc(c.not)}</p>` : ""}
    <div class="kaynak"><span>${esc(c.kaynakMetin || "")}</span><span class="bos"></span><button class="mini" data-act="kopyala" data-id="${id}">📋 Kopyala</button>${navigator.share ? `<button class="mini" data-act="paylas" data-id="${id}">📤 Paylaş</button>` : ""}${c.rapor ? `<button class="mini" data-act="yazdir">🖨️ Yazdır / PDF</button>` : ""}</div></div>`;
}
function duzMetin(c){
  const t = s => String(s || "").replace(/<br\s*\/?>/g, "\n").replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'");
  const L = [`BİZKONTROL · ${t(c.baslik)}`, "", t(c.oz)];
  if (c.kpi) L.push("", c.kpi.map(([v, e]) => `${e}: ${v}`).join(" · "));
  if (c.uyari) L.push("", ...(c.uyariBaslik ? [c.uyariBaslik + ":"] : []), ...c.uyari.map(([m]) => "• " + m));
  (c.bloklar || []).forEach(b => {
    if (b.tip === "bolum") L.push("", t(b.baslik), t(b.alt));
    else if (b.tip === "cubuk") L.push("", t(b.baslik) + ":", ...b.veri.map(([a, s]) => `• ${a}: ${s}`));
    else if (b.tip === "liste") L.push("", t(b.baslik) + ":", ...b.veri.map(r => `• ${t(r.s1)}${r.alt ? " — " + t(r.alt) : ""}${r.sag ? " (" + t(r.sag) + ")" : ""}`), ...(b.fazla > 0 ? [`• +${b.fazla} kayıt daha`] : []));
  });
  L.push("", t(c.kaynakMetin || ""));
  return L.join("\n");
}

/* --- sohbet geçmişi (sadece bu cihazda) --- */
const SKEY = () => "bk-sohbet-" + (B.email || "test");
function sohbetYukle(){ try { B.sohbetler = JSON.parse(localStorage.getItem(SKEY()) || "[]"); } catch(e){ B.sohbetler = []; } }
function sohbetKaydet(){ try { localStorage.setItem(SKEY(), JSON.stringify(B.sohbetler.slice(0, 40))); } catch(e){ try { B.sohbetler = B.sohbetler.slice(0, 15); localStorage.setItem(SKEY(), JSON.stringify(B.sohbetler)); } catch(_){} } }
const aktifSohbet = () => B.sohbetler.find(s => s.id === B.aktif) || null;
function yeniSohbet(){ B.aktif = null; ciz(); yanKapat(); $("#soru").focus(); }
function listeCiz(){
  const L = B.sohbetler;
  $("#sohbetListe").innerHTML = L.length ? L.map(s => `<div class="sohbetSatir" data-act="ac" data-id="${s.id}" aria-current="${s.id === B.aktif}"><span>${esc(s.baslik)}</span><small>${tarih(s.ts)}</small><button data-act="sil" data-id="${s.id}" aria-label="Sil" title="Sil">✕</button></div>`).join("") : `<p class="mut" style="font-size:13px;padding:4px 8px">Henüz konuşma yok.</p>`;
}
function hosgeldinHTML(){
  const h = new Date().getHours(), selam = h < 6 ? "İyi geceler" : h < 12 ? "Günaydın" : h < 18 ? "İyi günler" : "İyi akşamlar";
  return `<div class="hosgeldin"><h2>${selam}${B.kim && B.kim !== "Test" ? ", " + esc(B.kim) : ""} 👋</h2><p>Sitenin canlı kayıtlarından arıza, asansör, devriye ve personel durumunu sorabilirsiniz.</p>
    <button class="raporBtn" data-soru="${esc(HAZIR[0][1])}"><span style="font-size:26px">📋</span><span><b>Günlük yönetim raporu</b><small>Bugünün tüm özeti tek ekranda</small></span><span class="ok">→</span></button>
    <div class="cipler">${HAZIR.slice(1).map(([e, s]) => `<button class="cip" data-soru="${esc(s)}">${e} ${esc(s)}</button>`).join("")}</div>
    ${B.rol.tech ? "" : `<p class="mut" style="font-size:12.5px;margin:12px 0 0">Daire (sakin) arızaları yetki gereği sadece teknisyende görünür; cevaplarınızda personel ve asansör bildirimleri yer alır.</p>`}</div>`;
}
function ciz(){
  const s = aktifSohbet();
  const ic = $("#akisIc");
  ic.innerHTML = !s ? hosgeldinHTML() : s.mesajlar.map((m, i) => m.rol === "ben" ? `<div class="msj ben"><div class="balon">${esc(m.metin)}</div></div>`
    : `<div class="msj"><div class="av">BK</div>${m.c ? cevapHTML(m.c, s.id + ":" + i) : `<div class="cevap"><div class="yaz"><i></i><i></i><i></i><span>Kayıtlar inceleniyor…</span></div></div>`}</div>`).join("");
  $("#hizli").innerHTML = s ? HAZIR.map(([e, q]) => `<button class="cip" data-soru="${esc(q)}">${e} ${esc(q.replace(/\?$/, ""))}</button>`).join("") : "";
  listeCiz();
  requestAnimationFrame(() => { const a = $("#akis"), m = ic.querySelectorAll(".msj.ben"); const son = m[m.length - 1];
    if (son) a.scrollTop = Math.max(0, son.offsetTop - 8); else a.scrollTop = 0; });
}
async function sor(soru){
  soru = String(soru || "").trim(); if (!soru || B.mesgul) return;
  B.mesgul = true; $("#gonder").disabled = true;
  let s = aktifSohbet();
  if (!s){ s = {id:"s" + Date.now().toString(36), baslik:soru.slice(0, 60), ts:Date.now(), mesajlar:[]}; B.sohbetler.unshift(s); B.aktif = s.id; }
  s.mesajlar.push({rol:"ben", metin:soru, ts:Date.now()});
  const cev = {rol:"bk", ts:Date.now(), c:null}; s.mesajlar.push(cev); s.ts = Date.now();
  B.sohbetler = [s, ...B.sohbetler.filter(x => x !== s)];
  ciz();
  const bas = Date.now();
  try { cev.c = await cevapla(soru); }
  catch(e){ console.error(e); cev.c = {hata:"Veriler okunamadı. İnternet bağlantısını kontrol edip tekrar deneyin."}; }
  const bekle = 550 - (Date.now() - bas); if (bekle > 0) await new Promise(r => setTimeout(r, bekle));
  sohbetKaydet(); B.mesgul = false; ciz(); girisAyar();
}
function cevapBul(id){ const [sid, i] = String(id).split(":"); const s = B.sohbetler.find(x => x.id === sid); return s && s.mesajlar[+i] && s.mesajlar[+i].c; }
function yanAc(){ $("#yan").classList.add("acik"); $("#perde").hidden = false; }
function yanKapat(){ $("#yan").classList.remove("acik"); $("#perde").hidden = true; }
function girisAyar(){ const t = $("#soru"); t.style.height = "auto"; t.style.height = Math.min(140, t.scrollHeight) + "px"; $("#gonder").disabled = B.mesgul || !t.value.trim(); }

document.addEventListener("click", async e => {
  const q = e.target.closest("[data-soru]"); if (q){ sor(q.dataset.soru); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "sil"){ e.stopPropagation(); if (!confirm("Bu konuşma silinsin mi?")) return; B.sohbetler = B.sohbetler.filter(s => s.id !== b.dataset.id); if (B.aktif === b.dataset.id) B.aktif = null; sohbetKaydet(); ciz(); }
  else if (a === "ac"){ B.aktif = b.dataset.id; ciz(); yanKapat(); }
  else if (a === "yeni") yeniSohbet();
  else if (a === "yanAc") yanAc();
  else if (a === "yanKapat") yanKapat();
  else if (a === "yenile"){ toast("Veriler yenileniyor…"); try { await veriYukle(true); toast("✓ Veriler güncellendi " + saat(B.vTs)); } catch(_){ toast("Yenilenemedi"); } }
  else if (a === "kopyala"){ const c = cevapBul(b.dataset.id); if (!c) return; try { await navigator.clipboard.writeText(duzMetin(c)); toast("Kopyalandı — WhatsApp'a yapıştırabilirsiniz"); } catch(_){ toast("Kopyalanamadı"); } }
  else if (a === "paylas"){ const c = cevapBul(b.dataset.id); if (!c) return; try { await navigator.share({title:"BİZKONTROL", text:duzMetin(c)}); } catch(_){} }
  else if (a === "yazdir") print();
});
$("#soru").addEventListener("input", girisAyar);
$("#soru").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); $("#soruForm").requestSubmit(); } });
$("#soruForm").addEventListener("submit", e => { e.preventDefault(); const t = $("#soru"); const v = t.value; t.value = ""; girisAyar(); sor(v); });
$("#temaBtn").onclick = () => { const r = document.documentElement; const koyu = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = koyu ? "light" : "dark"; try { localStorage.setItem("bk-tema", r.dataset.theme); } catch(_){} };
try { const tm = localStorage.getItem("bk-tema"); if (tm) document.documentElement.dataset.theme = tm; } catch(_){}
if (/teknik\.html|devriye\.html|personel\.html/.test(document.referrer)) $("#geri").href = document.referrer.replace(/#.*$/, "") + "#panel";

function basla(){
  $("#giris").hidden = true; $("#app").hidden = false;
  sohbetYukle(); ciz(); veriYukle().catch(() => {});
}

/* ======================= 5) BAĞLANTI ======================= */
async function canli(){
  const cfg = window.FB_CONFIG, V = "10.12.2", U = `https://www.gstatic.com/firebasejs/${V}/`;
  const [app, fs, au] = await Promise.all([import(U + "firebase-app.js"), import(U + "firebase-firestore.js"), import(U + "firebase-auth.js")]);
  const ap = app.initializeApp(cfg), db = fs.getFirestore(ap), auth = au.getAuth(ap);
  const al = async q => (await fs.getDocs(q)).docs.map(d => ({id:d.id, ...d.data()}));
  const C = n => fs.collection(db, n);
  DB = {   // salt okunur: sadece getDocs / getDoc
    arizalar: (a, tech) => tech ? al(fs.query(C("appointments"), fs.where("createdAt", ">=", a)))
                                : al(fs.query(C("appointments"), fs.where("src", "==", "personel"))).then(L => L.filter(x => (x.createdAt || 0) >= a)),
    tesis: a => al(fs.query(C("tesis"), fs.where("ts", ">=", a))),
    devriye: a => al(fs.query(C("devriye"), fs.where("ts", ">=", a))),
    mesai: a => al(fs.query(C("mesai"), fs.where("ts", ">=", a))),
    gorev: a => al(fs.query(C("gorev"), fs.where("ts", ">=", a))),
    izinler: async () => { const s = await fs.getDoc(fs.doc(db, "duyuru", "izinler")); return s.exists() ? (s.data().liste || []) : []; }
  };
  $("#girisForm").onsubmit = async e => { e.preventDefault(); $("#gHata").textContent = "";
    try { await au.signInWithEmailAndPassword(auth, $("#gEmail").value.trim(), $("#gSifre").value); } catch(_){ $("#gHata").textContent = "E-posta veya şifre hatalı."; } };
  let bas = false;
  au.onAuthStateChanged(auth, async u => {
    if (!u || u.isAnonymous){ $("#app").hidden = true; $("#giris").hidden = false; return; }
    const em = (u.email || "").toLowerCase();
    B.rol.tech = (window.FB_TEKNISYEN || []).map(x => x.toLowerCase()).includes(em);
    let adlar = {};
    try { const r = await fs.getDoc(fs.doc(db, "ayar", "roller")); const R = r.exists() ? r.data() : {}; const l = x => (x || []).map(s => String(s).toLowerCase().trim());
      B.rol.tesis = l(R.tesis).includes(em); B.rol.yon = l(R.yonetim).includes(em); adlar = R.adlar || {}; } catch(e){ console.warn(e); }
    if (!B.rol.tech && !B.rol.tesis && !B.rol.yon){ $("#app").hidden = true; $("#giris").hidden = false; $("#gHata").textContent = "Bu hesabın BİZKONTROL yetkisi yok."; return; }
    B.email = em; B.kim = adlar[em] || (B.rol.tech ? "Zeynel" : "");
    $("#kimAd").textContent = B.rol.tech ? "Teknisyen" : B.rol.tesis ? "Müdür" : "Amir";
    if (bas) return; bas = true; basla();
  });
}
