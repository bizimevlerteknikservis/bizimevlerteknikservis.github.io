      if (navigator.share){ try { await navigator.share({text: metin}); } catch(e){} } else location.href = "https://wa.me/?text=" + encodeURIComponent(metin);
      return;
    }
    else if (act==="duyKaldir"){
      const v = {...(DUY.v||{}), aktif:false, kaldiran: (S.d.kim && S.d.kim.ad) || (store.kim ? store.kim() : "Amir"), kalkis: Date.now()};
      try { await store.setDuyuru(v); DUY.v = v; toast("Devriye yeniden başladı"); tgGonder(`✅ Devriye yeniden başladı · ${v.kaldiran} · ${tarihSaat(v.kalkis)}`); }
      catch(e){ toast("Kaydedilemedi: " + (e.code||"")); }
      render(); return;
    }
    else if (act==="gtAc"){ S.gt = {tur:"", kayit:"kayitsiz"}; render(); return; }
    else if (act==="gtKapat"){ S.gt = null; render(); return; }
    else if (act==="gtTur"){ syncForm(); S.gt.tur = b.dataset.v; S.gt.hata = ""; render(); return; }
    else if (act==="gtKayit"){ syncForm(); S.gt.kayit = b.dataset.v; render(); return; }
    else if (act==="gtGonder"){ syncForm(); const f = S.gt, k = S.d.kim;
      if (!f.tur){ f.hata = "Türü seçin"; render(); return; }
      if (!f.blok){ f.hata = "Bloğu seçin"; render(); return; }
      if (!k || !k.kod){ f.hata = "Önce güvenlik kodunuzu girin"; render(); return; }
      const turAd = {giris:"Taşınma (giriş)", cikis:"Taşınma (çıkış)", tadilat:"Tadilat"}[f.tur];
      const desc = [f.kayit==="kayitsiz" ? "⚠️ LİSTEDE YOK" : "Listede var, geldi", turAd, f.plaka ? "Plaka: " + f.plaka.trim().toLocaleUpperCase("tr") : "", f.firma ? "Firma: " + f.firma.trim() : "", (f.not||"").trim()].filter(Boolean).join(" · ").slice(0, 480);
      S.sending = true; render();
      try { const a = await store.create({src:"personel", kod:k.kod, rol:"Güvenlik", cat:"p_tasinma", issues:[turAd], desc, name:k.ad, phone:"", block:f.blok, kat: f.daire ? "Daire " + String(f.daire).trim() : "", alan:"", flat: String(f.daire||"").trim().slice(0,6), fotoSayi:0});
        telegramBildir(a); S.gt = {ok:true}; toast("Bildirildi"); }
      catch(e){ console.error(e); f.hata = (e && e.code === "permission-denied") ? "Gönderilemedi: kodunuz geçersiz ya da pasif." : "Gönderilemedi, internet bağlantınızı kontrol edin."; }
      S.sending = false; render(); return; }
    else if (act==="gelAc"){ S.gel = {ac:true, sebep:"", not:""}; render(); return; }
    else if (act==="gelKapat"){ S.gel = null; render(); return; }
    else if (act==="gelSebep"){ syncForm(); S.gel.sebep = b.dataset.v; S.gel.hata = ""; render(); return; }
    else if (act==="gelGonder"){ syncForm(); const g = S.gel, p = S.p;
      if (!g.sebep){ g.hata = "Sebebi seçin"; render(); return; }
      if (!p.name){ g.hata = "Önce kodunuzu girin"; render(); return; }
      S.sending = true; render();
      try { const a = await store.create({src:"personel", kod:p.kod, rol:p.rol, cat:"p_gelemiyorum", issues:[g.sebep], desc:[g.sebep, (g.not||"").trim()].filter(Boolean).join(" — "), name:p.name.trim(), phone:"", block:"", kat:"", alan:"İşe gelemiyor", flat:"", fotoSayi:0});
        telegramBildir(a); S.gel = {gonderildi:true}; toast("Bildirildi"); }
      catch(e){ console.error(e); g.hata = (e && e.code === "permission-denied") ? "Gönderilemedi: kodunuz geçersiz ya da pasif." : "Gönderilemedi, internet bağlantınızı kontrol edin."; }
      S.sending = false; render(); return; }
    else if (act==="yiEkle"){ syncForm(); const f = YI.f;
      if (!f.ad){ toast("Kişiyi seçin"); return; } if (!f.bas){ toast("Başlangıç tarihini seçin"); return; }
      const bit = f.bit && f.bit >= f.bas ? f.bit : f.bas;
      const [gk, ...adP] = String(f.ad).split("|"); const ad = adP.join("|") || f.ad;
      const e = {id: "i" + Date.now().toString(36), ad, grup: gk === "g" ? "guvenlik" : "temizlik", tur: f.tur, bas: f.bas, bit, not: (f.not||"").trim(), by: store.kim ? store.kim() : "Teknisyen", ts: Date.now()};
      const L = [...izinListe().filter(x => (x.bit||x.bas) >= ymdS(new Date(Date.now()-120*GUN_MS))), e];
      try { await store.setIzinler({liste: L, ts: Date.now()}); YI.v = {liste: L}; YI.f = null; toast("İzin kaydedildi"); } catch(err){ console.error(err); toast("Kaydedilemedi: " + (err.code||"")); }
      render(); return; }
    else if (act==="yiSil"){
      if (b.dataset.onay !== "1"){ b.dataset.onay = "1"; b.textContent = "Sil?"; return; }
      const L = izinListe().filter(x => x.id !== b.dataset.id);
      try { await store.setIzinler({liste: L, ts: Date.now()}); YI.v = {liste: L}; toast("Silindi"); } catch(err){ toast("Silinemedi"); }
      render(); return; }
    else if (act==="clEkle"){ clSync(); CL.f[b.dataset.v].push(["",""]); CL.acik = null; CL.gen++; render(); return; }
    else if (act==="clBlokAc"){ clSync(); const k = b.dataset.v + b.dataset.id; CL.acik = CL.acik === k ? null : k; render(); return; }
    else if (act==="clBlok"){ clSync(); const r = CL.f[b.dataset.v][+b.dataset.id]; const L = String(r[1]||"").split(/[-,\s]+/).filter(Boolean); const x = b.dataset.b; const i2 = L.indexOf(x); if (i2 < 0) L.push(x); else L.splice(i2,1);
      r[1] = AYAR.bloklar.filter(y => L.includes(y)).concat(L.filter(y => !AYAR.bloklar.includes(y))).join("-"); render(); return; }
    else if (act==="clSil"){ clSync(); CL.acik = null; CL.f[b.dataset.v].splice(+b.dataset.id, 1); CL.gen++; render(); return; }
    else if (act==="clTasi"){ clSync(); CL.acik = null; const g = b.dataset.v, o = g==="cmt" ? "paz" : "cmt"; const [r] = CL.f[g].splice(+b.dataset.id, 1); CL.f[o].push(r); CL.gen++; render(); return; }
    else if (act==="clAktar"){ clSync(); const pl = izinPlan({gunler: izinCoz(CL.f.yapistir)});
      if (!pl){ toast("Tablo okunamadı: ilk satırda Cumartesi ya da Pazar tarihi olmalı"); return; }
      CL.f.cmt = pl.cmt.map(x=>x.slice()); CL.f.paz = pl.paz.map(x=>x.slice()); toast("Listeye aktarıldı, kontrol edip yayınlayın"); CL.gen++; render(); return; }
    else if (act==="clKaydet"){ clSync(); const f = CL.f;
      const temiz = L => L.map(([a,b]) => [String(a||"").trim(), String(b||"").trim()]).filter(([a]) => a && a !== "__diger");
      const v = {tip:"donusumlu", baz: cmtBul(new Date()).getTime(), hafta: cmtBul(new Date()).getTime(), cmt: temiz(f.cmt), paz: temiz(f.paz), not: (f.not||"").trim(), ts: Date.now(), by: store.kim ? store.kim() : "Teknisyen"};
      if (!v.cmt.length && !v.paz.length){ toast("Listede kimse yok"); return; }
      try { await store.setIzin(v); IZN.v = v; toast("Liste yayınlandı"); } catch(e){ console.error(e); toast("Yayınlanamadı: " + (e.code||"")); }
      render(); return; }
    else if (act==="kodPaylas"){
      const k = KOD.liste.find(x=>x.id===id); if (!k) return;
      const metin = kodMesaj(k);
      // Telefonun paylaş menüsü: WhatsApp / WhatsApp Business / SMS hangisi istenirse
      if (navigator.share){ try { await navigator.share({text: metin}); } catch(e){} }
      else { try { await navigator.clipboard.writeText(metin); toast("Mesaj kopyalandı, istediğiniz yere yapıştırın"); } catch(e){ location.href = "https://wa.me/?text=" + encodeURIComponent(metin); } }
      return;
    }
    else if (act==="kodAktif"){
      if (v==="0" && b.dataset.onay !== "1"){ b.dataset.onay = "1"; b.textContent = "Emin misiniz?"; return; }
      await store.updateKod(id, v==="1" ? {aktif:true} : {aktif:false, pasifTs:Date.now()}); toast(v==="1" ? "Aktif yapıldı" : "Kod kapatıldı · uygulaması ve bildirimleri durdu");
    }
    else if (act==="kodGuvToplu"){
      if (b.dataset.onay !== "1"){ b.dataset.onay = "1"; b.textContent = "Emin misiniz? Tekrar basın"; return; }
      if (KOD.toplu) return; KOD.toplu = true; b.disabled = true; b.textContent = "Oluşturuluyor…";
      let n = 0;
      const var_ = ad => KOD.liste.some(k=>k.tip==="guvenlik" && k.aktif!==false && k.ad===ad);
      try { for (const v3 of VARDIYA) for (const [ad] of v3.kisiler){ if (var_(ad)) continue; const id = await yeniKod(); await store.setKod(id, {ad, tip:"guvenlik", vardiya:v3.ad, aktif:true, ts:Date.now()}); KOD.liste.push({id, ad, tip:"guvenlik", vardiya:v3.ad, aktif:true}); n++; } } finally { KOD.toplu = false; }
      S.kodAcik = true; toast(`${n} güvenlik kodu oluşturuldu`); render();
    }
    else if (act==="kodTekrarSil"){
      if (b.dataset.onay !== "1"){ b.dataset.onay = "1"; b.textContent = "Emin misiniz? Tekrar basın"; return; }
      const sil = kodTekrarlar(); b.disabled = true;
      for (const k of sil){ await store.deleteKod(k.id); }
      KOD.liste = KOD.liste.filter(k=>!sil.includes(k)); toast(`${sil.length} tekrar eden kod silindi`); render();
    }
    else if (act==="pFotoSil"){ syncForm(); S.p.foto.splice(+v, 1); render(); }
    else if (act==="foto"){ fotoGoster(id); }
    else if (act==="pGonder"){
      syncForm(); const p = S.p;
      if (!personelHazir()) return;
      S.sending = true; render();
      yerel("site-servis-personel", {rol:p.rol, name:p.name.trim()});
      try {
        const ar = p.issues.filter(x => x !== "Diğer");
        const aciklama = [ar.join(", "), p.desc.trim()].filter(Boolean).join(" — ");
        const blokIci = p.yerTip==="blok";
        const fotolar = p.foto.slice();
        S.pSent = await store.create({src:"personel", kod:p.kod, rol:p.rol, cat:p.cat, issues:p.issues.slice(), desc:aciklama, name:p.name.trim(), phone:"",
          block: blokIci ? p.block : "", kat: blokIci ? p.kat : "", alan: blokIci ? "" : p.alan, flat:"", fotoSayi: fotolar.length, ...(p.cat==="p_asansor" && blokIci && p.asNo ? {asNo:p.asNo} : {})});
        telegramBildir(S.pSent); SES.sonuc = null; SES.metin = "";
        for (let i = 0; i < fotolar.length; i++){
          try { await store.addFoto(S.pSent.id, i, fotolar[i], p.kod); } catch(e){ console.error(e); toast("Fotoğraf gönderilemedi"); }
          telegramFoto(fotolar[i], `📷 ${fisNo(S.pSent)} · ${catOf(S.pSent.cat).ad} · ${yerAd(S.pSent)}`);
        }
        p.foto = [];
        p.kayitli = true; p.kimlikAc = false;
        scrollTo(0,0);
      } catch(err){ console.error(err); S.err = (err && err.code === "permission-denied") ? "Gönderilemedi: personel kodunuz geçersiz ya da pasif. Teknisyene başvurun." : "Gönderilemedi. İnternet bağlantınızı kontrol edip tekrar deneyin."; if (err && err.code === "permission-denied") kodYokla(); }
      S.sending = false; render();
    }
    else if (act==="cat"){ syncForm(); if (S.form.cat !== v) S.form.issues = []; S.form.cat = v; render(); }
    else if (act==="iss"){ syncForm(); const L = S.form.issues; const i = L.indexOf(v); i < 0 ? L.push(v) : L.splice(i,1); render(); }
    else if (act==="yeni"){ S.sent = null; S.form.cat = null; S.form.issues = []; S.form.desc = ""; render(); scrollTo(0,0); }
    else if (act==="gonder"){
      syncForm(); const f = S.form;
      if (!formHazir()) return;
      S.sending = true; render();
      yerel("site-servis-iletisim", {name:f.name, block:f.block, flat:f.flat, phone:f.phone});
      try {
        const arizalar = f.issues.filter(x => x !== "Diğer");
        const aciklama = [arizalar.join(", "), f.desc.trim()].filter(Boolean).join(" — ");
        S.sent = await store.create({cat:f.cat, issues:f.issues.slice(), desc:aciklama, name:f.name.trim(), block:f.block, flat:f.flat.trim(), phone:f.phone.trim()});
        telegramBildir(S.sent);
        scrollTo(0,0);
      } catch(err){
        console.error(err);
        S.err = "Gönderilemedi. İnternet bağlantınızı kontrol edip tekrar deneyin.";
      }
      S.sending = false; render();
    }
    else if (act==="iptalBenim"){
      if (S.armed !== id){ S.armed = id; render(); return; }
      S.armed = null; await store.cancelMine(find(S.mine)); toast("Bildirim iptal edildi"); render();
    }
    else if (act==="giris"){
      const pin = $("#pin"), em = $("#email"), pw = $("#pass");
      try { await store.login(em?em.value.trim():"", pin?pin.value:pw.value); S.err = ""; startPanel(); toast("Giriş yapıldı"); }
      catch(err){ S.err = err.code==="yonetim" ? "YONETIM" : err.code==="yetki" ? "Bu hesap teknisyen olarak tanımlı değil." : store.mode==="demo" ? "PIN hatalı." : "E-posta veya şifre hatalı."; render(); }
    }
    else if (act==="cikis"){ if (unAll) unAll(); unAll = null; S.all = []; tesisDurdur(); await store.logout(); render(); }
    else if (act==="rolKaydet"){
      const temiz = id => $(id).value.split(/[\s,;]+/).map(x=>x.trim().toLowerCase()).filter(x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
      const L = temiz("#rolListe"), TL = temiz("#rolTesis");
      try { await store.setRoller({yonetim: L, tesis: TL}); S.roller = L; S.rolTesis = TL; $("#rolListe").value = L.join("\n"); $("#rolTesis").value = TL.join("\n"); toast(`${L.length} yönetim · ${TL.length} tesis hesabı kaydedildi`); render(); } catch(err){ console.error(err); toast("Kaydedilemedi: Firebase kurallarını kontrol edin"); }
    }
    else if (act==="filtre"){ syncForm(); S.filter = v; render(); }
    else if (act==="durum"){ syncForm(); const a = find(S.all); const patch = {status: v}; if (v==="tamamlandi") patch.completedAt = Date.now(); if (S.notes[id] !== undefined && String(S.notes[id]).trim() !== String(a.note||"").trim()) patch.note = S.notes[id];
      if (a.src === "personel" && v !== "iptal"){ patch.guncelTs = Date.now(); if (patch.note !== undefined) patch.karan = "Teknisyen"; } await store.update(a, patch); if (patch.guncelTs) bildirimTetik("arizaGuncel", a.id); toast(DURUM[v] + " olarak işaretlendi"); }
    else if (act==="not"){ syncForm(); const a = find(S.all); const yeniNot = String(S.notes[id] ?? "").trim(); const patch = {note: yeniNot};
      const bildir = a.src === "personel" && yeniNot && yeniNot !== String(a.note||"").trim(); if (bildir){ patch.guncelTs = Date.now(); patch.karan = "Teknisyen"; }
      await store.update(a, patch); if (bildir) bildirimTetik("arizaGuncel", a.id); toast(bildir ? "Not kaydedildi · bildirene bildirim gitti" : "Not kaydedildi"); }
    else if (act==="iptal"){
      syncForm();
      if (S.armed !== id){ S.armed = id; render(); return; }
      S.armed = null; const patch = {status: "iptal"}; if (S.notes[id] !== undefined) patch.note = S.notes[id];
      await store.update(find(S.all), patch); toast("Bildirim iptal edildi");
    }
  } catch(err){ console.error(err); toast("İşlem yapılamadı, tekrar deneyin"); }
});

function startPanel(){
  if (unAll) unAll();
  kodBaslat();
  if (store.isTech() && store.getRoller) store.getRoller().then(r => { S.roller = r.yonetim || []; S.rolTesis = r.tesis || []; if (S.view==="panel") render(); }).catch(()=>{});
  unAll = store.isTech() ? store.listenAll(list => { S.all = list; if (S.view==="panel") render(); }) : null;
  render();
}

/* Kontrol Merkezi'ni aynı uygulamanın içinde aç (ayrı uygulama kurmaya gerek kalmasın) */
function kontrolCerceve(ac){
  let k = document.getElementById("kontrolCerceve");
  if (!ac){ if (k) k.hidden = true; return; }
  if (!k){
    k = document.createElement("div"); k.id = "kontrolCerceve";
    k.innerHTML = `<a href="#panel" class="kc-geri">← Geri · uygulamaya dön</a><iframe src="kontrol.html" title="Canlı Kontrol Merkezi"></iframe>`;
    document.body.appendChild(k);
  }
  k.hidden = false;
}
function route(){
  const h = location.hash.slice(1);
  kontrolCerceve(h === "kontrol");
  if (h === "kontrol"){ if (S.view !== "panel"){ S.view = "panel"; render(); } return; }
  if (/^d-\d/.test(h)){
    history.replaceState(null, "", location.pathname + "#devriye");
    const n = qrCoz(h);
    S.view = "devriye"; S.err = ""; render();
    if (n) noktaOkut(n); else toast("QR kodu tanınmadı");
    return;
  }
  S.view = ["randevu","randevularim","panel","personel","devriye","tesis","tasinma","calisma","izinler","gtasinma","gorev","ik"].includes(h) ? h : "randevu";
  // B1 Teknik uygulamasında sakin arıza formu yok (amirler görmesin); teknisyen #randevu ile yine açabilir
  if (appDosya()==="teknik.html" && (S.view==="randevu"||S.view==="randevularim") && !store.isTech()){ S.view = "panel"; history.replaceState(null, "", location.pathname + "#panel"); }
  if (S.view !== "tesis"){ T.f = null; T.detay = null; }
  // Mesai QR'ı telefonun kendi kamerasıyla okutulduysa (…personel.html?mesai=…)
  const mzl = mesaiCoz(location.search);
  if (mzl){ history.replaceState(null, "", location.pathname + location.hash); setTimeout(() => mesaiLinkUyari(), 600); }
  // Linkte kod varsa (…devriye.html?kod=123456) otomatik gir, sonra adres çubuğundan sil
  const lk = new URLSearchParams(location.search).get("kod");
  if (lk && (S.view === "personel" || S.view === "devriye") && store.kodOku){
    history.replaceState(null, "", location.pathname + location.hash);
    linkKodu(lk.replace(/\D/g,""));
  }
  else if ((S.view === "personel" || S.view === "devriye") && store.kodOku && Date.now() - (S.kodYoklandi||0) > 60000){ S.kodYoklandi = Date.now(); kodYokla(); }
  S.err = ""; S.armed = null;
  render();
}
window.addEventListener("hashchange", route);
window.addEventListener("online", () => { tgKuyrukGonder(); if (S.view==="devriye") render(); });
window.addEventListener("offline", () => { if (S.view==="devriye") render(); });
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{});

$("#view").innerHTML = `<div class="empty"><strong>Yükleniyor…</strong></div>`;
store.ready.then(() => {
  unMine = store.listenMine(list => { S.mine = list; if (S.view==="randevularim" || S.view==="personel") render(); });
  if (store.isTech()) startPanel();
  route();
  kuyrukGonder(); tgKuyrukGonder(); setInterval(()=>{ kuyrukGonder(); tgKuyrukGonder(); }, 30000); window.addEventListener("online", kuyrukGonder);
}).catch(err => {
  console.error(err);
  $("#view").innerHTML = `<div class="empty"><strong>Bağlantı kurulamadı</strong>Sayfayı yenileyin. Sorun sürerse teknisyene haber verin.</div>`;
});
</script>
