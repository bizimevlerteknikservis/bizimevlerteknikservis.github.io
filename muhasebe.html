:root{

.ibtn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;color:var(--ink)}

.bos{text-align:center;padding:30px 16px;color:var(--muted)}
.bos b{display:block;font-size:18px;color:var(--ink);margin-bottom:6px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,12,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.mic{background:var(--panel);border-radius:22px;width:min(760px,100%);padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.4)}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:90vw}

<script type="module">
/* =====================================================================
   Bizimevler · Muhasebe (gerçek veri)
   Veri: Firestore  muhasebe/ayar (doc)
                    muhasebe/veri/daireler/{blok-no}  { blok,no,ad,tel,m2,aidat,kiraci,not, har:[hareket] }
                    muhasebe/veri/giderler/{id}       { t,kat,aciklama,tutar,belge,bag:[],iptal }
   Hareket tipleri: devir (açılış bakiyesi, + borç / − alacak), tah (aidat), ode (ödeme), duz (ek borç + / indirim −)
   Kayıtlar silinmez; yanlış kayıt "iptal" işaretlenir (kim, ne zaman, neden).
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tl = n => (Math.round(n||0)).toLocaleString("tr-TR") + " ₺";
const tl2 = n => (n||0).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2}) + " ₺";
const AY = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const GUN = 864e5;
const pad = n => String(n).padStart(2,"0");
const tarih = t => { const d = new Date(t); return `${d.getDate()} ${AY[d.getMonth()].slice(0,3)} ${d.getFullYear()}`; };
const kTarih = t => { const d = new Date(t); return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${String(d.getFullYear()).slice(2)}`; };
const isoGun = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const gunTs = s => { const [y,m,g] = String(s).split("-").map(Number); return new Date(y, m-1, g, 12).getTime(); };
const ayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const ayAd = k => { const [y,m] = k.split("-").map(Number); return `${AY[m-1]} ${y}`; };
const yeniId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const sayi = v => { if (typeof v === "number") return v; let s = String(v||"").replace(/[^\d,.\-]/g,""); if (!s) return NaN;
  if (s.includes(",") && s.includes(".")) s = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,"");
  else if (s.includes(",")) s = s.replace(",","."); else if ((s.match(/\./g)||[]).length > 1 || /\.\d{3}$/.test(s)) s = s.replace(/\./g,"");
  return parseFloat(s); };
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(()=>t.classList.remove("on"), 2800); }
const NOW = () => Date.now();

const GKAT = {
  personel:{ad:"Personel maaşları", renk:"#2b7cd3", k:/MAAS|MAAŞ|SGK|UCRET|ÜCRET|PERSONEL/}, elektrik:{ad:"Ortak alan elektrik", renk:"#f0a43a", k:/ELEKTR|ENERJISA|ENERJİSA|CK BO|AYEDAS|AYEDAŞ|BEDAŞ|BEDAS/},
  su:{ad:"Su", renk:"#3fb6c9", k:/İSKİ|ISKI|\bSU\b/}, dogalgaz:{ad:"Doğalgaz", renk:"#5c7cfa", k:/IGDAS|İGDAŞ|DOGALGAZ|DOĞALGAZ/},
  asansor:{ad:"Asansör bakım ve arıza", renk:"#7b61ff", k:/ASANS|OMAK/}, jenerator:{ad:"Jeneratör yakıt ve bakım", renk:"#e0645c", k:/MAZOT|AKARYAKIT|OPET|SHELL|PETROL|JENERAT/},
  hidrofor:{ad:"Hidrofor ve tesisat", renk:"#2fa77a", k:/HIDROFOR|HİDROFOR|POMPA|TESISAT|TESİSAT/}, bahce:{ad:"Bahçe ve peyzaj", renk:"#7cb342", k:/PEYZAJ|BAHCE|BAHÇE|FIDAN|FİDAN/},
  temizlik:{ad:"Temizlik malzemesi", renk:"#a07cc5", k:/TEMIZLIK|TEMİZLİK|DETERJAN/}, yangin:{ad:"Yangın güvenliği", renk:"#d63a35", k:/YANGIN|TUP|TÜP/},
  sigorta:{ad:"Sigorta", renk:"#8a9bb0", k:/SIGORTA|SİGORTA|POLIÇE|POLİÇE/}, banka:{ad:"Banka masrafı", renk:"#9aa5b1", k:/MASRAF|KOMISYON|KOMİSYON|ISLETIM|İŞLETİM|EFT UCRET/},
  onarim:{ad:"Bakım onarım (diğer)", renk:"#c28a3a", k:/ONARIM|TAMIR|TAMİR|BOYA|MALZEME/}, diger:{ad:"Diğer", renk:"#b0b8c4", k:null}
};
const katBul = acik => { const a = String(acik).toLocaleUpperCase("tr"); for (const [k,v] of Object.entries(GKAT)) if (v.k && v.k.test(a)) return k; return "diger"; };

/* ================= durum ================= */
const ST = { ayar:{siteAd:"Bizimevler 1 Sitesi", iban:"", banka:"", vadeGun:10, gecikme:5, devir:0, devirT:null, butce:{}}, daire:[], gider:[], yuklendi:{d:false,g:false,a:false}, kim:"" };
let DB = null;   // veri katmanı (Firestore ya da test için bellek)

/* ================= bakiye hesabı ================= */
/* Ödemeler en eski borca düşülür. Gecikme tazminatı (KMK md.20): vadesinden sonra ödenmeyen tutara aylık oran, gün hesabıyla. */
function hesap(d, simdi = NOW()){
  const H = (d.har||[]).filter(h=>!h.iptal);
  const borc = [], ode = [];
  H.forEach(h=>{
    if (h.tip==="tah") borc.push({...h, vade:h.vade||h.t});
    else if ((h.tip==="devir" || h.tip==="duz") && h.tutar > 0) borc.push({...h, vade:h.vade||h.t});
    else if ((h.tip==="devir" || h.tip==="duz") && h.tutar < 0) ode.push({...h, tutar:-h.tutar});
    else if (h.tip==="ode") ode.push(h);
  });
  borc.sort((a,b)=>a.vade-b.vade); ode.sort((a,b)=>a.t-b.t);
  const B = borc.map(b=>({...b, kalan:b.tutar, gec:0}));
  const oran = (ST.ayar.gecikme||0)/100;
  let fazla = 0;
  ode.forEach(o=>{ let p = o.tutar;
    for (const b of B){ if (p <= 0.001) break; if (b.kalan <= 0.001) continue;
      const x = Math.min(p, b.kalan);
      if (b.tip==="tah" && o.t > b.vade) b.gec += x * oran * ((o.t - b.vade)/GUN/30);
      b.kalan -= x; p -= x; }
    fazla += Math.max(0,p); });
  B.forEach(b=>{ if (b.tip==="tah" && b.kalan > 0.001 && simdi > b.vade) b.gec += b.kalan * oran * ((simdi - b.vade)/GUN/30); b.gec = Math.round(b.gec); });
  const anapara = B.reduce((s,b)=>s+Math.max(0,b.kalan),0) - fazla;
  const gec = B.reduce((s,b)=>s+b.gec,0);
  const gecikmis = B.filter(b=>b.kalan>0.001 && simdi > b.vade);
  const gecTah = gecikmis.filter(b=>b.tip==="tah").length;
  return {B, anapara, gec, toplam: anapara + gec, gecikmisAy: gecTah, gecikmisVar: gecikmis.length>0, fazla};
}
const durumEt = h => h.toplam <= 0.5 ? (h.toplam < -0.5 ? ["Alacaklı","p-acc"] : ["Borcu yok","p-ok"]) : !h.gecikmisVar ? ["Vadesi gelmedi","p-acc"] : h.gecikmisAy <= 1 ? ["Gecikmede","p-warn"] : [`${h.gecikmisAy} ay gecikme`,"p-bad"];
const daireAd = d => `${d.blok} / ${d.no}`;
const sirala = (a,b) => a.blok.localeCompare(b.blok,"tr",{numeric:true}) || String(a.no).localeCompare(String(b.no),"tr",{numeric:true});

function ozet(){
  const H = ST.daire.map(d=>({d, h:hesap(d)}));
  const buAy = ayKey(NOW());
  let ayTah = 0, ayOde = 0;
  H.forEach(({d,h})=>h.B.filter(b=>b.tip==="tah" && b.ay===buAy).forEach(b=>{ ayTah += b.tutar; ayOde += b.tutar - Math.max(0,b.kalan); }));
  const bas = ST.ayar.devirT || 0;
  const tahsilat = ST.daire.reduce((s,d)=>s+(d.har||[]).filter(h=>!h.iptal && h.tip==="ode" && h.t>=bas).reduce((x,h)=>x+h.tutar,0),0);
  const gider = ST.gider.filter(g=>!g.iptal && g.t>=bas).reduce((s,g)=>s+g.tutar,0);
  const alacak = H.reduce((s,{h})=>s+Math.max(0,h.toplam),0);
  return {H, buAy, ayTah, ayOde, oran: ayTah ? ayOde/ayTah : null, tahsilat, gider, kasa:(ST.ayar.devir||0) + tahsilat - gider, alacak, borclu:H.filter(({h})=>h.gecikmisVar && h.toplam>0.5)};
}
function aylikGelirGider(n=6){
  const out = []; const d0 = new Date(); d0.setDate(1); d0.setHours(0,0,0,0);
  for (let i=n-1;i>=0;i--){ const a = new Date(d0.getFullYear(), d0.getMonth()-i, 1).getTime(), b = new Date(d0.getFullYear(), d0.getMonth()-i+1, 1).getTime();
    const gelir = ST.daire.reduce((s,d)=>s+(d.har||[]).filter(h=>!h.iptal && h.tip==="ode" && h.t>=a && h.t<b).reduce((x,h)=>x+h.tutar,0),0);
    const gider = ST.gider.filter(g=>!g.iptal && g.t>=a && g.t<b).reduce((s,g)=>s+g.tutar,0);
    out.push({a, kisa:AY[new Date(a).getMonth()].slice(0,3), ad:`${AY[new Date(a).getMonth()]} ${new Date(a).getFullYear()}`, gelir, gider}); }
  return out;
}

    <div class="card kpi"><span>Gecikme tazminatı</span><b class="warn">${tl(gecT)}</b><em class="p-warn">${ST.ayar.gecikme?`aylık %${ST.ayar.gecikme} · KMK md.20`:"Kapalı"}</em></div>

let MODAL_YENILE = null;

function kapat(){ $("#modal").hidden = true; MODAL_YENILE = null; }

const HTIP = {devir:"Devir", tah:"Aidat", ode:"Ödeme", duz:"Düzeltme"};
function daireModal(id){
  const d = ST.daire.find(x=>x.id===id); if (!d){ kapat(); return; }
  const h = hesap(d);
  const hareket = [...(d.har||[])].sort((a,b)=>(a.t-b.t) || (a.ts-b.ts));
  const gecMap = {}; h.B.forEach(b=>{ if (b.id) gecMap[b.id] = b.gec; });
  let bak = 0;
  const satir = hareket.map(x=>{
    const borc = !x.iptal && ((x.tip==="tah") || ((x.tip==="devir"||x.tip==="duz") && x.tutar>0)) ? x.tutar : 0;
    const alacak = !x.iptal && (x.tip==="ode" ? x.tutar : ((x.tip==="devir"||x.tip==="duz") && x.tutar<0) ? -x.tutar : 0);
    bak += borc - alacak;
    return `<tr class="${x.iptal?"iptal":""}"><td>${kTarih(x.t)}</td><td><span class="pill p-mut">${HTIP[x.tip]||x.tip}</span> ${esc(x.acik||"")}${x.kanal?` <span class="mut" style="font-size:12px">· ${esc(x.kanal)}</span>`:""}
      ${gecMap[x.id]?`<div style="font-size:12px;color:var(--warn)">+ ${tl(gecMap[x.id])} gecikme tazminatı</div>`:""}
      ${x.iptal?`<div style="font-size:12px;color:var(--bad);text-decoration:none">İptal: ${esc(x.iptalNot||"")} · ${kTarih(x.iptalTs)}</div>`:""}</td>
      <td class="num">${x.tip!=="ode"&&!(x.tutar<0)?tl(Math.abs(x.tutar)):""}</td><td class="num ok">${x.tip==="ode"||x.tutar<0?tl(Math.abs(x.tutar)):""}</td><td class="num">${x.iptal?"":tl(bak)}</td>
      <td style="white-space:nowrap">${!x.iptal&&x.tip==="ode"?`<a href="#" data-makbuz="${d.id}|${x.id}" style="color:var(--accent);font-size:12.5px;font-weight:700">Makbuz</a> `:""}${!x.iptal?`<a href="#" data-iptal="${d.id}|${x.id}" style="color:var(--bad);font-size:12.5px;font-weight:700">İptal</a>`:""}</td></tr>`; }).join("");
  modal(`<div class="bas"><h3>${esc(d.blok)} Blok · Daire ${esc(d.no)}</h3><button class="ibtn" data-act="kapat">✕</button></div>
    <p style="margin:0 0 12px;color:var(--muted)">${esc(d.ad||"İsim girilmedi")}${d.kiraci?" · kiracı oturuyor":""}${d.tel?` · ${esc(d.tel)}`:""} · aylık ${d.aidat?tl(d.aidat):"—"} <a href="#" data-duzenle="${d.id}" style="color:var(--accent);font-weight:700">Düzenle</a></p>
    <div class="grid g2" style="margin-bottom:12px">
      <div class="card kpi" style="box-shadow:none"><span>Güncel bakiye</span><b class="${h.toplam>0.5?"bad":"ok"}">${tl(h.toplam)}</b><em class="${durumEt(h)[1]}">${durumEt(h)[0]}</em></div>
      <div class="card kpi" style="box-shadow:none"><span>İçindeki gecikme tazminatı</span><b class="warn">${tl(h.gec)}</b><em class="p-warn">${ST.ayar.gecikme?`aylık %${ST.ayar.gecikme} · gün hesabıyla`:"kapalı"}</em></div>
    </div>
    ${hareket.length?`<div class="tblwrap"><table class="tbl"><thead><tr><th>Tarih</th><th>Açıklama</th><th class="num">Borç</th><th class="num">Ödeme</th><th class="num">Bakiye</th><th></th></tr></thead><tbody>${satir}</tbody></table></div>`:`<p class="mut">Henüz hareket yok.</p>`}
    <div class="arac" style="margin:14px 0 0">
      <button class="btn yesil" data-act="odemeForm" data-id="${d.id}">+ Ödeme gir</button>
      <button class="btn ikincil" data-act="duzForm" data-id="${d.id}">± Borç / indirim</button>
      ${h.toplam>0.5?`<button class="btn ikincil" data-hatir="${d.id}">📲 Hatırlat</button>`:""}
    </div>`, ()=>daireModal(id));
}

const daireId = (blok, no) => `${blok}-${no}`.replace(/[\/\s#?.]+/g,"").toLocaleUpperCase("tr");

/* İçe aktarma: Excel'den yapıştır ya da CSV */
const BASLIK = { blok:/^blok|^bina/i, no:/daire|^no$|kap[ıi] ?no|^d\.? ?no/i, ad:/ad|isim|malik|sakin|unvan/i, tel:/tel|gsm|cep/i, m2:/m2|m²|metrekare|brüt|net/i, aidat:/aidat|tutar/i, devir:/devir|bakiye|borç|borc/i };
function tabloOku(metin){
  const satirlar = metin.replace(/\r/g,"").split("\n").filter(s=>s.trim());
  if (!satirlar.length) return [];
  const ayir = satirlar[0].includes("\t") ? "\t" : satirlar[0].split(";").length > 1 ? ";" : ",";
  return satirlar.map(s=>s.split(ayir).map(x=>x.replace(/^"|"$/g,"").trim()));
}
function daireCoz(metin){
  const T = tabloOku(metin); if (!T.length) return {L:[], kolon:null};
  let kolon = null, veri = T;
  const bas = T[0].map(x=>x.toLocaleLowerCase("tr"));
  if (bas.some(x=>/blok|daire|ad|isim|aidat/.test(x)) && !bas.some(x=>/^\d+$/.test(x))){
    kolon = {}; Object.entries(BASLIK).forEach(([k,re])=>{ const i = bas.findIndex((x,j)=>re.test(x) && !Object.values(kolon).includes(j)); if (i>=0) kolon[k] = i; });
    veri = T.slice(1);
  } else kolon = {blok:0, no:1, ad:2, tel:3, m2:4, aidat:5, devir:6};
  const L = []; const hatali = [];
  veri.forEach((r,i)=>{
    let blok = r[kolon.blok] ?? "", no = r[kolon.no] ?? "";
    if (kolon.blok===undefined || (!no && blok)){ const m = String(blok||no).match(/^([A-ZÇĞİÖŞÜa-zçğıöşü]+\s*\d*)\s*[-\/ ]\s*(\w+)$/); if (m){ blok = m[1]; no = m[2]; } }
    blok = String(blok).trim().toLocaleUpperCase("tr").replace(/\s*BLOK$/,""); no = String(no).trim().toLocaleUpperCase("tr");
    if (!blok || !no){ hatali.push(i+1); return; }
    L.push({id:daireId(blok,no), blok, no, ad:(r[kolon.ad]||"").trim(), tel:(r[kolon.tel]||"").trim(), m2:sayi(r[kolon.m2])||0, aidat:sayi(r[kolon.aidat])||0, devir: kolon.devir!==undefined ? sayi(r[kolon.devir]) : NaN});
  });
  return {L, kolon, hatali};
}

function bankaCoz(metin){
  const T = tabloOku(metin); if (!T.length) return [];
  const bas = T[0].map(x=>x.toLocaleLowerCase("tr"));
  let iT=-1, iA=-1, iTut=-1, iBorc=-1, iAl=-1, veri = T;
  if (bas.some(x=>/tarih|açıklama|aciklama|tutar|alacak/.test(x))){
    iT = bas.findIndex(x=>/tarih/.test(x)); iA = bas.findIndex(x=>/açıklama|aciklama|detay|işlem|islem/.test(x) && !/tarih|tutar/.test(x));
    iTut = bas.findIndex(x=>/^tutar|işlem tutarı|islem tutari|^miktar/.test(x)); iBorc = bas.findIndex(x=>/^borç|^borc/.test(x)); iAl = bas.findIndex(x=>/^alacak/.test(x));
    veri = T.slice(1);
  }
  const tarihMi = s => /^\d{1,2}[.\/-]\d{1,2}[.\/-]\d{2,4}/.test(s);
  return veri.map(r=>{
    const ti = iT>=0 ? iT : r.findIndex(tarihMi); if (ti<0 || !tarihMi(r[ti]||"")) return null;
    const [g,a,y] = r[ti].split(/[.\/\-\s]/).map(Number); const t = new Date(y<100?2000+y:y, a-1, g, 12).getTime();
    let tutar;
    if (iTut>=0) tutar = sayi(r[iTut]); else if (iAl>=0 || iBorc>=0) tutar = (sayi(r[iAl])||0) - (sayi(r[iBorc])||0);
    else { const say = r.map((x,j)=>j!==ti && /\d/.test(x) && /^[-+]?[\d.,\s]+(TL|₺)?$/.test(x.trim()) ? j : -1).filter(j=>j>=0); tutar = say.length ? sayi(r[say[0]]) : NaN; }
    const acik = iA>=0 ? r[iA] : r.filter((x,j)=>j!==ti && !/^[-+]?[\d.,\s]+(TL|₺)?$/.test(x.trim())).sort((p,q)=>q.length-p.length)[0] || "";
    if (isNaN(tutar) || !tutar) return null;
    return {t, acik, tutar};
  }).filter(Boolean);
}
const bRef = r => `${isoGun(r.t)}|${Math.round(r.tutar*100)}|${r.acik.slice(0,60)}`;
function eslestir(L){
  const bloklar = [...new Set(ST.daire.map(d=>d.blok))].sort((a,b)=>b.length-a.length).map(b=>b.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re = bloklar.length ? new RegExp(`(?:^|[^A-ZÇĞİÖŞÜ0-9])(${bloklar.join("|")})\\s*(?:BLOK|BL\\.?)?\\s*[-\\/:. ]*\\s*(?:DAİRE|DAIRE|DA[İI]RE|D\\.?|NO:?|NO\\.?)?\\s*:?\\s*(\\d{1,4})(?![0-9])`) : null;
  const norm = s => String(s).toLocaleUpperCase("tr").replace(/[^A-ZÇĞİÖŞÜ0-9 ]/g," ").replace(/\s+/g," ").trim();
  const islenmis = new Set(); ST.daire.forEach(d=>(d.har||[]).forEach(h=>{ if (!h.iptal && h.ref) islenmis.add(h.ref); }));
  const giderRef = new Set(ST.gider.filter(g=>!g.iptal && g.ref).map(g=>g.ref));
  return L.map(r=>{
    const ref = bRef(r);
    if (r.tutar < 0) return {...r, ref, durum: giderRef.has(ref) ? "islenmis" : "gider", kat: katBul(r.acik), sec: !giderRef.has(ref)};
    if (islenmis.has(ref)) return {...r, ref, durum:"islenmis"};
    const a = norm(r.acik);
    const m = re && (" " + a).match(re);
    if (m){ const id = daireId(m[1], m[2]); if (ST.daire.some(d=>d.id===id)) return {...r, ref, durum:"eslesti", daire:id, neden:"Açıklamada daire numarası var", puan:98}; }
    const adaylar = ST.daire.filter(d=>{ if (!d.ad) return false; const p = norm(d.ad).split(" ").filter(x=>x.length>1); return p.length>=2 && p.every(x=>a.includes(x)); });

    if (adaylar.length > 1) return {...r, ref, durum:"bak", adaylar:adaylar.map(d=>d.id), neden:`${adaylar.length} daire aynı isimde`};
    const tut = ST.daire.filter(d=>{ const h = hesap(d); return Math.abs(h.toplam - r.tutar) < 1 || Math.abs((d.aidat||0) - r.tutar) < 1; });
    return {...r, ref, durum:"bak", adaylar:tut.slice(0,6).map(d=>d.id), neden: tut.length ? `Tutar ${tut.length} daireninkiyle aynı` : "Kime ait olduğu belli değil"};
  });
}

function vGider(){

  const L = ST.gider.filter(g=>ayKey(g.t)===GF.ay).sort((a,b)=>b.t-a.t);
  const gecerli = L.filter(g=>!g.iptal);
  const top = gecerli.reduce((x,g)=>x+g.tutar,0);

  const dil = Object.entries(kat).sort((a,b)=>b[1]-a[1]);
  let ac0 = -Math.PI/2; const R = 80, r0 = 50;
  const arc = top ? dil.map(([k,v])=>{ const a1 = ac0, a2 = ac0 + v/top*Math.PI*2; ac0 = a2; const b = a2-a1 > Math.PI ? 1 : 0;

    return `<path d="M${p(R,a1)} A${R} ${R} 0 ${b} 1 ${p(R,a2-0.0001)} L${p(r0,a2-0.0001)} A${r0} ${r0} 0 ${b} 0 ${p(r0,a1)}Z" fill="${(GKAT[k]||GKAT.diger).renk}"><title>${(GKAT[k]||GKAT.diger).ad} ${tl(v)}</title></path>`; }).join("") : `<circle cx="100" cy="100" r="65" fill="none" stroke="var(--line)" stroke-width="30"/>`;

        ${g.bag && g.bag.length?`<div class="bag"><a data-bag="${g.id}">🔧 ${g.bag.length} kayıtla bağlantılı ${GF.ac[g.id]?"▲":"▼"}</a>
          ${GF.ac[g.id]?`<div class="bagli">${g.bag.map(b=>`<div>${esc(b.metin)}</div>`).join("")}</div>`:""}</div>`:""}
        </td><td class="num"><b>${tl(g.tutar)}</b>${!g.iptal?`<div><a href="#" data-gduz="${g.id}" style="font-size:12px;color:var(--accent);font-weight:700">Düzenle</a> · <a href="#" data-giptal="${g.id}" style="font-size:12px;color:var(--bad);font-weight:700">İptal</a></div>`:""}</td></tr>`).join("")}</tbody></table></div>`:`<div class="bos"><b>Bu ay gider yok</b>"Gider ekle" ya da Banka sekmesinden ekstreyle ekleyin.</div>`}</div>
    <div class="card"><h2>Dağılım</h2>
      <svg viewBox="0 0 200 200" style="width:min(220px,100%);display:block;margin:0 auto 14px">${arc}<text x="100" y="96" text-anchor="middle" font-size="12" fill="var(--muted)" font-weight="700">Toplam</text><text x="100" y="116" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)">${top>=1000?Math.round(top/1000)+" bin ₺":tl(top)}</text></svg>
      <div class="lej">${dil.map(([k,v])=>`<div><i style="background:${(GKAT[k]||GKAT.diger).renk}"></i>${(GKAT[k]||GKAT.diger).ad}<span>${tl(v)}</span></div>`).join("")}</div></div>

  $("#bForm").onsubmit = async e => { e.preventDefault(); const b = {}; document.querySelectorAll("[data-bt]").forEach(i=>{ const v = sayi(i.value); if (v>0) b[i.dataset.bt] = v; });
    try { await DB.ayarYaz({butce:b}); toast("✓ Bütçe kaydedildi"); } catch(err){ hata(err); } };
}

function hata(err){ console.error(err); toast(err && err.code==="permission-denied" ? "Yetki yok: Firebase kuralına muhasebe bölümü eklenmeli" : "Kaydedilemedi: " + (err && (err.code||err.message) || "bağlantı")); }
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act],[data-daire],[data-blok],[data-filtre],[data-git],[data-makbuz],[data-hatir],[data-bag],[data-iptal],[data-duzenle],[data-sil],[data-ice],[data-gduz],[data-giptal],[data-donem],[data-bcoz]");
  if (!t) return;
  if (t.dataset.git){ e.preventDefault(); kapat(); git(t.dataset.git); return; }
  if (t.dataset.daire){ daireModal(t.dataset.daire); return; }
  if (t.dataset.blok){ DF = {ara:"", blok:t.dataset.blok, filtre:"hepsi"}; git("daire"); return; }
  if (t.dataset.filtre){ DF.filtre = t.dataset.filtre; vDaire(); return; }
  if (t.dataset.donem){ RP.donem = t.dataset.donem; vRapor(); return; }
  if (t.dataset.makbuz){ e.preventDefault(); const [a,b] = t.dataset.makbuz.split("|"); makbuzYazdir(a,b); return; }
  if (t.dataset.iptal){ e.preventDefault(); const [a,b] = t.dataset.iptal.split("|"); iptalForm(a,b); return; }
  if (t.dataset.duzenle){ e.preventDefault(); daireDuzenle(t.dataset.duzenle); return; }
  if (t.dataset.ice){ iceAktarModal(t.dataset.ice); return; }
  if (t.dataset.gduz){ e.preventDefault(); giderForm(t.dataset.gduz); return; }
  if (t.dataset.giptal){ e.preventDefault(); giderIptal(t.dataset.giptal); return; }
  if (t.dataset.bcoz){ e.preventDefault(); const r = BNK.satir[+t.dataset.bcoz]; r.durum = "bak"; r.adaylar = [r.daire]; r.neden = "Elle değiştiriliyor"; vBanka(); return; }
  if (t.dataset.sil){ if (!confirm("Bu daire silinsin mi?")) return; try { await DB.daireSil(t.dataset.sil); toast("Daire silindi"); kapat(); } catch(err){ hata(err); } return; }
  if (t.dataset.hatir){ const d = ST.daire.find(x=>x.id===t.dataset.hatir); const n = waNo(d.tel); open(`https://wa.me/${n.length>=11?n:""}?text=` + encodeURIComponent(hatirMetin(d)), "_blank"); return; }
  if (t.dataset.bag){ GF.ac[t.dataset.bag] = !GF.ac[t.dataset.bag]; vGider(); return; }
  const a = t.dataset.act;
  if (a==="kapat") kapat();
  else if (a==="iceAktar") iceAktarModal();
  else if (a==="iceKaydet") iceKaydet();
  else if (a==="odemeForm") hareketForm(t.dataset.id, "ode");
  else if (a==="duzForm") hareketForm(t.dataset.id, "duz");
  else if (a==="giderForm") giderForm(null);
  else if (a==="bankaOku"){ const L = bankaCoz($("#bnkMetin").value); if (!L.length){ toast("Okunabilir hareket bulunamadı. Tarih ve tutar sütunları olmalı."); return; } BNK = {satir: eslestir(L)}; vBanka(); }
  else if (a==="bankaSifir"){ BNK = null; vBanka(); }
  else if (a==="bankaIsle") bankaIsle();
  else if (a==="tahakkuk"){
    const k = $("#tahAy").value, [y,m] = k.split("-").map(Number), vade = new Date(y, m-1, ST.ayar.vadeGun||10, 12).getTime();
    const L = ST.daire.filter(d=>d.aidat>0 && !(d.har||[]).some(h=>!h.iptal && h.tip==="tah" && h.ay===k));
    if (!L.length){ toast("Yazılacak aidat yok"); return; }
    if (!confirm(`${ayAd(k)} için ${L.length} daireye toplam ${tl(L.reduce((s,d)=>s+d.aidat,0))} aidat yazılsın mı?`)) return;
    t.disabled = true; t.textContent = "Yazılıyor…";
    try { await DB.topluHareket(L.map(d=>[d.id, {id:yeniId(), tip:"tah", ay:k, tutar:d.aidat, t:new Date(y,m-1,1,12).getTime(), vade, acik:`${ayAd(k)} aidatı`, ts:NOW(), by:ST.kim}])); toast(`✓ ${L.length} daireye ${ayAd(k)} aidatı yazıldı`); }
    catch(err){ hata(err); } t.disabled = false; t.textContent = "Aidatları oluştur"; tahOnizle();
  }
  else if (a==="topluHatir"){
    const o = ozet(); const L = [...o.borclu].sort((x,y)=>y.h.toplam-x.h.toplam);
    modal(`<div class="bas"><h3>Borç hatırlatmaları · ${L.length} daire</h3><button class="ibtn" data-act="kapat">✕</button></div>
      <p class="note" style="margin:0 0 12px">Her daireye kendi borcunu yazan kişisel mesaj. Telefonu kayıtlıysa doğrudan o kişiye açılır.</p>
      <div class="tblwrap"><table class="tbl"><tbody>${L.map(({d,h})=>`<tr><td><b>${esc(daireAd(d))}</b><div style="font-size:12.5px;color:var(--muted)">${esc(d.ad||"")}${d.tel?"":" · telefon yok"}</div></td><td class="num"><b>${tl(h.toplam)}</b></td><td class="num"><button class="btn kucuk" data-hatir="${d.id}">Gönder</button></td></tr>`).join("")}</tbody></table></div>`);
  }
  else if (a==="yazdir") raporYazdir();
  else if (a==="csvBakiye"){ const o = ozet(); csvIndir(`daire-bakiyeleri-${isoGun(NOW())}.csv`, [["Blok","Daire","Ad Soyad","Telefon","Aylık aidat","Anapara","Gecikme tazminatı","Toplam bakiye","Durum"], ...o.H.sort((x,y)=>sirala(x.d,y.d)).map(({d,h})=>[d.blok,d.no,d.ad||"",d.tel||"",sayiTr(d.aidat),sayiTr(h.anapara),sayiTr(h.gec),sayiTr(h.toplam),durumEt(h)[0]])]); }
  else if (a==="csvGider"){ const [x,y] = donemAralik(); csvIndir(`giderler-${isoGun(NOW())}.csv`, [["Tarih","Kategori","Açıklama","Tutar","Belge","Bağlantılı kayıt","Durum"], ...ST.gider.filter(g=>g.t>=x && g.t<y).sort((p,q)=>p.t-q.t).map(g=>[kTarih(g.t),(GKAT[g.kat]||GKAT.diger).ad,g.aciklama,sayiTr(g.tutar),g.belge||"",(g.bag||[]).map(b=>b.metin).join(" | "),g.iptal?"İptal":""])]); }
  else if (a==="yedek"){ const v = JSON.stringify({surum:1, tarih:new Date().toISOString(), ayar:ST.ayar, daireler:ST.daire, giderler:ST.gider}, null, 1);
    const el = document.createElement("a"); el.href = URL.createObjectURL(new Blob([v],{type:"application/json"})); el.download = `muhasebe-yedek-${isoGun(NOW())}.json`; el.click(); }
});

/* ================= veri katmanı ================= */
function guncelle(){ $("#siteAd").textContent = `${ST.ayar.siteAd||"Site"} · ${ST.daire.length} daire`; cizGec(); }
const PKAT_AD = {p_malzeme:"Malzeme talebi",p_isik:"Aydınlatma",p_kapi:"Kapı / kilit",p_asansor:"Asansör",p_su:"Su / tesisat",p_hasar:"Kırık / hasar",p_bahce:"Bahçe / çevre",p_temiz:"Temizlik / koku",p_diger:"Diğer",p_tasinma:"Taşınma / tadilat"};
const TES_AD = {ariza:"Asansör arızası", bakim:"Asansör bakımı", pompa:"Hidrofor pompa", kesinti:"Elektrik kesintisi", yakit:"Jeneratör yakıt", yangin:"Yangın ekipmanı", tank:"Hidrofor tankı"};
function teknikMetin(tip, k){
  if (tip==="ariza"){ const yer = k.block ? `${k.block}${k.kat?" "+k.kat:""}${k.flat?" D"+k.flat:""}` : (k.alan||"Ortak alan");
    return `${kTarih(k.createdAt||0)} · ${yer} · ${PKAT_AD[k.cat] || (k.src==="personel"?"Personel bildirimi":"Daire arızası")}${k.desc?": "+String(k.desc).slice(0,70):""}${k.status==="tamamlandi"?" ✓":""}`; }
  return `${kTarih(k.ts||0)} · ${TES_AD[k.tur]||k.tur} · ${k.ekipman||""}${k.not?": "+String(k.not).slice(0,60):""}${k.olay?" ("+k.olay+")":""}`;
}

async function canli(){
  const cfg = window.FB_CONFIG;
  const V = "10.12.2", U = `https://www.gstatic.com/firebasejs/${V}/`;
  const [app, fs, au] = await Promise.all([import(U+"firebase-app.js"), import(U+"firebase-firestore.js"), import(U+"firebase-auth.js")]);
  const ap = app.initializeApp(cfg), db = fs.getFirestore(ap), auth = au.getAuth(ap);
  const izinli = e => (window.FB_TEKNISYEN||[]).map(x=>x.toLowerCase()).includes((e||"").toLowerCase());
  const cD = fs.collection(db,"muhasebe","veri","daireler"), cG = fs.collection(db,"muhasebe","veri","giderler"), rA = fs.doc(db,"muhasebe","ayar");
  DB = {
    async daireYaz(L){ for (let i=0;i<L.length;i+=400){ const b = fs.writeBatch(db); L.slice(i,i+400).forEach(({id,...v})=>b.set(fs.doc(cD,id), v, {merge:true})); await b.commit(); } },
    async daireSil(id){ await fs.deleteDoc(fs.doc(cD,id)); },
    async hareketEkle(id, H){ await fs.updateDoc(fs.doc(cD,id), {har: fs.arrayUnion(...H)}); },
    async topluHareket(L){ const grup = {}; L.forEach(([id,h])=>(grup[id] ||= []).push(h)); const E = Object.entries(grup);
      for (let i=0;i<E.length;i+=400){ const b = fs.writeBatch(db); E.slice(i,i+400).forEach(([id,H])=>b.update(fs.doc(cD,id), {har: fs.arrayUnion(...H)})); await b.commit(); } },
    async hareketIptal(id, hid, not){ await fs.runTransaction(db, async tx => { const r = fs.doc(cD,id); const s = await tx.get(r); const har = (s.data().har||[]).map(h=>h.id===hid ? {...h, iptal:true, iptalNot:not, iptalTs:Date.now(), iptalBy:ST.kim} : h); tx.update(r, {har}); }); },
    async giderEkle(g){ await fs.addDoc(cG, g); },
    async giderGuncelle(id, v){ await fs.updateDoc(fs.doc(cG,id), v); },
    async ayarYaz(v){ await fs.setDoc(rA, v, {merge:true}); },
    async teknikKayitlar(){ const sinir = Date.now() - 90*GUN;
      const [ap1, ts1] = await Promise.all([ fs.getDocs(fs.query(fs.collection(db,"appointments"), fs.where("createdAt",">=",sinir))), fs.getDocs(fs.query(fs.collection(db,"tesis"), fs.where("ts",">=",sinir))) ]);
      const A = ap1.docs.map(d=>({id:d.id, ...d.data()})).filter(k=>k.status!=="iptal" && k.cat!=="p_gelemiyorum").sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(k=>({tip:"ariza", id:k.id, metin:teknikMetin("ariza",k)}));
      const T = ts1.docs.map(d=>({id:d.id, ...d.data()})).filter(k=>["ariza","pompa","bakim","yakit","yangin","tank"].includes(k.tur)).sort((a,b)=>(b.ts||0)-(a.ts||0)).map(k=>({tip:"tesis", id:k.id, metin:teknikMetin("tesis",k)}));
      return [...A, ...T]; }
  };
  $("#girisForm").onsubmit = async e => { e.preventDefault(); $("#gHata").textContent = "";
    try { await au.signInWithEmailAndPassword(auth, $("#gEmail").value.trim(), $("#gSifre").value); } catch(_){ $("#gHata").textContent = "E-posta veya şifre hatalı."; } };
  let unsub = [];
  au.onAuthStateChanged(auth, u => {
    unsub.forEach(f=>f()); unsub = [];
    if (!u || u.isAnonymous || !izinli(u.email)){ $("#app").hidden = true; $("#giris").hidden = false; if (u && !u.isAnonymous && !izinli(u.email)) $("#gHata").textContent = "Bu sayfa sadece teknisyen hesabı içindir."; return; }
    ST.kim = u.email; $("#giris").hidden = true; $("#app").hidden = false; sekmeler(); ciz();
    const hataDin = err => { console.error(err); $("#durum").textContent = err.code==="permission-denied" ? "⚠️ Kural eksik" : "⚠️ Bağlantı"; if (err.code==="permission-denied") toast("Firebase kuralına muhasebe bölümünü ekleyin"); };
    unsub.push(fs.onSnapshot(rA, s=>{ if (s.exists()) ST.ayar = {...ST.ayar, ...s.data()}; ST.yuklendi.a = true; guncelle(); }, hataDin));
    unsub.push(fs.onSnapshot(cD, s=>{ ST.daire = s.docs.map(d=>({id:d.id, har:[], ...d.data()})); ST.yuklendi.d = true; $("#durum").textContent = "● Canlı"; guncelle(); }, hataDin));
    unsub.push(fs.onSnapshot(cG, s=>{ ST.gider = s.docs.map(d=>({id:d.id, bag:[], ...d.data()})); ST.yuklendi.g = true; guncelle(); }, hataDin));
  });
}
/* Test için bellek katmanı (yalnızca FB_CONFIG yoksa) */
function bellek(){
  const yay = () => { ST.daire = ST.daire.map(d=>({...d})); guncelle(); };
  DB = {
    async daireYaz(L){ L.forEach(({id,...v})=>{ const d = ST.daire.find(x=>x.id===id); if (d) Object.assign(d, v); else ST.daire.push({id, har:[], ...v}); }); yay(); },
    async daireSil(id){ ST.daire = ST.daire.filter(d=>d.id!==id); yay(); },
    async hareketEkle(id, H){ const d = ST.daire.find(x=>x.id===id); d.har = [...(d.har||[]), ...H]; yay(); },
    async topluHareket(L){ L.forEach(([id,h])=>{ const d = ST.daire.find(x=>x.id===id); d.har = [...(d.har||[]), h]; }); yay(); },
    async hareketIptal(id, hid, not){ const d = ST.daire.find(x=>x.id===id); d.har = d.har.map(h=>h.id===hid ? {...h, iptal:true, iptalNot:not, iptalTs:Date.now()} : h); yay(); },
    async giderEkle(g){ ST.gider.push({id:yeniId(), bag:[], ...g}); yay(); },
    async giderGuncelle(id, v){ const g = ST.gider.find(x=>x.id===id); Object.assign(g, v); yay(); },
    async ayarYaz(v){ ST.ayar = {...ST.ayar, ...v}; yay(); },
    async teknikKayitlar(){ const t = Date.now(); return [
      {tip:"ariza", id:"a1", metin:teknikMetin("ariza",{createdAt:t-3*GUN, block:"B3", cat:"p_asansor", src:"personel", desc:"Asansör 2 kapısı kapanmıyor"})},
      {tip:"tesis", id:"t1", metin:teknikMetin("tesis",{ts:t-4*GUN, tur:"ariza", ekipman:"B3-2", not:"Kapı kartı arızası"})},
      {tip:"tesis", id:"t2", metin:teknikMetin("tesis",{ts:t-9*GUN, tur:"pompa", ekipman:"H-C1C2:UP2", olay:"tamire"})} ]; }
  };
  $("#durum").textContent = "Test · bellek"; $("#giris").hidden = true; $("#app").hidden = false; sekmeler(); guncelle();
}
const h0 = location.hash.slice(1); if (SEKME.some(([k])=>k===h0)) AKTIF = h0;
window.__MUH = {ST, hesap, ozet, eslestir, bankaCoz, daireCoz, get DB(){ return DB; }};
if (window.FB_CONFIG) canli().catch(e=>{ console.error(e); $("#giris").hidden = false; $("#gHata").textContent = "Bağlantı kurulamadı, sayfayı yenileyin."; });
else bellek();
